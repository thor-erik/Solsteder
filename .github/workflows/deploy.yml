name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject API keys
        run: |
          echo "const MAPBOX_TOKEN = '${{ secrets.MAPBOX_TOKEN }}';" > js/config.js
          echo "const GOOGLE_PLACES_KEY = '${{ secrets.GOOGLE_PLACES_KEY }}';" >> js/config.js

      - name: Minify JS
        run: |
          npm install --no-save terser@5
          for f in js/*.js; do
            echo "Minifying $f..."
            ./node_modules/.bin/terser --compress --mangle -- "$f" -o "$f.tmp"
            mv "$f.tmp" "$f"
            echo "  Done: $(wc -c < "$f") bytes"
          done

      - name: Inject cache-busting version
        run: |
          SHA=$(git rev-parse --short HEAD)
          # Update existing ?v=... params to the current commit hash
          sed -i "s/?v=[A-Za-z0-9]*\"/?v=${SHA}\"/g" index.html
          # Add ?v=... to local .js files that don't have one yet
          sed -i "s/\.js\"/.js?v=${SHA}\"/g" index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - uses: actions/deploy-pages@v4
        id: deployment
