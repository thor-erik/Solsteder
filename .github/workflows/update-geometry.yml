#
name: Update building geometry

on:
  schedule:
    - cron: '0 3 * * 1'   # 03:00 UTC every Monday (building geometry changes rarely)
  workflow_dispatch:        # manual trigger from Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate geometry
        run: node scripts/update-geometry.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/geometry.json
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: update building geometry [skip ci]"
          git push
