name: Discover new venues

# Runs monthly to find new venues and flag closed ones.
# Writes to data/venues-fetched.json — requires manual review and merge.
# New candidates are uploaded as a workflow artifact for review.

on:
  schedule:
    - cron: '0 5 1 * *'      # 05:00 UTC on the 1st of every month
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Write .env
        # Server-side key has no HTTP referrer restriction (website key
        # rejects empty-referrer calls from CI). Same env var name so
        # scripts don't need to know the difference.
        run: echo "GOOGLE_PLACES_KEY=${{ secrets.GOOGLE_PLACES_KEY_SERVER }}" > .env

      # Refresh the OSM universe so the discovery anchor grid reflects
      # current restaurant/bar/cafe density. OSM only — free.
      - name: Refresh candidates universe (OSM only)
        run: node scripts/fetch-oslo-candidates.mjs --osm-only

      - name: Discover venues
        run: node scripts/fetch-venues-places.mjs

      - name: Upload discovery output for review
        uses: actions/upload-artifact@v4
        with:
          name: venues-discovery-${{ github.run_id }}
          path: |
            data/venues-fetched.json
            data/venues-review.json
            data/venues-osm-unresolved.json
            data/discovery.meta.json
          retention-days: 30

      - name: Open issue if new candidates found
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(node -e "
            const fs = require('fs');
            try {
              const d = JSON.parse(fs.readFileSync('data/venues-fetched.json','utf8'));
              console.log(d.length);
            } catch { console.log(0); }
          ")
          if [ "$COUNT" -gt "0" ]; then
            gh issue create \
              --title "[$COUNT new venues] Monthly discovery run — review venues-fetched.json" \
              --body "## Monthly venue discovery

          **$COUNT high-confidence candidates** found. Download the artifact from [this run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) to review.

          ### Files in the \`venues-discovery-${{ github.run_id }}\` artifact
          - \`venues-fetched.json\` — HIGH confidence (auto-mergeable)
          - \`venues-review.json\` — LOW confidence single-signal hits (eyeball before merging)
          - \`venues-osm-unresolved.json\` — OSM-tagged terraces with no Google match
          - \`discovery.meta.json\` — run timestamps and counts

          ### Next steps
          1. Spot-check \`venues-review.json\` and promote keepers to \`venues-fetched.json\`.
          2. Run \`node scripts/merge-venues.mjs\` locally (it validates against the schema).
          3. Run \`node scripts/update-geometry.mjs\` (or trigger the \`Update building geometry\` workflow).
          4. Commit and push.

          *Generated by GitHub Actions*" \
              --label "venue-discovery" || true
          else
            echo "No new candidates found."
          fi
