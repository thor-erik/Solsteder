name: Discover new venues

# Runs monthly to find new venues and flag closed ones.
# Writes to data/venues-fetched.json — requires manual review and merge.
# New candidates are uploaded as a workflow artifact for review.

on:
  schedule:
    - cron: '0 5 1 * *'      # 05:00 UTC on the 1st of every month
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Write .env
        run: echo "GOOGLE_PLACES_KEY=${{ secrets.GOOGLE_PLACES_KEY }}" > .env

      # Refresh the OSM universe so the discovery anchor grid reflects
      # current restaurant/bar/cafe density. OSM only — free.
      - name: Refresh candidates universe (OSM only)
        run: node scripts/fetch-oslo-candidates.mjs --osm-only

      - name: Discover venues
        run: node scripts/fetch-venues-places.mjs

      - name: Upload candidates for review
        uses: actions/upload-artifact@v4
        with:
          name: venues-fetched-${{ github.run_id }}
          path: data/venues-fetched.json
          retention-days: 30

      - name: Open issue if new candidates found
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(node -e "
            const fs = require('fs');
            try {
              const d = JSON.parse(fs.readFileSync('data/venues-fetched.json','utf8'));
              console.log(d.length);
            } catch { console.log(0); }
          ")
          if [ "$COUNT" -gt "0" ]; then
            gh issue create \
              --title "[$COUNT new venues] Monthly discovery run — review venues-fetched.json" \
              --body "## Monthly venue discovery

          **$COUNT new candidates** found. Download the artifact from [this run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) to review.

          ### Next steps
          1. Download \`venues-fetched-${{ github.run_id }}\` artifact
          2. Review \`venues-fetched.json\` — check \`discoverySignal\` field (\`both\` = highest confidence)
          3. Remove any false positives
          4. Run \`node scripts/merge-venues.mjs\` locally
          5. Run \`node scripts/update-geometry.mjs\` to compute solar geometry
          6. Commit and push

          *Generated by GitHub Actions*" \
              --label "venue-discovery" || true
          else
            echo "No new candidates found."
          fi
