  /* Weather segments — flat by default, track clips outer edges */
  .timeline-track .wx {
    position: absolute;
    top: 0;
    bottom: 0;
    border-radius: 0;
  }

  /* Shadow boundary caps — rounded ends at shadow gap edges */
  .timeline-track .cap-l         { border-radius: 4px 0 0 4px; }
  .timeline-track .cap-r         { border-radius: 0 4px 4px 0; }
  .timeline-track .cap-l.cap-r   { border-radius: 4px; }

  .card-emoji {
    font-size: 18px;
    flex-shrink: 0;
  }

  .card-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  .card-badge.sunny {
    background: rgba(255,175,133,0.2);
    color: var(--accent);
  }

  .card-badge.shaded {
    background: rgba(138,154,176,0.15);
    color: var(--muted);
  }
  .card-badge.opening-soon {
    background: rgba(156,189,231,0.15);
    color: #9CBDE7;
  }
  .card-badge.closing-soon {
    background: rgba(255,140,60,0.15);
    color: #ffaa55;
  }
  .card-badge.neutral {
    background: rgba(138,154,176,0.15);
    color: #9CBDE7;
  }

  .card-body {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  /* Score badge pill — unified style per design spec */
  .card-sun-badge {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    white-space: nowrap;
    background: rgba(255,175,133,0.15);
    color: #FFAF85;
  }
  .card-sun-badge.tier-high,
  .card-sun-badge.tier-mid,
  .card-sun-badge.tier-low,
  .card-sun-badge.tier-poor {
    background: rgba(255,175,133,0.15);
    color: #FFAF85;
    border: none;
    box-shadow: none;
  }
  /* Sun status line */
  .card-sun-line {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .card-sun-line.sunny        { color: var(--accent); }
  .card-sun-line.overcast     { color: rgba(165,170,178,0.85); }
  .card-sun-line.rainy        { color: rgba(156,189,231,0.85); }
  .card-sun-line.neutral      { color: rgba(165,170,178,0.85); }
  .card-sun-line.muted        { color: var(--muted); opacity: 0.55; }
  .card-sun-line.opening-soon { color: #9CBDE7; }
  .card-sun-line.closing-soon { color: #ffaa55; }

  .card-watch {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-content {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .card-top-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 6px;
  }

  /* ── Card sun row: dial + duration left, label+time pushed right ─────── */
  .card-sun-row {
    display: flex;
    align-items: center;
    position: relative;
  }
  .card-sun-row::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 10%;
    height: 80%;
    width: 1px;
    background: rgba(156,189,231,0.15);
    pointer-events: none;
  }
  /* Left half: dial + duration centered in available space */
  .card-sun-left {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .card-dial-col {
    flex-shrink: 0;
  }
  .card-dial {
    display: block;
    opacity: 0.92;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.35));
  }
  .card-sun-dur {
    flex-shrink: 0;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
  }
  .card-sun-dur.dur-sunny    { color: rgba(255,175,133,0.82); }
  .card-sun-dur.dur-cloudy   { color: rgba(156,189,231,0.65); }
  .card-sun-dur.dur-overcast { color: rgba(165,170,178,0.82); }
  .card-sun-dur.dur-rainy    { color: rgba(156,189,231,0.82); }
  /* Right block: left-aligned within its half */
  .card-sun-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 2px;
    min-width: 0;
    padding-left: 8px;
  }
  .card-sun-label {
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #9CBDE7;
  }
  .card-sun-info.sunny        .card-sun-label { color: rgba(255,175,133,0.65); }
  .card-sun-info.overcast     .card-sun-label { color: rgba(165,170,178,0.65); }
  .card-sun-info.rainy        .card-sun-label { color: rgba(156,189,231,0.65); }
  .card-sun-info.neutral      .card-sun-label { color: rgba(165,170,178,0.65); }
  .card-sun-info.opening-soon .card-sun-label { color: rgba(156,189,231,0.65); }
  .card-sun-info.closing-soon .card-sun-label { color: rgba(255,170,85,0.65); }
  .card-sun-time {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 24px;
    color: #FFF2EB;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .card-sun-info.sunny    .card-sun-time { color: var(--accent); }
  .card-sun-info.overcast .card-sun-time { color: rgba(165,170,178,0.9); }
  .card-sun-info.rainy    .card-sun-time { color: rgba(156,189,231,0.9); }
  .card-sun-info.neutral  .card-sun-time { color: rgba(165,170,178,0.9); }

  .card-score-num {
    flex-shrink: 0;
    font-family: 'Inter', sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    text-align: right;
  }
  .card-score-num span {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 8px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    opacity: 0.5;
    margin-top: 1px;
  }
  .card-score-num.tier-high { color: #FFAF85; }
  .card-score-num.tier-mid  { color: rgba(156,189,231,0.8); }
  .card-score-num.tier-low  { color: #a8a482; }
  .card-score-num.tier-poor { color: #78a0d8; }

  /* Bloom glow — radiates from the top-right corner, gold→blue by score */
  .card-bloom {
    position: absolute;
    top: 0; right: 0;
    width: 190px; height: 160px;
    pointer-events: none;
  }
  .card-bloom.tier-high { background: radial-gradient(circle at top right, rgba(255,175,133,0.30) 0%, transparent 65%); }
  .card-bloom.tier-mid  { background: radial-gradient(circle at top right, rgba(220,172,55,0.20) 0%, transparent 65%); }
  .card-bloom.tier-low  { background: radial-gradient(circle at top right, rgba(168,164,130,0.13) 0%, transparent 65%); }
  .card-bloom.tier-poor { background: radial-gradient(circle at top right, rgba(120,158,210,0.09) 0%, transparent 65%); }

  .card-dial-label {
    font-size: 10px;
    font-weight: 600;
    color: rgba(255,175,133,0.75);
    letter-spacing: 0.1px;
  }

  /* ── Skeleton placeholder cards (after-sunset state) ─────────────── */
  .venue-card.skeleton {
    pointer-events: none;
    opacity: 0.28;
    animation: none;
  }
  .skel {
    background: rgba(156,189,231,0.25);
    border-radius: 4px;
  }
  .skel-watch {
    width: 72px; height: 72px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .skel-line { height: 9px; border-radius: 3px; }
  .skel-score-block {
    width: 28px; height: 36px;
    border-radius: 6px;
    flex-shrink: 0;
    align-self: center;
  }

  /* ── Arc frozen state (after sunset, today only) ──────────────────── */
  .arc-frozen #bottom-arc-row  { pointer-events: none; opacity: 0.35; }
  .arc-frozen #time-presets-row { pointer-events: none; opacity: 0.35; }

  /* ── Expanded section (visible when .selected) ─────────────────────── */
  .card-expanded {
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 0.22s ease, opacity 0.18s ease;
  }

  .venue-card.selected .card-expanded {
    max-height: 120px;
    opacity: 1;
  }

  .card-score-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    margin-bottom: 4px;
  }

  .score-detail-inline {
    font-size: 11px;
    color: var(--muted);
    opacity: 0.8;
  }

  .card-address {
    font-size: 11px;
    color: var(--muted);
    opacity: 0.7;
    margin-bottom: 8px;
  }

  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: 4px;
    margin-bottom: 2px;
  }

  .card-action-btn {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 8px;
    border: 1px solid rgba(156,189,231,0.22);
    background: rgba(156,189,231,0.1);
    color: var(--text);
    cursor: pointer;
    text-decoration: none;
    letter-spacing: 0.2px;
    transition: background 0.12s;
  }

  .card-action-btn:hover {
    background: rgba(156,189,231,0.2);
  }

  #hover-tooltip {
    position: absolute;
    z-index: 1100;
    background: var(--glass-action-bg);
    backdrop-filter: var(--glass-blur-action);
    -webkit-backdrop-filter: var(--glass-blur-action);
    border: var(--glass-border);
    border-radius: 10px;
    padding: 10px 14px;
    pointer-events: none;
    display: none;
    width: 220px;
    box-shadow: var(--glass-inset), 0 4px 24px rgba(0,0,0,0.5);
  }

  #hover-tooltip.visible { display: block; }

  .ht-name {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ht-meta {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .ht-status {
    font-size: 11px;
    font-weight: 600;
    margin-top: 4px;
    display: flex;
    gap: 6px;
    align-items: baseline;
  }
  .ht-status-main { white-space: nowrap; }
  .ht-status-sub  { font-weight: 500; opacity: 0.65; white-space: nowrap; }

  .ht-status.state-sun    { color: var(--accent); }
  .ht-status.state-shadow { color: rgba(165,170,178,0.9); }
  .ht-status.state-rain   { color: rgba(156,189,231,0.9); }
  .ht-status.state-done   { color: var(--muted); }

  .ht-timeline { margin-top: 9px; }
  /* Card timeline reused inside tooltip */
  #hover-tooltip .card-timeline { margin-top: 6px; }

  .ht-tl-track {
    height: 5px;
    background: rgba(156,189,231,0.2);
    border-radius: 3px;
    position: relative;
    margin-bottom: 4px;
    overflow: visible;
  }

  .ht-tl-seg {
    position: absolute;
    top: 0;
    height: 100%;
    background: linear-gradient(90deg, #FF9966, #FFAF85);
    border-radius: 3px;
    opacity: 0.85;
  }

  .ht-tl-needle {
    position: absolute;
    top: -3px;
    width: 2px;
    height: 11px;
    background: #fff;
    border-radius: 1px;
    transform: translateX(-50%);
    box-shadow: 0 0 3px rgba(255,255,255,0.5);
  }

  .ht-tl-labels {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: var(--muted);
    opacity: 0.6;
    margin-top: 2px;
  }

  #map-toast {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%) translateY(-8px);
    z-index: 950;
    background: var(--glass-action-bg);
    backdrop-filter: var(--glass-blur-action);
    -webkit-backdrop-filter: var(--glass-blur-action);
    border: var(--glass-border);
    border-radius: 12px;
    box-shadow: var(--glass-inset), 0 4px 20px rgba(0,0,0,0.40);
    padding: 8px 14px;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #map-toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  @keyframes toast-spin {
    to { transform: rotate(360deg); }
  }
  #map-toast::before {
    content: '';
    width: 12px;
    height: 12px;
    border: 1.5px solid rgba(156,189,231,0.2);
    border-top-color: rgba(255,175,133,0.7);
    border-radius: 50%;
    animation: toast-spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  #map-toast.done::before {
    border: 1.5px solid rgba(100,255,180,0.5);
    animation: none;
  }

  /* ── Mobile — bottom sheet ────────────────────────────────────────── */
  @media (max-width: 639px) {
    /* Hide brand logo — saves top-right space */
    #floating-brand { display: none; }

    #floating-search {
      left: 6px;
      right: 6px;
      width: auto;
      top: 12px;
    }

    /* Logged-in profile panel goes full-screen on mobile so the Invitations
       inbox + settings remain reachable via scroll. Logged-out variant
       already takes over the full screen via the .logged-out rule below.
       Mobile uses a simple fade — overrides the desktop slide-in animation. */
    #profile-panel {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100svh;
      max-height: 100svh;
      border-radius: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      z-index: 9990;
      transform: none;
      transition: opacity 0.25s ease;
    }
    .profile-panel-mobile-bar {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 10px;
      background:
        linear-gradient(135deg, rgba(20,46,82,0.40), rgba(32,73,131,0.22)),
        rgba(20,46,82,0.96);
      backdrop-filter: blur(14px) saturate(170%);
      -webkit-backdrop-filter: blur(14px) saturate(170%);
      border-bottom: 1px solid rgba(156,189,231,0.12);
    }
    .profile-panel-mobile-back {
      background: rgba(156,189,231,0.14);
      border: none;
      border-radius: 50%;
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text);
      cursor: pointer;
      flex-shrink: 0;
    }
    .profile-panel-mobile-back:hover { background: rgba(156,189,231,0.22); }
    .profile-panel-mobile-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    /* Hide the bottom qc-wrap and other floating chrome while the panel is up */
    body.profile-panel-open #qc-wrap,
    body.profile-panel-open #floating-search,
    body.profile-panel-open #floating-brand,
    body.profile-panel-open #panel,
    body.profile-panel-open #detail-panel {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    /* Logged-out: mobile typography overrides. Layout (flex, padding) lives in
       the global #profile-panel.logged-out rules above. */
    #profile-panel.logged-out .login-slide-icon { width: 72px; height: 72px; margin-bottom: 16px; }
    #profile-panel.logged-out .login-slide-icon svg { width: 56px; height: 56px; }
    #profile-panel.logged-out .login-hero-title {
      font-size: 24px; max-width: 320px; margin: 0 auto 24px;
    }
    #profile-panel.logged-out .login-slide-title { font-size: 17px; margin-bottom: 8px; }
    #profile-panel.logged-out .login-slide-body { max-width: 320px; font-size: 14px; }

    #zoom-debug {
      left: 6px;
      right: 6px;
      top: calc(12px + 46px + 8px + 50px);
      transform: none;
      width: auto;
      text-align: center;
    }

    /* Venue list — peek state height driven by --peek-h CSS var, set by JS */
    #panel {
      position: fixed;  /* fixed avoids parent height/overflow issues on iOS */
      top: auto;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 50svh;    /* svh = small viewport height: stable, unaffected by toolbar */
      border-radius: 20px 20px 0 0;
      border-left: none;
      border-right: none;
      border-bottom: none;
      transform: translateY(calc(100% - var(--peek-h, 252px))) translateZ(0);
      transition: transform 0.34s cubic-bezier(0.25, 0.9, 0.4, 1), height 0.34s cubic-bezier(0.25, 0.9, 0.4, 1);
      will-change: transform, height;
      backface-visibility: hidden;
    }

    /* Expanded state — tap handle to open */
    #panel.mobile-expanded {
      transform: translateY(0);
      z-index: 910;  /* zoom-jog (900) sits behind list; locate-btn (920) stays on top */
    }

    /* Fully hidden (covered by detail panel) — slides down behind the morphed card.
       Transition matches the panel morph (320ms) so list and detail move together. */
    #panel.mobile-hidden {
      transform: translateY(calc(100% + 20px)) !important;
      opacity: 0 !important;
      pointer-events: none !important;
      transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.22s ease !important;
    }

    #panel-toggle-icon { display: none; }

    /* FTS: mobile full-width minus space for locate-btn at right end.
       When the detail panel is open, locate-me is hidden, so FTS expands.
       Bottom transition matches the panel's transform transition (0.34s)
       so the slider follows the sheet smoothly through state changes. */
    body.fts #fts {
      left: 12px; right: calc(12px + 34px + 8px);  /* locate-btn (34) + gap (8) */
      width: auto;
      bottom: var(--fts-bottom, 160px);
      transition: bottom 0.34s cubic-bezier(0.25, 0.9, 0.4, 1), right 0.22s ease;
      will-change: bottom;
      padding: 0;
      gap: 8px;
    }
    body.fts:has(#detail-panel.open) #fts {
      right: 12px;  /* fill the locate-me space when it's hidden */
    }


    /* Locate button: sits at right end of FTS row (vertically aligned).
       Bottom transition matches panel + FTS so it follows the sheet
       through state changes instead of snapping to the new position. */
    #locate-btn { bottom: calc(var(--peek-h, 252px) + 14px); right: 12px; }
    body.fts #locate-btn { bottom: var(--fts-bottom, 160px); right: 12px; transition: bottom 0.34s cubic-bezier(0.25, 0.9, 0.4, 1), opacity 0.25s ease; }

    /* Zoom jog: sits above locate-btn on mobile (10px gap) */
    #zoom-jog { right: 12px; }
    #zoom-jog { bottom: calc(var(--peek-h, 252px) + 14px + 34px + 10px); }
    body.fts #zoom-jog { bottom: calc(var(--fts-bottom, 160px) + 34px + 10px); transition: bottom 0.34s cubic-bezier(0.25, 0.9, 0.4, 1), opacity 0.25s ease; }

    /* Handle: grabber pill only — chevron retired (venue peek carries swipe-up signal) */
    #panel-handle {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0 4px;
      flex-shrink: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #panel-handle-pill {
      width: 36px;
      height: 4px;
      background: rgba(156,189,231,0.25);
      border-radius: 2px;
    }

    /* Venue peek: top of first card visible in collapsed state.
       max-height tuned so the card name + meta + first row are readable. */
    #venue-peek {
      flex-shrink: 0;
      padding: 0 14px;
      overflow: hidden;
      max-height: 92px;
      /* mask-image fades the bottom of the peek row */
      -webkit-mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
      mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
    }

    /* Hide peek when list is visible */
    #panel.mobile-expanded #venue-peek,
    #panel.mobile-fullscreen #venue-peek {
      display: none;
    }

    /* Venue card inside peek inherits list card styles — disable interaction
       so drag-to-expand works. The onclick won't fire thanks to pointer-events. */
    #venue-peek .venue-card {
      pointer-events: none;
      margin-bottom: 0;
    }

    /* Hide venue-count and the now-empty venue-header row on mobile */
    #venue-count { display: none; }
    #venue-header { display: none; }

    /* List sun header: chips left, sort toggle right. The sort chip stays
       visible in every panel state — tapping it from peek auto-expands the
       panel before opening the dropdown (see toggleSortPanel). */
    #list-sun-header { padding: 4px 14px 6px !important; }
    #list-sun-header #sort-toggle-btn {
      transition: border-color 0.12s, background 0.12s;
    }

    #panel-header { padding-top: 0; }

    #venue-list {
      padding: 6px 16px 32px;
      overscroll-behavior-y: none;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 16px, black 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 16px, black 100%);
    }

    .venue-card {
      padding: 14px 16px;
      margin-bottom: 10px;
      border-radius: 14px;
    }

    .card-badge   { font-size: 11px; padding: 4px 11px; }
    .area-chip    { font-size: 12px; padding: 6px 13px; }
    .sort-btn     { font-size: 15px; padding: 12px 16px; }

    .card-action-btn { font-size: 12px; padding: 8px 16px; }
    .card-actions    { gap: 10px; }

    .card-expanded { max-height: 0; }
    .venue-card.selected .card-expanded { max-height: 160px; }

    /* Hide Mapbox zoom/compass controls — gesture-only on mobile */
    .mapboxgl-ctrl-bottom-right,
    .mapboxgl-ctrl-bottom-left,
    .mapboxgl-ctrl-top-right,
    .mapboxgl-ctrl-top-left,
    .mapboxgl-ctrl-group,
    .mapboxgl-ctrl-attrib { display: none !important; }

    /* Peek state: the visible portion (handle, sun-header, venue-peek) must
       capture touch for drag-to-expand. touch-action: none tells the browser
       not to handle pan gestures natively — our JS touchmove does it. */
    #panel:not(.mobile-expanded):not(.mobile-hidden):not(.mobile-fullscreen) {
      touch-action: none;
    }

    /* Fullscreen state: panel covers everything */
    #panel.mobile-fullscreen {
      transform: translateY(0);
      height: 100svh;
      border-radius: 0;
      z-index: 910;
    }

    /* Kill expensive effects while the user is actively dragging the panel */
    #panel.panel-dragging {
      transition: none !important;
    }
    #panel.panel-dragging .venue-card {
      animation: none !important;
      transition: none !important;
    }
  }

  /* ── Edit mode overlay — bottom-anchored sheet on every viewport ─────────── */
  #edit-overlay {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 920;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: min(480px, calc(100vw - 32px));
    pointer-events: auto;
  }

  #edit-banner {
    position: relative;
    background: var(--glass-panel-bg);
    backdrop-filter: var(--glass-blur-panel);
    -webkit-backdrop-filter: var(--glass-blur-panel);
    border: var(--glass-border);
    border-radius: 18px;
    padding: 6px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: var(--glass-inset), 0 12px 36px rgba(0,0,0,0.55);
    width: 100%;
  }

  /* Drag handle: always visible at the top of the panel */
  .edit-grabber {
    width: 36px;
    height: 4px;
    border-radius: 999px;
    background: rgba(156,189,231,0.40);
    margin: 4px auto 2px;
    flex-shrink: 0;
    display: block;
  }

  #edit-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-height: 24px;
  }

  #edit-title {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: #FFAF85;
    flex-shrink: 0;
    letter-spacing: 0;
  }

  #edit-venue-label {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: #FFF2EB;
    padding: 3px 10px;
    background: rgba(156,189,231,0.12);
    border-radius: 999px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 60%;
    line-height: 1.3;
  }

  /* Tools row: AI helper chips — floats ABOVE the banner / FTS.
     Default (FTS visible): chips sit 8px above the FTS pill (FTS pill height
     ≈ 46px → 46 + 8 gap = 54px above the panel-top anchor in --fts-bottom).
     Satellite on (FTS hidden): chips collapse onto --fts-bottom directly so
     the gap to the panel matches the regular FTS→panel gap. */
  #edit-tools-row {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(var(--fts-bottom, 240px) + 54px);
    transition: bottom 0.22s ease, opacity 0.18s ease;
    display: none;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    width: min(480px, calc(100vw - 32px));
    z-index: 920;
    pointer-events: auto;
  }

  body.edit-mode #edit-tools-row { display: flex; }
  body.edit-mode.edit-satellite #edit-tools-row {
    bottom: var(--fts-bottom, 240px);
  }

  .edit-chip {
    background: rgba(20,46,82,0.55);
    backdrop-filter: blur(10px) saturate(160%) brightness(0.92);
    -webkit-backdrop-filter: blur(10px) saturate(160%) brightness(0.92);
    border: 1px solid rgba(156,189,231,0.22);
    border-radius: 999px;
    color: #9CBDE7;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 12px;
    cursor: pointer;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    line-height: 1;
    height: 30px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.28);
  }

  .edit-chip:hover { color: #FFF2EB; border-color: rgba(156,189,231,0.40); }

  .edit-chip.active {
    color: #FFAF85;
    border-color: rgba(255,175,133,0.45);
    background: rgba(255,175,133,0.12);
  }

  .edit-chip[hidden] { display: none; }

  /* Type dropdown + map-mode toggle: both content-sized, type pinned left,
     toggle pinned right (matches the chip rhythm — no stretched-pill empty
     space). */
  #edit-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: space-between;
  }

  #edit-type-dropdown {
    position: relative;
    flex: 0 0 auto;
  }

  .edit-type-trigger {
    background: var(--glass-action-bg);
    border: 1px solid rgba(156,189,231,0.18);
    border-radius: 999px;
    color: #FFF2EB;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 0 12px 0 16px;
    height: 36px;
    cursor: pointer;
    outline: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: border-color 0.12s, background 0.12s;
  }

  .edit-type-trigger:hover { border-color: rgba(156,189,231,0.35); }
  .edit-type-trigger[aria-expanded="true"] {
    border-color: rgba(255,175,133,0.45);
    color: #FFAF85;
  }
  .edit-type-trigger svg { color: #9CBDE7; transition: transform 0.18s ease, color 0.12s; }
  .edit-type-trigger[aria-expanded="true"] svg { transform: rotate(180deg); color: #FFAF85; }

  .edit-type-list {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 0;
    width: max-content;
    min-width: 100%;
    background: rgba(20, 46, 82, 0.92);
    backdrop-filter: blur(16px) saturate(180%) brightness(0.92);
    -webkit-backdrop-filter: blur(16px) saturate(180%) brightness(0.92);
    border: 1px solid rgba(156,189,231,0.22);
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    margin: 0;
    padding: 4px;
    list-style: none;
    z-index: 5;
  }

  .edit-type-list li {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: #FFF2EB;
    padding: 9px 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
    line-height: 1.2;
  }

  .edit-type-list li:hover { background: rgba(156,189,231,0.10); }
  .edit-type-list li.active { color: #FFAF85; background: rgba(255,175,133,0.08); }

  /* ── Map-mode segmented switch (3D-kart ↔ Satellitt) ─────────────────────── */
  .map-toggle {
    position: relative;
    flex: 0 0 auto;
    background: var(--glass-action-bg);
    border: 1px solid rgba(156,189,231,0.18);
    border-radius: 999px;
    height: 36px;
    padding: 3px;
    cursor: pointer;
    display: inline-flex;
    align-items: stretch;
    overflow: hidden;
    transition: border-color 0.12s;
  }

  .map-toggle:hover { border-color: rgba(156,189,231,0.35); }

  .map-toggle .map-toggle-thumb {
    position: absolute;
    top: 3px;
    bottom: 3px;
    /* width set in JS based on the wider option so the thumb hugs the label */
    width: var(--map-toggle-thumb-w, 50%);
    left: var(--map-toggle-thumb-x, 3px);
    border-radius: 999px;
    background: rgba(255,175,133,0.14);
    border: 1px solid rgba(255,175,133,0.45);
    box-shadow: inset 0 1px 0 rgba(255,242,235,0.18);
    transition: left 0.22s cubic-bezier(0.4, 0, 0.2, 1), width 0.22s ease;
    pointer-events: none;
    z-index: 0;
  }

  .map-toggle .map-toggle-option {
    position: relative;
    z-index: 1;
    padding: 0 14px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: #9CBDE7;
    white-space: nowrap;
    transition: color 0.18s ease;
    user-select: none;
  }

  .map-toggle[aria-checked="true"]  .map-toggle-option[data-option="satellite"],
  .map-toggle[aria-checked="false"] .map-toggle-option[data-option="map"] {
    color: #FFAF85;
  }

  /* ── Action row: vertical stack — primary pill on top, ghost link below ──── */
  #edit-action-row {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 4px;
    margin-top: 4px;
  }

  .primary-pill {
    width: 100%;
    height: 46px;
    border-radius: 999px;
    background: #FFAF85;
    color: #2A1A0C;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.12s, opacity 0.12s;
    border: none;
    line-height: 1;
  }

  .primary-pill:hover { background: #FFC49A; }
  .primary-pill:active { background: #F09060; }

  .primary-pill[disabled] {
    opacity: 0.40;
    cursor: not-allowed;
  }

  /* No-changes state — render Send forslag button as a quiet ghost */
  .primary-pill.is-no-changes {
    background: transparent;
    border: 1px solid rgba(156,189,231,0.22);
    color: #9CBDE7;
  }

  .primary-pill.is-no-changes:hover {
    border-color: rgba(156,189,231,0.35);
    color: #FFF2EB;
  }

  /* Avbryt: text-link weight, never competes with the primary CTA */
  .ghost-link {
    background: transparent;
    border: none;
    color: rgba(156,189,231,0.75);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    height: 32px;
    cursor: pointer;
    padding: 0 16px;
    align-self: center;
    transition: color 0.12s;
  }

  .ghost-link:hover { color: #FFF2EB; }

  /* Mobile: bottom sheet flush to viewport edges */
  @media (max-width: 639px) {
    #edit-overlay {
      bottom: 0;
      left: 0;
      right: 0;
      transform: none;
      width: 100%;
      padding: 0 0 env(safe-area-inset-bottom, 0);
      gap: 8px;
    }
    #edit-tools-row { padding: 0 16px; }
    #edit-banner {
      border-radius: 22px 22px 0 0;
      padding: 6px 16px 12px;
      border-left: none;
      border-right: none;
      border-bottom: none;
      gap: 10px;
    }
    .edit-type-list { padding: 4px; }
  }

  /* Edit-mode: locate-btn is hidden. The zoom-jog sits at the same vertical
     anchor as the FTS pill / chips — i.e. FTS_GAP above the editor banner top —
     on every viewport. (--edit-zoom-bottom is set by the ResizeObserver to
     the banner top + FTS_GAP.) */
  body.edit-mode #zoom-jog {
    bottom: var(--edit-zoom-bottom, 240px);
    transition: bottom 0.22s ease;
    opacity: 1 !important;
    pointer-events: auto !important;
  }

  /* FTS pill: sit just above the editor banner; hide entirely when satellite
     is on (no shadows to scrub anyway). Match the banner's horizontal extent. */
  body.edit-mode #fts {
    bottom: var(--fts-bottom, 240px);
    transition: bottom 0.22s ease, opacity 0.22s ease;
  }
  body.edit-mode.edit-satellite #fts {
    opacity: 0;
    pointer-events: none;
  }
  @media (max-width: 639px) {
    body.edit-mode #fts {
      left: 16px;
      right: 16px;
      width: auto;
    }
  }

  /* Hide notifications and toasts during edit (single-task focus) */
  body.edit-mode #notif-toast-wrap,
  body.edit-mode #notif-toast,
  body.edit-mode #app-toast {
    display: none !important;
  }


  /* ── Profile panel additions ─────────────────────────────────────────────── */
  .profile-panel-section {
    border-top: 1px solid rgba(255,255,255,0.07);
    padding: 8px 0;
  }

  .profile-admin-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    background: none;
    border: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 8px 16px;
    cursor: pointer;
    text-align: left;
    transition: background 0.12s;
  }

  .profile-admin-row:hover { background: rgba(255,255,255,0.05); }

  #review-mode-indicator {

    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 4px 10px 0;
  }
  .review-chip {

    border: 1px solid #fecaca;

  }
  .review-actions {
    display: flex;
    gap: 6px;
    padding: 6px 10px 8px;
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  .review-action-btn {
    flex: 1;
    background: rgba(255,255,255,0.08);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .review-action-btn:hover { background: rgba(255,255,255,0.16); }
  .review-action-danger {
    background: rgba(220,38,38,0.18);
    border-color: rgba(220,38,38,0.4);
    color: #fca5a5;
  }
  .review-action-danger:hover { background: rgba(220,38,38,0.32); }

  .profile-role-badge {
    display: inline-flex;
    align-items: center;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 2px 7px;
    border-radius: 5px;
    text-transform: uppercase;
    vertical-align: middle;
    margin-left: 6px;
  }

  .profile-role-badge.admin {
    background: rgba(255,175,133,0.18);
    border: 1px solid rgba(255,175,133,0.45);
    color: var(--accent);
  }

  .profile-role-badge.editor {
    background: rgba(156,189,231,0.18);
    border: 1px solid rgba(156,189,231,0.35);
    color: #9CBDE7;
  }

  .pending-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: #142E52;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    margin-left: auto;
  }

  /* ── Profile panel — settings + suggestions + privacy ───────────────────── */
  .profile-settings-section { padding: 10px 0; }
  .profile-section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 16px 6px;
  }
  .profile-pref-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 16px;
    gap: 12px;
  }
  .profile-pref-label {
    font-size: 13px;
    color: var(--text);
  }
  .profile-pref-pills {
    display: flex;
    gap: 4px;
  }
  .pref-pill {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 6px;
    border: 1px solid rgba(156,189,231,0.25);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  .pref-pill:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  .pref-pill.active {
    background: rgba(255,175,133,0.15);
    border-color: rgba(255,175,133,0.5);
    color: var(--accent);
  }
  .profile-pref-desc {
    font-size: 11px;
    color: var(--muted);
    padding: 0 16px 4px;
    opacity: 0.7;
  }
  .checkin-vis-row { padding: 3px 16px; }
  .checkin-vis-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 26px;
    padding: 0;
  }
  .checkin-vis-toggle svg { stroke: currentColor; }
  .my-suggestion-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 16px;
    gap: 8px;
  }
  .my-suggestion-info {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }
  .my-suggestion-name {
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 140px;
  }
  .suggestion-status-badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 2px 6px;
    border-radius: 5px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .suggestion-status-badge.pending  { background: rgba(255,175,133,0.12); color: var(--accent); border: 1px solid rgba(255,175,133,0.3); }
  .suggestion-status-badge.approved { background: rgba(100,255,180,0.12); color: #64ffb4;       border: 1px solid rgba(100,255,180,0.3); }
  .suggestion-status-badge.rejected { background: rgba(255,107,107,0.12); color: #ff6b6b;       border: 1px solid rgba(255,107,107,0.3); }
  .suggestion-withdraw-btn {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
    border: 1px solid rgba(156,189,231,0.2);
    border-radius: 6px;
    padding: 3px 8px;
    cursor: pointer;
    flex-shrink: 0;
    transition: color 0.12s, border-color 0.12s;
  }
  .suggestion-withdraw-btn:hover { color: #ff6b6b; border-color: rgba(255,107,107,0.4); }
  .profile-privacy-link {
    display: block;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    padding: 6px 0 2px;
    transition: color 0.12s;
  }
  .profile-privacy-link:hover { color: var(--text); }

  /* ── Settings (grouped-list redesign) ────────────────────────────────────── */
  .settings-root {
    padding: 12px 12px calc(20px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .settings-group-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 6px 6px;
  }
  .settings-group {
    background: var(--card-bg);
    border: var(--glass-border);
    border-radius: 12px;
    overflow: hidden;
  }
  .settings-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    background: none;
    border: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    text-align: left;
    padding: 13px 14px;
    min-height: 46px;
    cursor: pointer;
    transition: background 0.12s;
    box-sizing: border-box;
  }
  .settings-row + .settings-row { border-top: 1px solid rgba(156,189,231,0.10); }
  .settings-row:hover { background: rgba(255,255,255,0.04); }
  .settings-row:disabled,
  .settings-row.is-disabled { cursor: default; opacity: 0.55; }
  .settings-row:disabled:hover,
  .settings-row.is-disabled:hover { background: none; }
  .settings-row__icon {
    flex-shrink: 0;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 18px;
  }
  .settings-row__label {
    flex: 1 1 auto;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .settings-row__value {
    color: var(--muted);
    font-size: 13px;
    flex-shrink: 0;
  }
  .settings-row__chevron {
    color: var(--muted);
    flex-shrink: 0;
    opacity: 0.7;
  }
  .settings-row.destructive { color: #ff8a8a; }
  .settings-row.destructive .settings-row__icon,
  .settings-row.destructive .settings-row__chevron { color: #ff8a8a; }
  .settings-row.destructive:hover { background: rgba(255,107,107,0.06); }

  /* Identity card variant — full bleed within group */
  .settings-identity {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px;
    cursor: pointer;
    background: none;
    border: none;
    width: 100%;
    color: var(--text);
    text-align: left;
    transition: background 0.12s;
  }
  .settings-identity:hover { background: rgba(255,255,255,0.04); }
  .settings-identity__avatar,
  .settings-identity__avatar-initials {
    width: 44px; height: 44px;
    border-radius: 50%;
    flex-shrink: 0;
    object-fit: cover;
  }
  .settings-identity__avatar-initials {
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700;
    color: #142E52;
  }
  .settings-identity__info { min-width: 0; flex: 1 1 auto; }
  .settings-identity__name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .settings-identity__email {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Inline pref row (segmented controls inside a settings-group) */
  .settings-row.pref-row { cursor: default; }
  .settings-row.pref-row:hover { background: none; }

  /* Status pill — for "Coming soon" markers */
  .settings-status-pill {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 10px;
    background: rgba(156,189,231,0.14);
    color: var(--muted);
    border: 1px solid rgba(156,189,231,0.22);
    flex-shrink: 0;
  }

  /* Toggle switch — replaces eye icons in the redesign */
  .toggle-switch {
    position: relative;
    width: 34px;
    height: 20px;
    border-radius: 10px;
    background: rgba(156,189,231,0.22);
    border: 1px solid rgba(156,189,231,0.28);
    padding: 0;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.16s ease, border-color 0.16s ease;
  }
  .toggle-switch::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #FFF2EB;
    transform: translateY(-50%);
    transition: left 0.16s ease, background 0.16s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.35);
  }
  .toggle-switch.is-on {
    background: var(--accent);
    border-color: rgba(255,175,133,0.7);
  }
  .toggle-switch.is-on::after {
    left: 17px;
    background: #142E52;
  }
  .toggle-switch:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* Activity sub-panel rows reuse .inbox-row styling already defined */
  .settings-subview {
    padding: 12px 12px calc(20px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .settings-subview__empty {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 32px 16px;
    opacity: 0.7;
  }

  /* About row holds version text inline */
  .settings-row__sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* ── Auth buttons ─────────────────────────────────────────────────────────── */
  .login-gate {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 56px 24px 48px; text-align: center; gap: 14px;
  }
  .login-gate-title {
    font-family: 'Newsreader', serif; font-size: 22px;
    color: var(--text); font-weight: 400;
  }
  .login-gate-subtitle {
    color: var(--muted); font-size: 13px; line-height: 1.6; max-width: 240px;
  }
  .login-gate-buttons {
    display: flex; flex-direction: column; gap: 10px;
    width: 100%; max-width: 280px; margin-top: 8px;
  }
  .auth-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; border: none; border-radius: 8px;
    padding: 11px 22px; font-family: 'Inter', sans-serif;
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: opacity 0.12s;
  }
  .auth-btn:hover { opacity: 0.85; }
  .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .auth-btn-google { background: #fff; color: #1f1f1f; }
  .auth-btn-apple  { background: #000; color: #fff; }
  .auth-btn-apple svg { width: 18px; height: 18px; }
  .auth-btn-email  {
    background: rgba(255,255,255,0.1); color: var(--text);
    border: 1px solid rgba(255,255,255,0.15);
  }
  .auth-divider {
    display: flex; align-items: center; gap: 12px;
    color: var(--muted); font-size: 12px; margin: 2px 0;
  }
  .auth-divider::before, .auth-divider::after {
    content: ''; flex: 1; height: 1px;
    background: rgba(255,255,255,0.1);
  }
  .auth-magic-link-form { display: flex; flex-direction: column; gap: 8px; }
  .auth-magic-link-input {
    width: 100%; box-sizing: border-box;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
    color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px;
    padding: 10px 14px; outline: none;
  }
  .auth-magic-link-input:focus { border-color: rgba(156,189,231,0.5); }
  .auth-magic-link-input::placeholder { color: var(--muted); }
  .auth-magic-link-status {
    font-size: 12px; line-height: 1.4; min-height: 17px; text-align: center;
  }
  .auth-magic-link-status.success { color: #64ffb4; }
  .auth-magic-link-status.error   { color: #ff6b6b; }

  /* Logged-out profile panel: hero + benefits carousel */
  .login-hero { padding: 24px 20px 8px; text-align: center; }
  .login-hero-title {
    font-family: 'Newsreader', serif; font-size: 22px; font-weight: 400;
    color: var(--text); line-height: 1.25; margin: 0 0 18px;
  }
  .login-carousel { position: relative; overflow: hidden; }
  .login-carousel-track {
    display: flex;
    transition: transform 0.35s cubic-bezier(0.25, 0.9, 0.4, 1);
    will-change: transform; touch-action: pan-y;
  }
  .login-slide {
    flex: 0 0 100%; padding: 8px 16px 12px; box-sizing: border-box;
    text-align: center;
  }
  .login-slide-icon {
    width: 48px; height: 48px; margin: 0 auto 12px; color: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .login-slide-icon svg { width: 36px; height: 36px; }
  .login-slide-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .login-slide-body  {
    font-size: 13px; line-height: 1.5; color: var(--muted);
    max-width: 240px; margin: 0 auto;
  }
  .login-carousel-dots {
    display: flex; gap: 6px; justify-content: center; padding: 14px 0 4px;
  }
  .login-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,0.2); border: none; padding: 0;
    cursor: pointer; transition: background 0.2s, width 0.2s;
  }
  .login-dot.active { background: var(--accent); width: 18px; border-radius: 3px; }

  .login-auth-section { padding: 8px 20px 12px; }
  .login-auth-section .login-gate-buttons { max-width: none; margin-top: 0; }
  .login-footer {
    border-top: 1px solid rgba(255,255,255,0.07);
    padding: 10px 0 4px; margin-top: 8px; text-align: center;
  }
  .login-close-btn {
    position: absolute; top: 10px; right: 10px;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,0.06); border: none;
    color: var(--muted); font-size: 22px; line-height: 1;
    cursor: pointer; z-index: 2; display: none;
    align-items: center; justify-content: center;
  }
  .login-close-btn:hover { background: rgba(255,255,255,0.12); color: var(--text); }

  /* Candidate "Suggest venue" badge in search dropdown */
  .sd-candidate-btn {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    background: rgba(255,175,133,0.1);
    border: 1px solid rgba(255,175,133,0.25);
    border-radius: 12px;
    padding: 3px 10px;
    white-space: nowrap;
    flex-shrink: 0;
    pointer-events: none; /* row handles click */
  }
  .sd-row-candidate:hover .sd-candidate-btn {
    background: rgba(255,175,133,0.2);
    border-color: rgba(255,175,133,0.4);
  }

  /* ── Venue selection modal (Google Places results) ──────────────────────────── */
  .suggest-result-row {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(156,189,231,0.1);
    cursor: pointer;
    transition: background 150ms ease;
  }
  .suggest-result-row:last-child { border-bottom: none; }
  .suggest-result-row:hover { background: rgba(255,175,133,0.08); }

  .suggest-result-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
  }

  .suggest-result-address {
    font-size: 12px;
    color: var(--muted);
  }

  /* ── Candidate loading panel ──────────────────────────────────────────────── */
  .candidate-loading-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 280px;
    padding: 32px 24px;
    text-align: center;
  }
  .candidate-loading-name {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 28px;
  }
  .candidate-loading-spinner {
    width: 36px;
    height: 36px;
    border: 3px solid rgba(255,175,133,0.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: candidate-spin 0.8s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes candidate-spin {
    to { transform: rotate(360deg); }
  }
  .candidate-loading-status {
    font-size: 13px;
    color: var(--muted);
    transition: opacity 0.2s;
  }

  /* ── Geo search pin (address marker on map) ──────────────────────────────── */
  .geo-pin {
    cursor: pointer;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    animation: geo-pin-drop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes geo-pin-drop {
    0%   { transform: translateY(-20px); opacity: 0; }
    100% { transform: translateY(0);     opacity: 1; }
  }

  /* ── Admin modals ─────────────────────────────────────────────────────────── */
  .admin-modal {
    position: fixed;
    inset: 0;
    z-index: 3000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    padding: 16px;
  }

  .admin-modal-inner {
    background: var(--panel-bg, #0d1f35);
    border: 1px solid rgba(156,189,231,0.22);
    border-radius: 16px;
    width: 100%;
    max-width: 520px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 40px rgba(0,0,0,0.7);
  }

  .admin-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    flex-shrink: 0;
  }

  .admin-modal-title {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }

  .admin-modal-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.12s;
  }

  .admin-modal-close:hover { background: rgba(255,255,255,0.08); color: var(--text); }

  .admin-modal-body {
    padding: 16px 20px;
    overflow-y: auto;
    flex: 1;
  }

  .admin-edit-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(156,189,231,0.15);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
    transition: opacity 0.3s;
  }

  .admin-edit-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  .admin-edit-venue {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }

  .admin-edit-meta {
    font-size: 11px;
    color: var(--muted);
  }

  .admin-edit-diff {
    margin-bottom: 10px;
  }

  .admin-diff-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 3px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    flex-wrap: wrap;
  }

  .admin-diff-key   { color: var(--muted); min-width: 120px; }
  .admin-diff-before { color: #ff8080; font-family: monospace; }
  .admin-diff-arrow  { color: var(--muted); }
  .admin-diff-after  { color: #64ffb4; font-family: monospace; }

  .admin-edit-actions {
    display: flex;
    gap: 8px;
  }

  .admin-approve-btn {
    background: rgba(100,255,180,0.12);
    border: 1px solid rgba(100,255,180,0.4);
    border-radius: 7px;
    color: #64ffb4;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .admin-approve-btn:hover { background: rgba(100,255,180,0.22); }

  .admin-reject-btn {
    background: rgba(255,107,107,0.12);
    border: 1px solid rgba(255,107,107,0.35);
    border-radius: 7px;
    color: #ff6b6b;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .admin-reject-btn:hover { background: rgba(255,107,107,0.22); }

  /* (Edit banner mobile layout merged into the main #edit-overlay rules above.) */

  /* Timeline */
  .card-timeline {
    margin-top: 7px;
  }

  /* Now button */
  #now-btn {
    background: rgba(156,189,231,0.12);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #now-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }
  #now-btn:hover:not(.active) {
    border-color: rgba(255,175,133,0.4);
    color: var(--text);
  }

  /* Dual range slider */
  .time-range-wrap {
    flex: 1;
    position: relative;
    height: 20px;
    display: flex;
    align-items: center;
    overflow: visible;
  }
  .time-range-track-bg {
    position: absolute;
    top: 8px;
    left: 0; right: 0; height: 4px;
    background: rgba(156,189,231,0.18);
    border-radius: 2px;
    pointer-events: none;
  }
  .time-range-wrap input[type=range] {
    position: absolute;
    width: 100%;
    margin: 0;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    pointer-events: none;
    height: 20px;
    outline: none;
  }
  .time-range-wrap input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #0a1830;
    cursor: pointer;
    pointer-events: all;
    box-shadow: 0 0 14px rgba(255,175,133,0.7);
  }
  .time-range-wrap input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #0a1830;
    cursor: pointer;
    pointer-events: all;
    box-shadow: 0 0 14px rgba(255,175,133,0.7);
  }
  .time-range-wrap input[type=range]:hover::-webkit-slider-thumb {
    background: #FFCBAA;
    box-shadow: 0 0 10px rgba(255,175,133,0.6);
  }
  .time-range-wrap.now-active input[type=range]::-webkit-slider-thumb {
    background: #0a1830;
    border-color: rgba(255,175,133,0.45);
    box-shadow: none;
    cursor: default;
  }
  .time-range-wrap.now-active input[type=range]:hover::-webkit-slider-thumb {
    background: #0d1f40;
    border-color: rgba(255,175,133,0.7);
    box-shadow: 0 0 6px rgba(255,175,133,0.15);
  }
  .time-range-sun-bg {
    position: absolute;
    top: 8px;
    height: 4px;
    background: rgba(255,175,133,0.13);
    border-radius: 2px;
    pointer-events: none;
  }
  .time-display-row {
    position: absolute;
    top: 22px;
    left: 0; right: 0;
    height: 12px;
  }
  .time-display-row span {
    position: absolute;
    transform: translateX(-50%);
    font-size: 9px;
    color: var(--muted);
    white-space: nowrap;
    transition: left 0.05s;
  }

  /* "Try tomorrow" banner in venue list */
  #no-sun-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,175,133,0.06);
    border: 1px solid rgba(255,175,133,0.18);
    border-radius: 10px;
    padding: 9px 14px;
    margin-bottom: 10px;
    font-size: 12px;
    color: var(--muted);
  }
  #no-sun-banner button {
    background: rgba(255,175,133,0.15);
    border: 1px solid rgba(255,175,133,0.35);
    border-radius: 7px;
    color: var(--accent);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 11px;
    cursor: pointer;
    transition: background 0.12s;
  }
  #no-sun-banner button:hover { background: rgba(255,175,133,0.25); }

  /* ── Venue suggestion ────────────────────────────────────────────────────── */
  .suggest-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 28px 16px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }
  .suggest-empty strong { color: var(--text); font-weight: 500; }
  .suggest-btn {
    background: rgba(156,189,231,0.1);
    border: 1px solid rgba(156,189,231,0.2);
    border-radius: 20px;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 7px 16px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    text-decoration: none;
    display: inline-block;
  }
  .suggest-btn:hover { background: rgba(156,189,231,0.18); color: var(--text); }
  .suggest-btn-primary {
    background: rgba(255,175,133,0.12);
    border-color: rgba(255,175,133,0.25);
    color: #FFAF85;
  }
  .suggest-btn-primary:hover { background: rgba(255,175,133,0.22); color: #FFAF85; }
  .suggest-confirm {
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .suggest-confirm-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
  }
  .suggest-confirm-address {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .suggest-confirm-prompt {
    font-size: 13px;
    color: var(--muted);
    margin: 8px 0 4px;
  }
  .suggest-confirm-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .venue-card.closed-card {
    padding: 8px 14px;
    opacity: 0.4;
    cursor: pointer;
  }
  .venue-card.closed-card:hover { opacity: 0.65; }
  .closed-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .closed-name {
    font-size: 12px;
    color: var(--muted);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── RIGHT DETAIL PANEL ───────────────────────────────────────────── */
  /* ── Toast notice strip ─────────────────────────────────────────────── */
  #qc-wrap {
    position: absolute;
    left: 16px;
    top: 70px;     /* search top(16) + search height(46) + gap(8) */
    width: 336px;
    z-index: 820;
    pointer-events: none;
    transition: left 0.28s ease;
  }
  #qc-notice {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    padding: 2px 8px 0;
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
  }
  #qc-notice.visible { opacity: 1; }


  /* ── Header chip row: date (left), weather (center), sort (right) ──────
     Three-column grid so date and sort sit at the row edges and weather
     stays centered between them, regardless of which chips are visible. */
  #list-sun-header {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    column-gap: 8px;
    padding: 6px 14px 8px;
    flex-shrink: 0;
  }

  #header-date-chip,
  #header-wx-chip,
  #list-sun-header #sort-toggle-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 36px;
    padding: 0 14px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    -webkit-tap-highlight-color: transparent;
    outline: none;
    white-space: nowrap;
    box-sizing: border-box;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
  }
  /* Both interactive chips have the same fixed width — sized to fit the
     longest date label ("I morgen" / "23. mai" / "tor 23") so the date
     chip never resizes between today/tomorrow/dated states. Sort matches
     for visual symmetry on the row. Weather centers in the middle. */
  #header-date-chip               { justify-self: start;  width: 116px; }
  #header-wx-chip                 { justify-self: center; }
  #list-sun-header #sort-toggle-btn { justify-self: end;   width: 116px; }

  /* Date chip — tappable, opens picker. Glass action button. */
  #header-date-chip {
    background: var(--glass-action-bg);
    border: var(--glass-border);
    border-radius: 10px;
    box-shadow: var(--glass-inset);
    cursor: pointer;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
  }
  #header-date-chip:hover { border-color: rgba(156,189,231,0.4); background: rgba(24,52,95,0.8); }
  #header-date-chip.active {
    border-color: rgba(255,175,133,0.35);
    color: var(--accent);
  }
  #header-date-chip.active .chip-cal-icon { color: var(--accent); }
  #header-date-chip .chip-cal-icon { color: var(--muted); flex-shrink: 0; }

  /* Weather chip — info-only. Borderless, transparent, clearly not a button.
     Larger icon so it visually fills the chip's vertical breathing room. */
  #header-wx-chip {
    background: transparent;
    border: none;
    cursor: default;
    color: var(--muted);
    font-weight: 500;
    padding: 0 8px;
    font-size: 14px;
    gap: 8px;
  }
  #header-wx-chip #header-wx-icon { font-size: 22px; line-height: 1; flex-shrink: 0; }
  #header-wx-chip #header-wx-temp { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  #header-wx-chip #header-wx-wind { font-variant-numeric: tabular-nums; }
  #header-wx-chip .chip-dot { opacity: 0.55; }

  /* Sort button — tappable, glass with chevron. Pinned to the right edge so
     the date+weather pair sits flush at the left in any state. */
  #list-sun-header #sort-toggle-btn {
    margin-left: auto;
    background: var(--glass-action-bg);
    border: var(--glass-border);
    border-radius: 10px;
    box-shadow: var(--glass-inset);
    transition: color 0.12s, border-color 0.12s, background 0.12s;
  }
  #list-sun-header #sort-toggle-btn .sort-chevron {
    color: var(--muted);
    transition: transform 0.18s ease;
    flex-shrink: 0;
  }

  /* Very narrow viewports: drop the wind label so the chips don't crowd */
  @media (max-width: 360px) {
    #header-wx-chip .chip-dot,
    #header-wx-chip #header-wx-wind { display: none; }
  }

  /* ── Sun-section bar: "Sun now — N places in the sun" ─────────────────
     Two stacked text lines on a vertical translate track. JS toggles
     .later on the bar to slide the second line into view (calendar-style). */
  #sun-section-bar {
    flex-shrink: 0;
    padding: 4px 16px 6px;
    overflow: hidden;
    height: 22px;
  }
  #sun-section-bar .ssb-track {
    position: relative;
    height: 22px;
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
  }
  #sun-section-bar.later .ssb-track { transform: translateY(-22px); }
  .ssb-line {
    display: flex;
    align-items: baseline;
    gap: 8px;
    height: 22px;
    line-height: 22px;
    font-family: 'Inter', sans-serif;
    white-space: nowrap;
  }
  .ssb-line .ssb-label {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.005em;
  }
  .ssb-line .ssb-context {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    opacity: 0.85;
  }
  /* Hide the bar entirely when there's nothing to label (single bucket only) */
  #sun-section-bar.ssb-empty { display: none; }

  /* ── Calendar float — outside #panel, position: fixed so it escapes transforms ── */
  #ptb-cal-float {
    position: fixed;
    z-index: 1200;  /* Above detail panel (810 desktop / 920 mobile) and FTS (925) */
    display: none;
    /* desktop: position + width set by JS to match FTS */
    left: 16px;
    width: 336px;
    min-width: 300px;
    max-width: 480px;
    transition: left 0.28s ease;
  }
  #ptb-cal-float.open { display: block; }
  /* Header + close button — hidden on desktop, shown on mobile */
  #ptb-cal-header {
    display: none;
  }

  /* ── Mobile: calendar as bottom-sheet ──────────────────────────────────── */
  @media (max-width: 639px) {
    /* Override display:none with a transform-based show/hide so we can animate */
    #ptb-cal-float {
      display: block !important; /* always in layout; visibility via transform+opacity */
      left: 0;
      right: 0;
      width: auto;
      top: auto;
      bottom: 0;
      max-height: 56svh;  /* one month + peek of the next */
      padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 20px);
      box-sizing: border-box;
      background: var(--glass-panel-bg);
      backdrop-filter: var(--glass-blur-panel);
      -webkit-backdrop-filter: var(--glass-blur-panel);
      border-radius: 20px 20px 0 0;
      border: 1px solid rgba(156,189,231,0.22);
      border-bottom: none;
      box-shadow: inset 0 1px 0 rgba(255,242,235,0.22), 0 -8px 40px rgba(0,0,0,0.50);
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none;
      transition: transform 300ms cubic-bezier(0.4, 0, 0.2, 1), opacity 180ms ease-out;
      z-index: 1200;  /* Above the mobile detail panel (920) */
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #ptb-cal-float.open {
      display: block !important;
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    /* Header row: title + close button — visible on mobile */
    #ptb-cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0 10px;
      flex-shrink: 0;
    }
    #ptb-cal-title {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }
    #ptb-cal-close {
      background: rgba(156,189,231,0.12);
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--muted);
      flex-shrink: 0;
      transition: background 0.12s, color 0.12s;
    }
    #ptb-cal-close:hover { background: rgba(156,189,231,0.22); color: var(--text); }
    /* Inner panel: no extra animation on mobile — the outer float handles reveal */
    #ptb-cal-float #qc-panel {
      overflow: visible;
      max-height: none !important;
      margin-top: 0;
      transition: none;
    }
    #ptb-cal-float #qc-panel.open { max-height: none !important; }
    #ptb-cal-float #qc-panel-inner {
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      overflow: visible;
      opacity: 1 !important;
      pointer-events: auto !important;
    }
    #ptb-cal-float #qc-date-section {
      padding: 0;
      overflow: visible;
      height: auto !important; /* override JS _syncQcPanelHeight inline height */
    }
    /* 10-day grid: 5 columns × 2 rows — all days visible at once, no scroll */
    #ptb-cal-float #qc-cal .dc-grid:not(.dc-month-grid) {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      overflow: visible;
    }
    #ptb-cal-float #qc-cal .dc-grid:not(.dc-month-grid) .dc-tile {
      justify-content: center;
      border-radius: 10px;
      gap: 3px;
      padding: 8px 4px 6px;
    }
    #ptb-cal-float #qc-cal .dc-grid:not(.dc-month-grid) .dc-day  { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; }
    #ptb-cal-float #qc-cal .dc-grid:not(.dc-month-grid) .dc-num  { font-size: 17px; font-weight: 700; line-height: 1; }
    #ptb-cal-float #qc-cal .dc-grid:not(.dc-month-grid) .dc-icon { font-size: 15px; line-height: 1.2; }
    #ptb-cal-float #qc-cal .dc-grid:not(.dc-month-grid) .dc-temp { font-size: 10px; font-weight: 600; color: rgba(156,189,231,0.72); }
    /* Month-view full calendar on mobile */
    #ptb-cal-float #qc-cal .dc-cal-scroll { height: 55vh; }
    #ptb-cal-float #qc-cal .dc-month-grid .dc-tile { height: 48px; }
    #ptb-cal-float #qc-cal .dc-month-grid .dc-tile.solar-only { height: 48px; min-height: 48px; }
  }

  #qc-presets {
    display: flex;
    gap: 2px;
    padding: 3px;
    background: rgba(156, 189, 231, 0.08);
    border: 1px solid rgba(156, 189, 231, 0.14);
    border-radius: 10px;
    position: relative;
  }
  .qc-preset-btn {
    flex: 1;
    background: rgba(20, 46, 82, 0.55);
    border: 1px solid rgba(156, 189, 231, 0.22);
    border-radius: 7px;
    color: rgba(156, 189, 231, 0.65);
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 5px 4px;
    cursor: pointer;
    transition: color 0.12s, background 0.12s, border-color 0.12s;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .qc-preset-btn:hover:not(.active) {
    color: rgba(156, 189, 231, 0.95);
    background: rgba(24, 52, 95, 0.8);
    border-color: rgba(255, 175, 133, 0.28);
  }
  .qc-preset-btn.active { background: var(--accent); color: #142E52; border-color: var(--accent); }

  /* Calendar section inside the calendar float */
  #qc-panel {
    overflow: hidden;
    max-height: 0;
    margin-top: 8px;
    transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #qc-panel.open {
    max-height: var(--qc-panel-h, 290px);
  }
  #qc-panel-inner {
    width: 100%;
    box-sizing: border-box;
    background: var(--glass-panel-bg);
    backdrop-filter: var(--glass-blur-panel);
    -webkit-backdrop-filter: var(--glass-blur-panel);
    border: var(--glass-border);
    border-radius: 12px;
    box-shadow: var(--glass-inset), 0 6px 24px rgba(0,0,0,0.50);
    overflow: hidden;
    opacity: 1;
    transition: opacity 0.25s ease;
  }
  #qc-panel:not(.open) #qc-panel-inner {
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
  }
  #qc-date-section { display: none; padding: 8px; box-sizing: border-box; width: 100%; overflow: hidden; }
  #qc-date-section.active { display: flex; flex-direction: column; }
  #qc-cal { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; box-sizing: border-box; overflow: clip; }
  #qc-panel.cal-expanded #qc-cal { overflow: clip; flex: 1; }
  #qc-cal .dc-cal-scroll {
    height: 390px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    /* Soft bottom fade hints at more content without eating into the last row of tiles. */
    mask-image: linear-gradient(to bottom, black 96%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, black 96%, transparent 100%);
  }
  #qc-cal .dc-cal-scroll::-webkit-scrollbar { display: none; }
  #qc-cal .dc-grid:not(.dc-month-grid) { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: auto; gap: 3px; width: 100%; box-sizing: border-box; }
  #qc-cal .dc-grid:not(.dc-month-grid) .dc-tile  { padding: 4px 2px; gap: 2px; }
  #qc-cal .dc-grid:not(.dc-month-grid) .dc-day   { font-size: 8px; }
  #qc-cal .dc-grid:not(.dc-month-grid) .dc-num   { font-size: 15px; }
  #qc-cal .dc-grid:not(.dc-month-grid) .dc-icon  { font-size: 17px; line-height: 1.1; }
  #qc-cal .dc-grid:not(.dc-month-grid) .dc-temp  { font-size: 12px; font-weight: 700; color: rgba(156,189,231,0.72); }
  /* Full-calendar month grid: 7 columns, 4px gap, 48px tiles */
  #qc-cal .dc-month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; width: 100%; box-sizing: border-box; }
  #qc-cal .dc-month-grid .dc-tile { padding: 4px 2px; gap: 2px; height: 44px; justify-content: center; }
  #qc-cal .dc-month-grid .dc-tile.solar-only { height: 44px; min-height: 44px; }
  #qc-cal .dc-month-grid .dc-num  { font-size: 15px; font-weight: 600; }
  #qc-cal .dc-month-grid .dc-icon { font-size: 14px; line-height: 1.1; }
  /* Weekday row: 7 columns matching day grid, sticky at scroll-area top */
  #qc-cal .dc-weekday-row {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
    height: 24px; align-items: center;
    position: sticky; top: 0; z-index: 2;
    background: rgba(20,46,82,0.85);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(156,189,231,0.12);
    margin-bottom: 2px;
  }
  /* Month label: sticky just below weekday row, same backdrop */
  #qc-cal .dc-month-row-label {
    position: sticky; top: 26px; /* weekday row (24px) + bottom border (1px) + gap (1px) */
    z-index: 1;
    background: rgba(20,46,82,0.85);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 4px 2px;
  }

  /* Suppress venue card enter animation on map-pan re-renders */
  #venue-list[data-no-anim] .venue-card { animation: none !important; }

  /* Mobile overrides */
  @media (max-width: 639px) {
    #qc-wrap {
      left: 12px;
      right: 12px;
      top: 68px;
      width: auto;
    }
  }

  #detail-panel {
    position: absolute;
    top: 70px;     /* align with list panel: 16 search-top + 46 search-h + 8 gap */
    left: 368px;   /* 16 + 336 + 16 */
    bottom: 16px;
    width: 336px;  /* match the venue-list panel width */
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 810;
    transform: translateX(-12px);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.26s ease, opacity 0.26s ease, left 0.28s ease;
    contain: layout;
  }
  #detail-panel.open {
    transform: translateX(0);
    opacity: 1;
    pointer-events: auto;
  }
  /* dp-content wraps the rendered content so dp-handle can sit above the scroll area */
  #dp-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  /* ── Venue photo gallery ────────────────────────────────────────────────── */
  .dp-photos {
    display: flex;
    gap: 3px;
    overflow-x: auto;
    scrollbar-width: none;
    margin: -14px -16px 14px;
    scroll-snap-type: x mandatory;
    border-radius: 10px 10px 0 0;
    overflow: hidden;         /* clip rounded corners */
    overflow-x: auto;         /* re-enable horizontal scroll */
    position: relative;
  }
  /* Bevel: soft gradient at the top of the photo section, blending into the panel glass */
  .dp-photos::before {

    position: absolute;
    top: 0; left: 0; right: 0;
    height: 22px;

    pointer-events: none;

  .dp-photo {
    width: 304px;  /* detail-panel width 336 - 32px horizontal padding */
    height: 190px;
    object-fit: cover;
    flex-shrink: 0;
    scroll-snap-align: start;
    background: rgba(20,46,82,0.6);

  #dp-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;

  #dp-scroll::-webkit-scrollbar-track { background: transparent; }
  #dp-scroll::-webkit-scrollbar-thumb { background: rgba(255,175,133,0.2); border-radius: 2px; }
  .dp-header-row {
    display: flex;
    align-items: flex-start;

    gap: 8px;
    margin-bottom: 4px;

  .dp-venue-name {

  .dp-meta {

  .dp-limited-solar {

    background: rgba(156,189,231,0.07);
    border: 1px solid rgba(156,189,231,0.15);

  .dp-dial-wrap {

  .dp-sun-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 20px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 700;

  }
  .dp-sun-pill.sunny    { background: rgba(255,175,133,0.88); color: #142E52; }
  .dp-sun-pill.overcast { background: rgba(165,170,178,0.18); color: rgba(165,170,178,0.9); border: 1px solid rgba(165,170,178,0.28); }
  .dp-sun-pill.rainy    { background: rgba(156,189,231,0.18); color: rgba(156,189,231,0.9); border: 1px solid rgba(156,189,231,0.28); }
  .dp-sun-pill.neutral  { background: rgba(255,175,133,0.12); color: var(--accent); border: 1px solid rgba(255,175,133,0.28); }
  .dp-sun-pill.muted    { background: rgba(156,189,231,0.15); color: var(--muted); border: 1px solid rgba(156,189,231,0.22); }
  /* Experience Index */
  .dp-exp-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 10px;
    margin-bottom: 4px;
  }
  .dp-exp-label { font-size: 14px; font-weight: 400; color: #FFF2EB; }
  .dp-exp-hint  { font-size: 12px; font-weight: 400; color: #9CBDE7; margin-top: 1px; }
  .dp-exp-val   { font-family: 'Inter', sans-serif; font-style: italic; font-size: 16px; font-weight: 600; color: #FFAF85; }
  .dp-dial-svg.dp-dial-locked circle:first-of-type { stroke: rgba(255,175,133,0.22); }
  .dp-exp-bar-wrap {
    height: 1px;
    background: rgba(156,189,231,0.15);

  .dp-score-breakdown {
    font-size: 11px;

  .dp-section-label {
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;

    color: #9CBDE7;
    margin-bottom: 8px;

  .dp-divider {

  .dp-address {

  .dp-gm-actions {
    display: flex;
    gap: 6px;
    margin: 12px 0;
  }
  .dp-gm-chip {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 10px 6px 8px;
    background: var(--glass-action-bg);
    border: var(--glass-border);
    border-radius: 12px;
    box-shadow: var(--glass-inset);
    color: #FFAF85;
    font-size: 12px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    letter-spacing: normal;

  .dp-gm-chip:hover { background: rgba(20,46,82,0.65); }
  .dp-gm-chip svg { stroke: #FFAF85; flex-shrink: 0; }

  .dp-actions {
    display: flex;
    gap: 6px;
  }
  .dp-action-btn {
    flex: 1;
    font-size: 12px;
    font-weight: 500;
    padding: 7px 10px;
    border-radius: 12px;
    border: var(--glass-border);
    background: var(--glass-action-bg);
    box-shadow: var(--glass-inset);
    color: #FFAF85;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    transition: background 0.12s;
    font-family: 'Inter', sans-serif;
  }
  .dp-action-btn:hover { background: rgba(20,46,82,0.65); }
  .dp-action-btn.directions {
    background: var(--glass-action-bg);
    border: var(--glass-border);
    color: #FFAF85;
  }
  .dp-action-btn.directions:hover { background: rgba(20,46,82,0.65); }

  .dp-busy-row {
    display: flex;
    align-items: baseline;
    gap: 5px;
    margin-bottom: 6px;
  }
  .dp-busy-now {
    font-size: 12px;

  .dp-busy-est {

  /* Detail panel drag handle */
  #dp-handle {
    display: none; /* shown on mobile only */
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 16px 0 14px;

    width: 36px;

  }

  /* Hide UI elements when detail panel is open on mobile */
  .mobile-ui-hidden { display: none !important; }

  /* ──── New Detail Panel CSS (Tasks 5-8) ────────────────────────────────────── */
  .detail-new-photos {
    height: 160px;
    border-radius: 14px;
    overflow-y: hidden;
    overflow-x: auto;
    margin-bottom: 14px;
    background: linear-gradient(135deg, #3a4b6e, #2a3a5c);
    display: flex;
    align-items: center;
    justify-content: flex-start;
    color: var(--muted);
    font-size: 12px;
    gap: 8px;
    padding: 0 2px;
    scrollbar-width: none;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    contain: layout style;
    flex-shrink: 0;
  }
  .detail-new-photos::-webkit-scrollbar { display: none; }
  .detail-new-photos img {
    height: 100%;
    min-width: 240px;
    max-width: 280px;
    object-fit: cover;
    border-radius: 10px;
    flex-shrink: 0;
    aspect-ratio: 4/3;
  }

  /* Merged header: back + title + fav/bell on one row */
  .detail-header-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 10px;
  }
  .detail-header-info {
    flex: 1;
    min-width: 0;
  }
