<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solsteder — Oslo Sun Places</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a1a2e;
    --panel: #16213e;
    --accent: #FFB800;
    --accent-dim: rgba(255,184,0,0.15);
    --text: #f0e6d3;
    --muted: #8a9ab0;
    --card-bg: #1e2d4a;
    --border: rgba(255,184,0,0.2);
    --pill-bg: rgba(16,22,38,0.92);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
  }

  #app {
    position: relative;
    height: 100vh;
    overflow: hidden;
  }

  /* MAP — fills the entire viewport, sits behind all floating UI */
  #map-container {
    position: absolute;
    inset: 0;
  }

  #map {
    width: 100%;
    height: 100%;
  }

  #canvas-overlay {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 690;
    will-change: transform;
  }

  /* ── Shared floating card base ────────────────────────────────────────────── */
  .floating-card {
    background: rgba(22,33,62,0.88);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,184,0,0.13);
    border-radius: 14px;
    padding: 10px 14px;
  }

  /* ── Top-left: search bar ──────────────────────────────────────────────────── */
  #floating-search {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 900;
    width: 320px;
  }
  #floating-search #venue-search {
    background: transparent;
    border: none;
    padding: 4px 2px;
    width: 100%;
  }
  #floating-search #venue-search:focus { border: none; outline: none; }

  /* ── Top-right: brand logo ─────────────────────────────────────────────────── */
  #floating-brand {
    position: absolute;
    top: 16px;
    right: 16px;
    z-index: 900;
  }
  #floating-brand .floating-card {
    padding: 10px 18px;
  }

  /* ── Bottom-center: intent chips + sun arc + date/time ────────────────────── */
  #floating-bottom {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 900;
    width: min(560px, calc(100vw - 32px));
    pointer-events: none;
  }
  #floating-bottom > * { pointer-events: all; }
  #floating-bottom .floating-card { padding: 12px 16px; }

  #bottom-top-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 0;
  }
  #bottom-top-row #intent-row {
    flex: 1;
    gap: 6px;
  }
  #floating-bottom #sun-compass {
    display: block;
    flex-shrink: 0;
    border-radius: 50%;
  }

  /* Sun arc canvas row */
  #bottom-arc-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 10px 0 0;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  #sun-curve {
    flex: 1;
    height: 72px;
    display: block;
    min-width: 0;
  }

  /* Weather pill — right of sun arc */
  #wx-now {
    flex-shrink: 0;
    width: 62px;
    display: none;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    gap: 2px;
    font-size: 10px;
    color: var(--muted);
    line-height: 1.4;
  }
  #wx-now.loaded { display: flex; }
  #wx-now .wx-temp {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.1;
  }

  /* Wind shelter tags in venue cards */
  .wind-tag {
    cursor: default;
    font-size: 12px;
    line-height: 1;
  }
  .wind-tag.sheltered { color: #64ffb4; opacity: 0.85; }
  .wind-tag.exposed   { color: #ffaa55; }

  /* ── Score badge ──────────────────────────────────────────────────── */
  .score-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    border-radius: 8px;
    padding: 2px 7px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .score-badge.tier-high { color: #ffd966; background: rgba(255,217,102,0.13); border-color: rgba(255,217,102,0.28); }
  .score-badge.tier-mid  { color: #7dd87d; background: rgba(125,216,125,0.12); border-color: rgba(125,216,125,0.25); }
  .score-badge.tier-low  { color: #f0b46a; background: rgba(240,180,106,0.12); border-color: rgba(240,180,106,0.25); }
  .score-badge.tier-poor { color: var(--muted); background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.09); }

  .score-detail {
    display: flex;
    gap: 7px;
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
    flex-wrap: wrap;
  }
  .score-detail span { display: inline-flex; align-items: center; gap: 2px; }

  .bottom-controls-row {
    display: flex;
    gap: 16px;
    align-items: center;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.06);
    margin-top: 10px;
  }
  .bottom-controls-row .control-row:first-child { flex-shrink: 0; }
  .bottom-controls-row .control-row:last-child  { flex: 1; }

  /* Day navigation buttons */
  .day-nav-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 3px 7px;
    cursor: pointer;
    line-height: 1;
    transition: color 0.12s, border-color 0.12s;
    flex-shrink: 0;
  }
  .day-nav-btn:hover { color: var(--accent); border-color: rgba(255,184,0,0.35); }

  /* ── Panel toggle — on right edge of left panel ───────────────────────────── */
  #panel-toggle {
    position: absolute;
    left: 352px;    /* panel 320 + margin 16 + gap 16 */
    top: 50%;
    transform: translateY(-50%);
    z-index: 900;
    background: rgba(22,33,62,0.82);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-left: none;
    border-radius: 0 8px 8px 0;
    color: var(--muted);
    width: 22px;
    height: 52px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    transition: background 0.15s, color 0.15s;
    padding: 0;
  }
  #panel-toggle:hover { background: var(--card-bg); color: var(--accent); }

  /* CONTROLS */
  .control-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .control-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    width: 32px;
    flex-shrink: 0;
  }

  #date-picker {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    padding: 4px 8px;
    outline: none;
    flex: 1;
  }

  #date-picker::-webkit-calendar-picker-indicator {
    filter: invert(0.7) sepia(1) saturate(3) hue-rotate(5deg);
    cursor: pointer;
  }


  /* POPUP */
  .mapboxgl-popup {
    z-index: 800;
  }

  .mapboxgl-popup-content {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    padding: 12px 16px;
    max-width: 240px;
  }

  .mapboxgl-popup-anchor-bottom .mapboxgl-popup-tip { border-top-color: var(--panel); }
  .mapboxgl-popup-anchor-top    .mapboxgl-popup-tip { border-bottom-color: var(--panel); }
  .mapboxgl-popup-anchor-left   .mapboxgl-popup-tip { border-right-color: var(--panel); }
  .mapboxgl-popup-anchor-right  .mapboxgl-popup-tip { border-left-color: var(--panel); }

  .mapboxgl-popup-close-button {
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    padding: 4px 8px;
    background: none;
    border: none;
  }
  .mapboxgl-popup-close-button:hover {
    background: rgba(255,255,255,0.08);
    border-radius: 0 12px 0 0;
    color: var(--text);
  }

  /* Mapbox nav control — glass morphism to match floating cards */
  .mapboxgl-ctrl-bottom-right { right: 16px; }
  .mapboxgl-ctrl-group {
    background: rgba(22,33,62,0.88) !important;
    backdrop-filter: blur(20px) !important;
    -webkit-backdrop-filter: blur(20px) !important;
    border: 1px solid rgba(255,184,0,0.13) !important;
    border-radius: 12px !important;
    overflow: hidden !important;
    box-shadow: none !important;
  }
  .mapboxgl-ctrl-group button {
    background-color: transparent !important;
    border-bottom-color: rgba(255,184,0,0.1) !important;
  }
  .mapboxgl-ctrl-group button:hover { background: rgba(255,255,255,0.06) !important; }
  .mapboxgl-ctrl-icon { filter: invert(0.7); }

  .popup-name {
    font-family: 'DM Serif Display', serif;
    font-size: 15px;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .popup-meta {
    font-size: 12px;
    color: var(--muted);
  }

  .popup-address {
    font-size: 11px;
    color: var(--muted);
    opacity: 0.7;
    margin-top: 2px;
  }

  .popup-status {
    margin-top: 6px;
    font-size: 12px;
    font-weight: 600;
  }

  .popup-status.sunny         { color: var(--accent); }
  .popup-status.shaded        { color: var(--muted); }
  .popup-status.opening-soon  { color: #7ab4ff; }

  .popup-actions {
    margin-top: 10px;
    display: flex;
    gap: 6px;
  }

  .popup-directions-btn, .popup-edit-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
  }

  .popup-directions-btn {
    background: rgba(122,180,255,0.12);
    border: 1px solid rgba(122,180,255,0.3);
    color: #7ab4ff;
  }
  .popup-directions-btn:hover { background: rgba(122,180,255,0.22); }

  .popup-edit-btn {
    background: rgba(255,184,0,0.12);
    border: 1px solid rgba(255,184,0,0.3);
    color: var(--accent);
  }
  .popup-edit-btn:hover { background: rgba(255,184,0,0.22); }

  /* LEFT PANEL — venue list, floats below search bar */
  #panel {
    position: absolute;
    top: 72px;      /* 16 top + ~48 search card + 8 gap */
    left: 16px;
    bottom: 16px;
    width: 320px;
    background: rgba(22,33,62,0.88);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,184,0,0.13);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: transform 0.28s ease, opacity 0.28s ease;
    z-index: 800;
  }

  #panel-header {
    padding: 12px 14px 0;
    flex-shrink: 0;
    overflow: visible;
  }

  /* Brand logo (now in floating-brand) */
  #brand-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    color: var(--accent);
    letter-spacing: 0.3px;
  }
  #brand-logo span {
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 0;
    margin-left: 6px;
  }

  #sun-compass { display: block; cursor: default; }

  /* Controls (now in floating-bottom) */
  #panel-controls {
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: visible;
  }

  /* Search input */
  #venue-search {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 4px 2px;
    outline: none;
  }
  #venue-search::placeholder { color: var(--muted); }

  /* Intent shortcuts */
  #intent-row {
    display: flex;
    gap: 6px;
  }
  .intent-btn {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 7px 4px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .intent-btn:hover:not(.active) {
    border-color: rgba(255,184,0,0.3);
    color: var(--text);
  }
  .intent-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  /* Area chips */
  #area-chips {
    display: flex;
    gap: 5px;
    overflow-x: auto;
    padding-bottom: 12px;
    scrollbar-width: none;
  }
  #area-chips::-webkit-scrollbar { display: none; }
  .area-chip {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    padding: 4px 11px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .area-chip:hover:not(.active) {
    border-color: rgba(255,184,0,0.3);
    color: var(--text);
  }
  .area-chip.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Venue list header: count + map-view (left) · sort buttons (right) */
  #venue-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    margin-bottom: 8px;
    gap: 6px;
  }
  .vh-left {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  #venue-count {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
  }
  #venue-count.count-sunny { color: var(--accent); }
  /* Map-view filter pill — lives next to count, not with sort buttons */
  #map-view-btn {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05);
    color: var(--muted);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #map-view-btn:hover:not(.active) { color: var(--text); border-color: rgba(255,184,0,0.3); }
  #map-view-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }
  #list-actions {
    display: flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
  }
  .sort-btn {
    background: none;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    padding: 3px 8px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .sort-btn:hover:not(.active) { color: var(--text); border-color: rgba(255,255,255,0.12); }
  .sort-btn.active { color: var(--accent); border-color: rgba(255,184,0,0.3); }

  /* Legacy class — keep for any remaining references */
  .filter-toggle-btn {
    background: none;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    padding: 3px 8px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .filter-toggle-btn:hover:not(.active) { color: var(--text); }
  .filter-toggle-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Venue list */
  #venue-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px 20px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,184,0,0.2) transparent;
  }

  #venue-list::-webkit-scrollbar { width: 4px; }
  #venue-list::-webkit-scrollbar-track { background: transparent; }
  #venue-list::-webkit-scrollbar-thumb { background: rgba(255,184,0,0.2); border-radius: 2px; }

  @keyframes cardIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .venue-card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 13px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s;
    border-left: 3px solid transparent;
    position: relative;
    animation: cardIn 0.18s ease-out;
    will-change: opacity;
  }

  .venue-card:hover {
    transform: translateX(-2px);
    box-shadow: 2px 4px 16px rgba(0,0,0,0.3);
  }

  .venue-card.sunny {
    border-left-color: var(--accent);
  }

  .venue-card.selected {
    box-shadow: 0 0 0 1px var(--accent), 2px 4px 16px rgba(0,0,0,0.4);
  }

  .venue-card.dimmed {
    opacity: 0.5;
  }

  .venue-card.editing {
    box-shadow: 0 0 0 2px rgba(255,184,0,0.55), 2px 4px 18px rgba(0,0,0,0.4);
    border-left-color: var(--accent);
    opacity: 1 !important;
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 5px;
  }

  .card-name {
    font-family: 'DM Serif Display', serif;
    font-size: 14px;
    color: var(--text);
    line-height: 1.3;
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-emoji {
    font-size: 18px;
    flex-shrink: 0;
  }

  .card-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  .card-badge.sunny {
    background: rgba(255,184,0,0.2);
    color: var(--accent);
  }

  .card-badge.shaded {
    background: rgba(138,154,176,0.15);
    color: var(--muted);
  }
  .card-badge.opening-soon {
    background: rgba(122,180,255,0.15);
    color: #7ab4ff;
  }
  .card-badge.closing-soon {
    background: rgba(255,140,60,0.15);
    color: #ffaa55;
  }
  .card-badge.neutral {
    background: rgba(138,154,176,0.15);
    color: #7ab4ff;
  }

  .card-meta {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .card-rating {
    color: var(--accent);
    font-weight: 600;
  }

  #hover-tooltip {
    position: absolute;
    z-index: 1100;
    background: var(--pill-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    pointer-events: none;
    display: none;
    width: 220px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }

  #hover-tooltip.visible { display: block; }

  .ht-name {
    font-family: 'DM Serif Display', serif;
    font-size: 13px;
    color: var(--accent);
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ht-meta {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .ht-status {
    font-size: 11px;
    font-weight: 600;
    margin-top: 4px;
  }

  .ht-status.sunny   { color: var(--accent); }
  .ht-status.shaded  { color: var(--muted); }
  .ht-status.neutral { color: #7ab4ff; }

  .ht-timeline {
    margin-top: 9px;
  }

  .ht-tl-track {
    height: 5px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    position: relative;
    margin-bottom: 4px;
    overflow: visible;
  }

  .ht-tl-seg {
    position: absolute;
    top: 0;
    height: 100%;
    background: linear-gradient(90deg, #ff9900, #FFB800);
    border-radius: 3px;
    opacity: 0.85;
  }

  .ht-tl-needle {
    position: absolute;
    top: -3px;
    width: 2px;
    height: 11px;
    background: #fff;
    border-radius: 1px;
    transform: translateX(-50%);
    box-shadow: 0 0 3px rgba(255,255,255,0.5);
  }

  .ht-tl-labels {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: var(--muted);
    opacity: 0.6;
    margin-top: 2px;
  }

  #facing-status {
    font-size: 11px;
    color: var(--accent);
    opacity: 0.75;
    padding: 6px 0 2px;
    min-height: 18px;
    transition: opacity 0.5s;
  }

  .card-address {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 5px;
    opacity: 0.7;
  }


  /* Edit mode overlay */
  #edit-overlay {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1200;
    display: none;
  }

  #edit-banner {
    background: var(--pill-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,184,0,0.45);
    border-radius: 14px;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    white-space: nowrap;
    box-shadow: 0 4px 28px rgba(0,0,0,0.6);
  }

  #edit-info { display: flex; flex-direction: column; gap: 2px; }

  #edit-title {
    font-family: 'DM Serif Display', serif;
    font-size: 14px;
    color: var(--accent);
  }

  #edit-subtitle {
    font-size: 11px;
    color: var(--muted);
  }

  #edit-venue-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    padding: 4px 10px;
    background: rgba(255,255,255,0.07);
    border-radius: 8px;
  }

  #edit-facing-display {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    min-width: 72px;
    text-align: center;
  }

  #edit-facing-display .preview {
    color: #7ab4ff;
  }

  #edit-satellite-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #edit-satellite-btn:hover { background: rgba(255,255,255,0.17); }

  #edit-satellite-btn.active {
    background: rgba(100,180,255,0.18);
    border-color: rgba(100,180,255,0.55);
    color: #7ab4ff;
  }

  #edit-done-btn {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #1a1a2e;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    padding: 7px 18px;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  #edit-done-btn:hover { opacity: 0.85; }

  /* Timeline */
  .card-timeline {
    margin-top: 7px;
  }

  .tl-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }

  .tl-track {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.07);
    border-radius: 3px;
    position: relative;
    overflow: visible;
  }

  .tl-sun-seg {
    position: absolute;
    top: 0;
    height: 100%;
    background: linear-gradient(90deg, #ff9900, #FFB800);
    border-radius: 3px;
    opacity: 0.85;
  }

  .tl-needle {
    position: absolute;
    top: -4px;
    width: 2px;
    height: 14px;
    background: #fff;
    border-radius: 1px;
    transform: translateX(-50%);
    box-shadow: 0 0 4px rgba(255,255,255,0.5);
  }

  .tl-labels {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--muted);
    opacity: 0.6;
  }

  .tl-badge {
    font-size: 10px;
    font-weight: 600;
    white-space: nowrap;
    padding: 1px 6px;
    border-radius: 8px;
    flex-shrink: 0;
  }

  .tl-badge.sunny {
    background: rgba(255,184,0,0.18);
    color: var(--accent);
  }

  .tl-badge.neutral {
    background: rgba(138,154,176,0.15);
    color: #7ab4ff;
  }

  .tl-badge.muted {
    background: rgba(138,154,176,0.1);
    color: var(--muted);
  }

  /* Now button */
  #now-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #now-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }
  #now-btn:hover:not(.active) {
    border-color: rgba(255,184,0,0.4);
    color: var(--text);
  }

  /* Dual range slider */
  .time-range-wrap {
    flex: 1;
    position: relative;
    height: 20px;
    display: flex;
    align-items: center;
    overflow: visible;
  }
  .time-range-track-bg {
    position: absolute;
    top: 8px;
    left: 0; right: 0; height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    pointer-events: none;
  }
  .time-range-wrap input[type=range] {
    position: absolute;
    width: 100%;
    margin: 0;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    pointer-events: none;
    height: 20px;
    outline: none;
  }
  .time-range-wrap input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #16213e;
    cursor: pointer;
    pointer-events: all;
    box-shadow: 0 0 6px rgba(255,184,0,0.4);
  }
  .time-range-wrap input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #16213e;
    cursor: pointer;
    pointer-events: all;
  }
  .time-range-wrap input[type=range]:hover::-webkit-slider-thumb {
    background: #ffd040;
    box-shadow: 0 0 10px rgba(255,184,0,0.6);
  }
  .time-range-wrap.now-active input[type=range]::-webkit-slider-thumb {
    background: #16213e;
    border-color: rgba(255,184,0,0.45);
    box-shadow: none;
    cursor: default;
  }
  .time-range-wrap.now-active input[type=range]:hover::-webkit-slider-thumb {
    background: #1e2d4a;
    border-color: rgba(255,184,0,0.7);
    box-shadow: 0 0 6px rgba(255,184,0,0.15);
  }
  .time-range-sun-bg {
    position: absolute;
    top: 8px;
    height: 4px;
    background: rgba(255,184,0,0.13);
    border-radius: 2px;
    pointer-events: none;
  }
  .time-display-row {
    position: absolute;
    top: 22px;
    left: 0; right: 0;
    height: 12px;
  }
  .time-display-row span {
    position: absolute;
    transform: translateX(-50%);
    font-size: 9px;
    color: var(--muted);
    white-space: nowrap;
    transition: left 0.05s;
  }

  .tl-end-sun {
    position: absolute;
    top: -4px;
    width: 2px;
    height: 14px;
    background: rgba(255,140,0,0.75);
    border-radius: 1px;
    transform: translateX(-50%);
  }
  .tl-end-sun-label {
    position: absolute;
    top: calc(100% + 5px);
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    color: rgba(255,140,0,0.85);
    white-space: nowrap;
  }
  .tl-label-icon {
    opacity: 0.55;
    font-size: 8px;
  }

  /* Timeline extras */
  .tl-shade-seg {
    position: absolute;
    top: 0; height: 100%;
    background: rgba(255,255,255,0.035);
    border-radius: 3px;
  }
  .tl-range-seg {
    position: absolute;
    top: -3px; height: calc(100% + 6px);
    background: rgba(255,184,0,0.12);
    border-left: 1px solid rgba(255,184,0,0.35);
    border-right: 1px solid rgba(255,184,0,0.35);
    border-radius: 2px;
    pointer-events: none;
  }
  .tl-closed-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 8px;
    background: rgba(255,80,80,0.1);
    color: #ff8a8a;
    white-space: nowrap;
    flex-shrink: 0;
  }
  /* "Try tomorrow" banner in venue list */
  #no-sun-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,184,0,0.06);
    border: 1px solid rgba(255,184,0,0.18);
    border-radius: 10px;
    padding: 9px 14px;
    margin-bottom: 10px;
    font-size: 12px;
    color: var(--muted);
  }
  #no-sun-banner button {
    background: rgba(255,184,0,0.15);
    border: 1px solid rgba(255,184,0,0.35);
    border-radius: 7px;
    color: var(--accent);
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 11px;
    cursor: pointer;
    transition: background 0.12s;
  }
  #no-sun-banner button:hover { background: rgba(255,184,0,0.25); }

  .venue-card.closed-card {
    padding: 8px 14px;
    opacity: 0.4;
    cursor: pointer;
  }
  .venue-card.closed-card:hover { opacity: 0.65; }
  .closed-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .closed-name {
    font-size: 12px;
    color: var(--muted);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
<div id="app">
  <!-- MAP — full-screen -->
  <div id="map-container">
    <div id="map"></div>
    <canvas id="canvas-overlay"></canvas>

    <!-- HOVER TOOLTIP -->
    <div id="hover-tooltip"></div>

    <!-- EDIT FACING OVERLAY -->
    <div id="edit-overlay">
      <div id="edit-banner">
        <div id="edit-info">
          <div id="edit-title">Set terrace direction</div>
          <div id="edit-subtitle">Click walls to add/remove · drag ● to set depth</div>
        </div>
        <div id="edit-venue-label">—</div>
        <div id="edit-facing-display">—</div>
        <button id="edit-satellite-btn" onclick="toggleEditSatellite()" title="Toggle satellite view">
          🛰 Satellite
        </button>
        <button id="edit-done-btn" onclick="exitEditMode()">Done</button>
      </div>
    </div>

  </div>

  <!-- Top-left: search bar -->
  <div id="floating-search" class="floating-card">
    <input type="text" id="venue-search" placeholder="Search venues or areas…" autocomplete="off">
  </div>

  <!-- Top-right: brand logo -->
  <div id="floating-brand">
    <div class="floating-card">
      <div id="brand-logo">Solsteder<span>Oslo sun places</span></div>
    </div>
  </div>

  <!-- Bottom-center: intent chips + sun arc + compass + date/time slider -->
  <div id="floating-bottom">
    <div class="floating-card">
      <!-- Row 1: intent shortcuts + sun compass -->
      <div id="bottom-top-row">
        <div id="intent-row">
          <button class="intent-btn" data-intent="now"        onclick="setIntent('now')">Now</button>
          <button class="intent-btn" data-intent="lunch"      onclick="setIntent('lunch')">Lunch</button>
          <button class="intent-btn" data-intent="after-work" onclick="setIntent('after-work')">After work</button>
          <button class="intent-btn" data-intent="evening"    onclick="setIntent('evening')">Evening</button>
        </div>
        <canvas id="sun-compass" width="44" height="44"></canvas>
      </div>
      <!-- Row 2: sun arc curve + current weather pill -->
      <div id="bottom-arc-row">
        <canvas id="sun-curve"></canvas>
        <div id="wx-now"></div>
      </div>
      <!-- Row 3: date navigation + time slider -->
      <div class="bottom-controls-row">
        <div class="control-row">
          <span class="control-label">Date</span>
          <button class="day-nav-btn" onclick="advanceDay(-1)" title="Previous day">‹</button>
          <input type="date" id="date-picker">
          <button class="day-nav-btn" onclick="advanceDay(1)" title="Next day">›</button>
        </div>
        <div class="control-row">
          <span class="control-label">Time</span>
          <div class="time-range-wrap" id="time-range-wrap">
            <div class="time-range-sun-bg" id="time-range-sun-bg"></div>
            <div class="time-range-track-bg"></div>
            <input type="range" id="time-from" min="4" max="23" step="0.25" value="10">
            <div class="time-display-row">
              <span id="time-display-from">10:00</span>
            </div>
          </div>
          <button id="now-btn" onclick="toggleNowMode()" style="display:none">Now</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Panel toggle — on right edge of left panel -->
  <button id="panel-toggle" onclick="togglePanel()" title="Toggle sidebar">‹</button>

  <!-- LEFT PANEL — venue list, floats below search bar -->
  <div id="panel">
    <div id="panel-header">
      <!-- Area filter chips -->
      <div id="area-chips">
        <button class="area-chip active" data-area="" onclick="setAreaFilter('')">All</button>
        <button class="area-chip" data-area="Aker Brygge" onclick="setAreaFilter('Aker Brygge')">Aker Brygge</button>
        <button class="area-chip" data-area="Tjuvholmen" onclick="setAreaFilter('Tjuvholmen')">Tjuvholmen</button>
        <button class="area-chip" data-area="Sentrum" onclick="setAreaFilter('Sentrum')">Sentrum</button>
        <button class="area-chip" data-area="Frogner" onclick="setAreaFilter('Frogner')">Frogner</button>
        <button class="area-chip" data-area="St. Hanshaugen" onclick="setAreaFilter('St. Hanshaugen')">St. H.</button>
        <button class="area-chip" data-area="Bislett" onclick="setAreaFilter('Bislett')">Bislett</button>
      </div>

      <!-- Venue list header: count + map-view (left) · sort (right) -->
      <div id="venue-header">
        <div class="vh-left">
          <span id="venue-count">—</span>
          <button id="map-view-btn" onclick="toggleMapView()" title="Filter to current map view">⊞ In view</button>
        </div>
        <div id="list-actions">
          <button class="sort-btn active" data-sort="score" onclick="setSortBy('score')" title="Sort by score">⭐ Score</button>
          <button class="sort-btn" data-sort="rating" onclick="setSortBy('rating')" title="Sort by rating">★ Rating</button>
          <button class="sort-btn" data-sort="distance" onclick="setSortBy('distance')" title="Sort by distance">⊙ Near</button>
        </div>
      </div>

      <div id="facing-status"></div>
    </div>
    <div id="venue-list"></div>
  </div>
</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.js"></script>
<script src="js/config.js"></script>
<script src="js/solar.js"></script>
<script src="js/data.js"></script>
<script src="js/weather.js"></script>
<script src="js/scoring.js"></script>
<script src="js/app.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/osm.js"></script>
<script>
loadVenues().then(() => {
  updateRangeFill();
  update();
  initFacings();
  initWeather(); // fetch MET Norway forecast (async, re-renders when data arrives)
});
</script>
</body>
</html>
