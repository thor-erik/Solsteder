  }
  /* Desktop cal-open: don't slide the side panel away (it doesn't
     visually overlap the FTS float anyway), but drop its z-index so
     it can never sit in front of the calendar by accident. */
  body.cal-open #detail-panel.open {
    z-index: 700;
  }
  /* dp-content wraps the rendered content so dp-handle can sit above the scroll area */
  #dp-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  /* ── Venue photo gallery ────────────────────────────────────────────────── */
  .dp-photos {
    display: flex;
    gap: 3px;
    overflow-x: auto;
    scrollbar-width: none;
    margin: -14px -16px 14px;
    scroll-snap-type: x mandatory;
    border-radius: 10px 10px 0 0;
    overflow: hidden;         /* clip rounded corners */
    overflow-x: auto;         /* re-enable horizontal scroll */
    position: relative;
    /* Browser claims horizontal pans for native scroll, so the detail
       panel's drag handler never sees them (was sliding the panel up/
       down on any minor vertical drift during a swipe). */
    touch-action: pan-x;
  }
  /* Bevel: soft gradient at the top of the photo section, blending into the panel glass */
  .dp-photos::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 22px;
    background: linear-gradient(to bottom, rgba(14,26,52,0.55), transparent);
    z-index: 2;
    pointer-events: none;
  }
  .dp-photos::-webkit-scrollbar { display: none; }
  .dp-photo {
    width: 304px;  /* detail-panel width 336 - 32px horizontal padding */
    height: 190px;
    object-fit: cover;
    flex-shrink: 0;
    scroll-snap-align: start;
    background: rgba(20,46,82,0.6);
  }
  .dp-photo:first-child:last-child {
    width: 100%; /* single photo fills full width */
  }

  #dp-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 14px 16px 24px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,175,133,0.2) transparent;
    contain: layout style;
  }
  #dp-scroll::-webkit-scrollbar { width: 4px; }
  #dp-scroll::-webkit-scrollbar-track { background: transparent; }
  #dp-scroll::-webkit-scrollbar-thumb { background: rgba(255,175,133,0.2); border-radius: 2px; }
  .dp-header-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
  }
  .dp-venue-name {
    font-family: 'Inter', sans-serif;
    font-style: normal;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    text-transform: none;
    color: #FFF2EB;
    line-height: 1.15;
    flex: 1;
    min-width: 0;
  }
  #dp-close-btn {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(156,189,231,0.1);
    border: 1px solid rgba(156,189,231,0.18);
    border-radius: 8px;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    margin-top: 2px;
    transition: background 0.12s, color 0.12s;
  }
  #dp-close-btn:hover { background: rgba(156,189,231,0.22); color: var(--text); }
  .dp-close-back { display: none; }  /* shown on mobile only */
  .dp-meta {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 10px;
    opacity: 0.8;
  }
  .dp-limited-solar {
    font-size: 11px;
    color: var(--muted);
    background: rgba(156,189,231,0.07);
    border: 1px solid rgba(156,189,231,0.15);
    border-radius: 8px;
    padding: 7px 10px;
    margin-bottom: 10px;
    opacity: 0.8;
  }
  .dp-dial-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    margin: 8px 0 14px;
  }
  .dp-dial-svg {
    width: 100%;
    height: auto;
    max-height: 200px;
    filter: drop-shadow(0 2px 24px rgba(255,175,133,0.18));
  }
  .dp-sun-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 20px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  .dp-sun-pill.sunny    { background: rgba(255,175,133,0.88); color: #142E52; }
  .dp-sun-pill.overcast { background: rgba(165,170,178,0.18); color: rgba(165,170,178,0.9); border: 1px solid rgba(165,170,178,0.28); }
  .dp-sun-pill.rainy    { background: rgba(156,189,231,0.18); color: rgba(156,189,231,0.9); border: 1px solid rgba(156,189,231,0.28); }
  .dp-sun-pill.neutral  { background: rgba(255,175,133,0.12); color: var(--accent); border: 1px solid rgba(255,175,133,0.28); }
  .dp-sun-pill.muted    { background: rgba(156,189,231,0.15); color: var(--muted); border: 1px solid rgba(156,189,231,0.22); }
  /* Experience Index */
  .dp-exp-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 10px;
    margin-bottom: 4px;
  }
  .dp-exp-label { font-size: 14px; font-weight: 400; color: #FFF2EB; }
  .dp-exp-hint  { font-size: 12px; font-weight: 400; color: #9CBDE7; margin-top: 1px; }
  .dp-exp-val   { font-family: 'Inter', sans-serif; font-style: italic; font-size: 16px; font-weight: 600; color: #FFAF85; }
  .dp-dial-svg.dp-dial-locked circle:first-of-type { stroke: rgba(255,175,133,0.22); }
  .dp-exp-bar-wrap {
    height: 1px;
    background: rgba(156,189,231,0.15);
    border-radius: 1px;
    overflow: visible;
    margin-bottom: 8px;
  }
  .dp-exp-bar-fill {
    height: 100%;
    background: #FFAF85;
    border-radius: 1px;
  }
  .dp-score-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .dp-score-num {
    font-family: 'Inter', sans-serif;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    flex-shrink: 0;
  }
  .dp-score-num span {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 8px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    opacity: 0.5;
    margin-top: 2px;
  }
  .dp-score-num.tier-high { color: #FFAF85; }
  .dp-score-num.tier-mid  { color: #7dd87d; }
  .dp-score-num.tier-low  { color: #f0b46a; }
  .dp-score-num.tier-poor { color: var(--muted); }
  .dp-score-breakdown {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 3px;
    opacity: 0.8;
  }
  .dp-section-label {
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #9CBDE7;
    margin-bottom: 8px;
    margin-top: 2px;
  }
  .dp-divider {
    height: 1px;
    background: rgba(156,189,231,0.18);
    margin: 12px 0;
  }
  .dp-address {
    font-size: 11px;
    color: var(--muted);
    opacity: 0.7;
    margin-bottom: 12px;
  }
  .dp-gm-actions {
    display: flex;
    gap: 6px;
    margin: 12px 0;
  }
  .dp-gm-chip {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 10px 6px 8px;
    background: var(--glass-action-bg);
    border: var(--glass-border);
    border-radius: 12px;
    box-shadow: var(--glass-inset);
    color: #FFAF85;
    font-size: 12px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    letter-spacing: normal;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    transition: background 0.12s;
  }
  .dp-gm-chip:hover { background: rgba(20,46,82,0.65); }
  .dp-gm-chip svg { stroke: #FFAF85; flex-shrink: 0; }

  .dp-actions {
    display: flex;
    gap: 6px;
  }
  .dp-action-btn {
    flex: 1;
    font-size: 12px;
    font-weight: 500;
    padding: 7px 10px;
    border-radius: 12px;
    border: var(--glass-border);
    background: var(--glass-action-bg);
    box-shadow: var(--glass-inset);
    color: #FFAF85;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    transition: background 0.12s;
    font-family: 'Inter', sans-serif;
  }
  .dp-action-btn:hover { background: rgba(20,46,82,0.65); }
  .dp-action-btn.directions {
    background: var(--glass-action-bg);
    border: var(--glass-border);
    color: #FFAF85;
  }
  .dp-action-btn.directions:hover { background: rgba(20,46,82,0.65); }

  .dp-busy-row {
    display: flex;
    align-items: baseline;
    gap: 5px;
    margin-bottom: 6px;
  }
  .dp-busy-now {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
  }
  .dp-busy-est {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: rgba(156,189,231,0.35);
  }
  .dp-busy-chart {
    width: 100%;
  }
  .dp-busy-labels {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: var(--muted);
    opacity: 0.5;
    margin-top: 4px;
  }

  /* Detail panel drag handle */
  #dp-handle {
    display: none; /* shown on mobile only */
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 16px 0 14px;
    flex-shrink: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    position: relative;
  }
  #dp-handle-pill {
    width: 36px;
    height: 4px;
    background: rgba(156,189,231,0.25);
    border-radius: 2px;
  }

  /* Hide UI elements when detail panel is open on mobile */
  .mobile-ui-hidden { display: none !important; }

  /* ──── Detail panel — photo header with overlay ───────────────────────── */
  /* The photo block is the venue takeover: a single rectangular frame with
     the photo carousel filling it, a dark gradient over the bottom 55%, and
     the venue name + meta laid on top in cream. Friend chip lives top-right.
     Title moved here from the dp-card so identity reads with the photo. */
  .detail-new-photos {
    position: relative;
    height: 200px;
    border-radius: 14px;
    margin-bottom: 14px;
    overflow: hidden;
    background: linear-gradient(135deg, #3a4b6e, #2a3a5c);
    flex-shrink: 0;
    contain: layout style;
  }
  .detail-new-photos-scroll {
    position: absolute;
    inset: 0;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x mandatory;
  }
  .detail-new-photos-scroll::-webkit-scrollbar { display: none; }
  .detail-new-photos-scroll img {
    height: 100%;
    min-width: 100%;
    max-width: 100%;
    object-fit: cover;
    flex-shrink: 0;
    scroll-snap-align: start;
  }

  /* Dark gradient over the bottom 55% so cream text stays readable on any
     photo. Top half stays clear so the photo's atmosphere reads. */
  .photo-overlay-grad {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(
      to bottom,
      rgba(15,27,42,0) 0%,
      rgba(15,27,42,0) 45%,
      rgba(15,27,42,0.55) 78%,
      rgba(15,27,42,0.88) 100%
    );
  }

  /* Title + meta lockup, anchored to the bottom-left of the photo. */
  .photo-overlay-header {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 14px;
    pointer-events: none;
  }
  .photo-overlay-title {
    color: var(--text);
    font-size: 22px;
    font-weight: 700;
    line-height: 1.18;
    letter-spacing: -0.012em;
    text-shadow: 0 1px 4px rgba(0,0,0,0.45);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .photo-overlay-meta {
    color: rgba(255,244,224,0.78);
    font-size: 12.5px;
    font-weight: 500;
    margin-top: 4px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.45);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Friend-here chip — top-right of the photo. Honey-tinted glass capsule
     with cream text. Compact (18px avatars + name + count). */
  .detail-new-photos .photo-overlay-chip {
    position: absolute;
    top: 12px;
    right: 12px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 9px 4px 4px;
    border-radius: 999px;
    background: rgba(245,194,94,0.22);
    backdrop-filter: blur(6px) saturate(140%);
    -webkit-backdrop-filter: blur(6px) saturate(140%);
    border: 1px solid rgba(245,194,94,0.35);
    color: var(--text);
    font-size: 11.5px;
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(0,0,0,0.30);
    pointer-events: auto;
  }
  .detail-new-photos .photo-overlay-chip .avatar-row { gap: -4px; }

  /* No-photo empty state — same frame + overlay structure, with a soft
     slate base + warm honey radial wash + centered camera icon. The title
     overlay still renders so the venue still reads as primary. */
  .detail-new-photos-empty {
    background:
      radial-gradient(ellipse at 30% 20%, rgba(245,194,94,0.14) 0%, rgba(245,194,94,0) 55%),
      linear-gradient(180deg, rgba(58,75,110,0.55) 0%, rgba(26,44,66,0.85) 100%);
  }
  .detail-new-photos-empty-art {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    opacity: 0.55;
    pointer-events: none;
  }

  /* Photo count indicator — top-left of the photo, only when multi-photo.
     Compact "1 / 8" pill on glass. Static (not scroll-tracked) for now. */
  .photo-overlay-count {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 3px 8px;
    border-radius: 999px;
    background: rgba(15,27,42,0.55);
    backdrop-filter: blur(6px) saturate(140%);
    -webkit-backdrop-filter: blur(6px) saturate(140%);
    color: rgba(255,244,224,0.92);
    font-size: 11px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    pointer-events: none;
  }

  /* Friend chip — expand-on-tap. Default state shows the summary pill;
     when .expanded, a panel below the summary lists every friend with
     their check-in time. Scoped only to is-expandable (2+ friends). */
  .detail-new-photos .photo-overlay-chip.is-expandable { cursor: pointer; }
  .detail-new-photos .photo-overlay-chip-summary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .detail-new-photos .photo-overlay-chip-list {
    display: none;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,244,224,0.18);
    flex-direction: column;
    gap: 6px;
  }
  .detail-new-photos .photo-overlay-chip.expanded {
    align-items: flex-start;
    padding: 8px 10px 9px;
    border-radius: 12px;
  }
  .detail-new-photos .photo-overlay-chip.expanded .photo-overlay-chip-summary {
    width: 100%;
  }
  .detail-new-photos .photo-overlay-chip.expanded .photo-overlay-chip-list {
    display: flex;
  }
  .chip-list-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    color: var(--text);
  }
  .chip-list-avatar {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 9px;
    font-weight: 700;
  }
  .chip-list-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip-list-time { color: rgba(255,244,224,0.65); font-size: 10.5px; font-weight: 500; flex-shrink: 0; }

  /* ── Sun summary headline (the new dp-card content) ─────────────────────── */
  .dp-card .dp-sun-headline {
    color: var(--accent);
    font-size: 22px;
    font-weight: 700;
    line-height: 1.18;
    letter-spacing: -0.012em;
  }
  .dp-card .dp-sun-sub {
    color: rgba(255,244,224,0.72);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
    letter-spacing: 0.005em;
  }
  /* Shadow + done states tone the headline back so it reads as muted info,
     not as a primary "sunny" cue. */
  .dp-card.state-shadow .dp-sun-headline,
  .dp-card.state-rain   .dp-sun-headline {
    color: rgba(255,244,224,0.85);
  }
  .dp-card.state-done .dp-sun-headline {
    color: rgba(255,244,224,0.65);
  }
  /* Spacing between the headline block and the pills row inside the card.
     Was 12px — tightened to 8px so the card breathes less between rows. */
  .dp-card .dp-sun-headline + .dp-sun-sub + .card-pills,
  .dp-card .dp-sun-headline + .card-pills {
    margin-top: 8px;
  }

  /* ── Section title (used by Avtaler + Le for vind) ─────────────────────── */
  .dp-section { margin-top: 14px; }
  .dp-section-title {
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }

  /* ── Plans block — lives below the social card ────────────────────────── */
  .dp-plans-block {
    padding: 12px 14px;
    background: var(--glass-card-bg);
    border: var(--glass-border);
    border-radius: 14px;
    box-shadow: var(--glass-inset);
  }
  .dp-plans-block .detail-plan-item:not(:first-of-type) {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(155,169,188,0.16);
  }

  /* ── Wind shelter section ─────────────────────────────────────────────── */
  .dp-shelter-section {
    padding: 12px 14px;
    background: var(--glass-card-bg);
    border: var(--glass-border);
    border-radius: 14px;
    box-shadow: var(--glass-inset);
  }
  .dp-shelter-canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 9 / 5;
    border-radius: 10px;
  }

  /* ── Info row — adaptive: chips when ≤3 items, list when ≥4 ─────────── */
  .info-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 14px;
  }
  .info-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 999px;
    background: var(--glass-action-bg);
    border: var(--glass-border);
    box-shadow: var(--glass-inset);
    color: var(--text);
    font-size: 12px;
    font-weight: 500;
    line-height: 1;
  }
  .info-chip-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 14px;
  }
  .info-chip-text { font-variant-numeric: tabular-nums; }

  /* ── Footer toned down ─────────────────────────────────────────────────── */
  .dp-footer-quiet {
    margin-top: 18px;
    padding-top: 12px;
    border-top: 1px solid rgba(155,169,188,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    opacity: 0.55;
  }
  .dp-footer-quiet .secondary-link {
    background: none;
    border: none;
    padding: 0;
    color: var(--muted);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .dp-footer-quiet .secondary-link:hover { color: var(--text); }
  .dp-footer-sep { color: var(--muted); font-size: 11px; opacity: 0.6; }

  /* Merged header: back + title + fav/bell on one row */
  .detail-header-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 10px;
  }
  .detail-header-info {
    flex: 1;
    min-width: 0;
  }
  .detail-new-title {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.2;
  }
  .detail-new-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
  }
  .detail-new-back {
    padding: 6px 8px;
    background: none;
    border: none;
    font-size: 18px;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .detail-new-back:hover { color: var(--text); }
  .detail-header-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .dp-header-icon {
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px;
    color: var(--muted);
    line-height: 0;
    opacity: 0.75;
    transition: opacity 0.15s;
  }
  .dp-header-icon:hover { opacity: 1; }
  .dp-header-icon.active { opacity: 1; }

  /* ── Detail panel action row (directions + utilities) ────────────────────── */
  /* Aligned with the Shades design system's "Secondary Square" spec:
     48×48 rounded squares (radius 12), glass-action fill, --muted at rest,
     --accent-dim background + --accent color when toggled on. The row
     spans the full panel width — the two most-used utilities (directions,
     share) flex to absorb extra space, while toggle-state squares
     (heart, bell, optional phone/website) stay 48×48. The result lines
     up flush with the Invite friends CTA above. */
  /* ── Detail action area — two-row layout ──────────────────────────────────
     Row 1: Directions = primary venue action, Tier 4 honey CTA full-width.
     Row 2: Share / Save / Alert = peer secondary toggles, Tier 3 glass with
            icon + small label so the user doesn't have to recognise glyphs
            cold. */
  .dp-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
  }

  /* Directions — Tier 3 glass pill. Invite-friends is the only honey CTA
     in the panel; Directions stays prominent as a full-width row but in
     the slate glass family so it doesn't compete for the honey channel.
     Walk time inlined into the label so a single text run carries action
     + cost. */
  .dp-primary-cta {
    width: 100%;
    height: 46px;
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(20,46,82,0.30) 0%, rgba(32,73,131,0.18) 100%), rgba(20,46,82,0.36);
    border: 1px solid rgba(156,189,231,0.24);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    box-shadow:
      inset 0 1px 0 rgba(255,242,235,0.14),
      inset 0 -1px 0 rgba(20,46,82,0.30),
      0 2px 10px rgba(0,0,0,0.32);
    transition: transform 120ms ease-out, background 120ms ease-out, border-color 120ms ease-out, box-shadow 120ms ease-out;
  }
  .dp-primary-cta svg { width: 18px; height: 18px; stroke: currentColor; flex-shrink: 0; color: var(--accent); }
  .dp-primary-cta-label { overflow: hidden; text-overflow: ellipsis; }
  .dp-primary-cta:hover {
    transform: translateY(-1px);
    background: linear-gradient(135deg, rgba(20,46,82,0.40) 0%, rgba(32,73,131,0.26) 100%), rgba(20,46,82,0.48);
    border-color: rgba(156,189,231,0.36);
    box-shadow:
      inset 0 1px 0 rgba(255,242,235,0.18),
      inset 0 -1px 0 rgba(20,46,82,0.30),
      0 8px 22px rgba(0,0,0,0.40);
  }
  .dp-primary-cta:active {
    transform: translateY(1px);
    box-shadow: 0 1px 4px rgba(0,0,0,0.30);
  }

  /* Tier 3 secondary toggles — equal-weight peers in a single row. Each is
     a glass surface with stacked icon + label. Active state (heart, bell)
     fills with honey for a decisive ON cue. */
  .dp-secondary-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .dp-secondary-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    height: 52px;
    padding: 0 6px;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(20,46,82,0.25) 0%, rgba(32,73,131,0.14) 100%), rgba(20,46,82,0.30);
    border: 1px solid rgba(156,189,231,0.20);
    box-shadow:
      inset 0 1px 0 rgba(255,242,235,0.14),
      inset 0 -1px 0 rgba(20,46,82,0.30),
      0 2px 8px rgba(0,0,0,0.30);
    color: var(--muted);
    cursor: pointer;
    text-decoration: none;
    font-family: 'Inter', sans-serif;
    transition: all 120ms ease-out;
  }
  .dp-secondary-btn svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    color: currentColor;
    flex-shrink: 0;
  }
  .dp-secondary-label {
    font-size: 10.5px;

  /* ── Photo gallery wrapper + heart/bell overlay ──────────────────────── */
  .detail-new-photos-wrap {

    height: 36px;

  /* ── First-photo "friends here" chip overlay ─────────────────────────── */
  /* Wrapper inherits the photo's flex-item geometry so the surrounding
     scroller layout is unchanged; the chip absolute-positions inside. */
  .dp-photo-wrap {
    position: relative;
    flex-shrink: 0;
    height: 100%;
    min-width: 240px;
    max-width: 280px;
    aspect-ratio: 4/3;
    border-radius: 10px;
    overflow: hidden;

  .dp-photo-wrap img {

    height: 100%;
    object-fit: cover;
    display: block;
    /* Cancel the scroller-flex sizing — wrapper carries it. */
    min-width: 0 !important;
    max-width: none !important;
    aspect-ratio: auto !important;
    border-radius: inherit;
  }
  .photo-overlay-chip {
    position: absolute;
    bottom: 8px;
    left: 8px;
    z-index: 3;
    display: inline-flex;
    align-items: center;
    gap: 6px;

    border-radius: 999px;
    background: rgba(14, 26, 52, 0.78);
    backdrop-filter: blur(8px) saturate(160%);
    -webkit-backdrop-filter: blur(8px) saturate(160%);
    border: 1px solid rgba(156, 189, 231, 0.25);

    box-shadow: 0 2px 8px rgba(0,0,0,0.4);

    border: 1px solid rgba(255,175,133,0.42);
    box-shadow:

  .friends-photo-chip-row .chip-summary {

  .friends-photo-chip-row .chip-title {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);

  /* Avatar row used by both the photo chip and the friends card */
  .avatar-row { display: inline-flex; }
  .avatar-row .avatar {

  /* ── Detail-panel "card": same DOM as a venue-card, scaled up ────────── */
  /* The layout (card-top → card-left + card-right + timeline) is identical to
     a venue-card — only sizes scale up. This keeps the user oriented after the
     morph: they see "the same card, bigger". */
  /* Detail-panel card: hybrid of compact list card (name+meta+v2 pills with
     anchor meta) plus the rich timeline bar at the bottom — no fill bar. */
  .dp-card {
    cursor: default;
    margin-bottom: 12px;
    /* Was 16/16/14 — tightened to 12/14/12 to cut the dead space the
       card was carrying without changing the visual hierarchy. */
    padding: 12px 14px 12px;
    animation: none;
    border-radius: 14px;
    overflow: visible;  /* re-allow timeline to render outside compact's clip */
  }
  .dp-card.card-compact { padding-bottom: 12px; overflow: visible; }
  .dp-card.card-compact .card-fillbar { display: none; }
  .dp-card:hover { background: var(--glass-card-bg); }   /* kill list-card hover */
  .dp-card .card-top { gap: 14px; align-items: flex-start; }
  .dp-card .card-left { min-width: 0; gap: 4px; }
  /* Title is the venue takeover — bumped from 18 → 22 so it reads as
     hierarchically primary in the detail context (vs the same renderer
     producing a list card at 16px elsewhere). */
  .dp-card .card-new-name {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.18;
    letter-spacing: -0.012em;
  }
  .dp-card .card-new-meta {
    font-size: 12.5px;
    line-height: 1.4;
    margin-top: 4px;
  }
  .dp-card .card-right {
    min-width: 0;
    flex-shrink: 0;
    gap: 3px;
    align-items: flex-end;
  }
  .dp-card .card-new-hero-main {
    font-size: 16px;
    line-height: 1.22;
  }
  .dp-card .card-new-hero-sub  {
    font-size: 12px;
    line-height: 1.35;
    margin-top: 1px;
  }
  /* Timeline block sits at the bottom — 8px gap below the pills row (was 12). */
  .dp-card .card-timeline-block { margin-top: 8px; }

  /* dp-card timeline matches the list card's thin variant (8px). The tall
     38px treatment is gone now that the FTS pill is no longer reparented
     into the card. */

  /* Reserves layout space in the panel before openDetailPanel replaces
     it with a freshly-rendered .dp-card. Height matches a typical .dp-card
     (card-top ~50 + card-timeline 8 + small margin + padding 18+14). */
  .dp-card-slot {
    height: 100px;
    margin-bottom: 14px;
    position: relative;
  }

  /* Sol-retning section */

  /* Info rows (busyness, noise, hours) — open layout, no heavy box */
  .info-list {

  /* Footer buttons — text links, low visual weight */
  .secondary-row {
    display: flex;

  .secondary-link {
