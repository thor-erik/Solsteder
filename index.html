    white-space: nowrap;
    flex-shrink: 0;
  }
  /* "Try tomorrow" banner in venue list */
  #no-sun-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,175,133,0.06);
    border: 1px solid rgba(255,175,133,0.18);
    border-radius: 10px;
    padding: 9px 14px;
    margin-bottom: 10px;
    font-size: 12px;
    color: var(--muted);
  }
  #no-sun-banner button {
    background: rgba(255,175,133,0.15);
    border: 1px solid rgba(255,175,133,0.35);
    border-radius: 7px;
    color: var(--accent);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 11px;
    cursor: pointer;
    transition: background 0.12s;
  }
  #no-sun-banner button:hover { background: rgba(255,175,133,0.25); }

  /* ── Venue suggestion ────────────────────────────────────────────────────── */
  .suggest-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 28px 16px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }
  .suggest-empty strong { color: var(--text); font-weight: 500; }
  .suggest-btn {
    background: rgba(156,189,231,0.1);
    border: 1px solid rgba(156,189,231,0.2);
    border-radius: 20px;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 7px 16px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    text-decoration: none;
    display: inline-block;
  }
  .suggest-btn:hover { background: rgba(156,189,231,0.18); color: var(--text); }
  .suggest-btn-primary {
    background: rgba(255,175,133,0.12);
    border-color: rgba(255,175,133,0.25);
    color: #FFAF85;
  }
  .suggest-btn-primary:hover { background: rgba(255,175,133,0.22); color: #FFAF85; }
  .suggest-confirm {
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .suggest-confirm-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
  }
  .suggest-confirm-address {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .suggest-confirm-prompt {
    font-size: 13px;
    color: var(--muted);
    margin: 8px 0 4px;
  }
  .suggest-confirm-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .venue-card.closed-card {
    padding: 8px 14px;
    opacity: 0.4;
    cursor: pointer;
  }
  .venue-card.closed-card:hover { opacity: 0.65; }
  .closed-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .closed-name {
    font-size: 12px;
    color: var(--muted);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── RIGHT DETAIL PANEL ───────────────────────────────────────────── */
  /* ── Toast notice strip ─────────────────────────────────────────────── */
  #qc-wrap {
    position: absolute;
    left: 16px;
    top: 70px;     /* search top(16) + search height(46) + gap(8) */
    width: 336px;
    z-index: 820;
    pointer-events: none;
    transition: left 0.28s ease;
  }
  #qc-notice {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    padding: 2px 8px 0;
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
  }
  #qc-notice.visible { opacity: 1; }

  /* ── Panel time bar: date circle + readout + arc canvas ────────────── */
  #panel-time-bar {
    flex-shrink: 0;
    padding: 10px 10px 12px;
    border-bottom: 1px solid rgba(156, 189, 231, 0.1);
  }

  /* ── Unified control group: readout + bar as one docked surface ─────── */
  #qc-control-group {
    border-radius: 14px;
    overflow: hidden;
    transition: background 120ms ease-out;
  }
  /* ── Compact 3-row readout: rows 1-3 all inside #time-readout ─────────── */
  #time-readout {
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: background 120ms ease-out;
  }

  /* ── Row 1: calendar button (left) + inline weather (right) ─────────── */
  #readout-row1 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    height: 36px;
  }

  /* Date button — action-pill flavor, 36px height, glass-action bg */
  #readout-date-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 12px;
    background: var(--glass-action-bg);
    border: var(--glass-border);
    border-radius: 16px;
    box-shadow: var(--glass-inset);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    outline: none;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background 120ms, border-color 120ms;
  }
  #readout-date-btn:hover,
  #readout-date-btn:focus-visible {
    background: rgba(20,46,82,0.60);
    border-color: rgba(156,189,231,0.30);
  }
  /* Calendar icon: --muted at rest */
  .date-cal-icon {
    color: var(--muted);
    flex-shrink: 0;
    transition: color 120ms;
  }
  /* Date label: --text, 13pt/600 */
  #readout-date-label {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    line-height: 1;
    transition: color 120ms;
  }
  /* Trailing chevron — filled triangle, rotates 180° when picker open */
  .readout-chevron {
    display: inline-block;
    color: var(--muted);
    flex-shrink: 0;
    transition: color 120ms, transform 120ms;
  }
  #readout-date-btn:hover .readout-chevron,
  #readout-date-btn:focus-visible .readout-chevron {
    color: var(--text);
  }
  #readout-date-btn.active {
    border-color: rgba(255,175,133,0.35);
  }
  #readout-date-btn.active .date-cal-icon { color: var(--accent); }
  #readout-date-btn.active #readout-date-label { color: var(--accent); }
  #readout-date-btn.active .readout-chevron {
    color: var(--accent);
    transform: rotate(180deg);
  }

  /* Inline weather: [icon 18px] [temp 13pt/600/--text] · [wind 13pt/500/--muted] */
  #readout-meta-wx {
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    flex-shrink: 0;
    line-height: 1;
    transition: opacity 50ms;
  }
  #readout-meta-wx .wx-icon {
    font-size: 18px;
    line-height: 1;
    color: var(--muted);
  }
  #readout-meta-temp {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    min-width: 28px;
    font-variant-numeric: tabular-nums;
  }
  .wx-sep {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin: 0 1px;
  }
  #readout-meta-wind {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    white-space: nowrap;
    min-width: 52px;
    font-variant-numeric: tabular-nums;
  }
  #readout-meta-wind .wind-arrow {
    display: inline-block;
    width: 1.1em;
    text-align: center;
  }

  /* ── Row 2: time label (left, fixed width) + bar column (right, flex 1) ─ */
  #readout-row2 {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  /* Selected-time: 24pt/700/--accent, fixed ~64px, baseline-aligned with bar center */
  #readout-time {
    font-family: 'Inter', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.01em;
    line-height: 1;
    width: 64px;
    flex-shrink: 0;
    text-align: right;
  }
  /* Bar column: contains track + axis labels, fills remaining row width */
  #qc-bar-col {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  /* Track wrapper: overflow:hidden + border-radius clips canvas corners cleanly */
  #qc-arc-track {
    width: 100%;
    overflow: hidden;
    border-radius: 13px;
    flex-shrink: 0;
  }
  /* Canvas fills the track wrapper — no internal padding */
  #qc-arc {
    display: block;
    width: 100%;
    height: 38px; /* PAD_T(8) + TRACK_H(26) + thumb-clearance(4); within 36-40px spec */
    cursor: ew-resize;
    min-width: 0;
  }
  #qc-arc:active { cursor: grabbing; }
  /* ── Row 3: axis labels — 4px below slider, aligned with slider's left edge ─ */
  #qc-arc-labels {
    position: relative;
    height: 18px;
    margin-top: 4px;
    overflow: visible;
    flex-shrink: 0;
  }
  #qc-arc-labels span {
    position: absolute;
    transform: translateX(-50%);
    font: 600 11px/1 'Inter', sans-serif;
    white-space: nowrap;
    pointer-events: none;
  }

  /* ── List sun header: "X steder i solen" + sort toggle ───────────────── */
  #list-sun-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px 8px;
    flex-shrink: 0;
  }
  #list-sun-count {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    line-height: 1;
  }

  /* ── Calendar float — outside #panel, position: fixed so it escapes transforms ── */
  #ptb-cal-float {
    position: fixed;
    z-index: 830;
    display: none;
    /* desktop: flush with panel left edge, just above panel */
    left: 16px;
    width: 336px;
    top: 70px;   /* aligned with panel top; overridden on mobile */
    transition: left 0.28s ease;
  }
  #ptb-cal-float.open { display: block; }

  /* ── Mobile: calendar slides in from below the search bar ──────────────── */
  @media (max-width: 639px) {
    /* Override display:none with a transform-based show/hide so we can animate */
    #ptb-cal-float {
      display: block !important; /* always in layout; visibility via transform+opacity */
      left: 0;
      right: 0;
      width: auto;
      top: 0; /* extends from top of screen — covers behind search bar */
      bottom: auto;
      /* search bar slides away — pad by safe-area + small breathing room */
      padding: calc(env(safe-area-inset-top, var(--safe-area-top, 0px)) + 16px) 16px 20px;
      box-sizing: border-box;
      background: var(--glass-panel-bg);
      backdrop-filter: var(--glass-blur-panel);
      -webkit-backdrop-filter: var(--glass-blur-panel);
      border-radius: 0 0 14px 14px;
      border-bottom: var(--glass-border);
      box-shadow: var(--glass-inset), 0 6px 24px rgba(0, 0, 0, 0.50);
      transform: translateY(-110%);
      opacity: 0;
      pointer-events: none;
      transition: transform 220ms ease-out, opacity 180ms ease-out;
      z-index: 850;
    }
    #ptb-cal-float.open {
      display: block !important;
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    /* Slide search bar up/out when calendar picker opens (JS adds .cal-dimmed) */
    #floating-search.cal-dimmed {
      transform: translateY(calc(-100% - 24px));
      opacity: 0;
      pointer-events: none;
    }
    /* Inner panel: no extra animation on mobile — the outer float handles reveal */
    #ptb-cal-float #qc-panel {
      overflow: visible;
      max-height: none !important;
      margin-top: 0;
      transition: none;
    }
    #ptb-cal-float #qc-panel.open { max-height: none !important; }
    #ptb-cal-float #qc-panel-inner {
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      overflow: visible;
      opacity: 1 !important;
      pointer-events: auto !important;
    }
    #ptb-cal-float #qc-date-section {
      padding: 0;
      overflow: visible;
      height: auto !important; /* override JS _syncQcPanelHeight inline height */
    }
    /* 10-day grid: 5 columns × 2 rows — all days visible at once, no scroll */
    #ptb-cal-float #qc-cal .dc-grid:not(.dc-month-grid) {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(2, 88px);
      gap: 8px;
      overflow: visible;
    }
    #ptb-cal-float #qc-cal .dc-grid:not(.dc-month-grid) .dc-tile {
      height: 88px;
      justify-content: center;
      border-radius: 10px;
      gap: 4px;
      padding: 8px 4px 6px;
    }
    #ptb-cal-float #qc-cal .dc-grid:not(.dc-month-grid) .dc-day  { font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
    #ptb-cal-float #qc-cal .dc-grid:not(.dc-month-grid) .dc-num  { font-size: 20px; font-weight: 700; line-height: 1; }
    #ptb-cal-float #qc-cal .dc-grid:not(.dc-month-grid) .dc-icon { font-size: 18px; line-height: 1.2; }
    #ptb-cal-float #qc-cal .dc-grid:not(.dc-month-grid) .dc-temp { font-size: 11px; font-weight: 500; color: rgba(156,189,231,0.72); }
    /* Month-view full calendar on mobile */
    #ptb-cal-float #qc-cal .dc-cal-scroll { height: 55vh; }
    #ptb-cal-float #qc-cal .dc-month-grid .dc-tile:not(.solar-only) { height: 48px; }
    #ptb-cal-float #qc-cal .dc-month-grid .dc-tile.solar-only { min-height: 34px; }
  }

  #qc-presets {
    display: flex;
    gap: 2px;
    padding: 3px;
    background: rgba(156, 189, 231, 0.08);
    border: 1px solid rgba(156, 189, 231, 0.14);
    border-radius: 10px;
    position: relative;
  }
  .qc-preset-btn {
    flex: 1;
    background: rgba(20, 46, 82, 0.55);
    border: 1px solid rgba(156, 189, 231, 0.22);
    border-radius: 7px;
    color: rgba(156, 189, 231, 0.65);
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 5px 4px;
    cursor: pointer;
    transition: color 0.12s, background 0.12s, border-color 0.12s;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .qc-preset-btn:hover:not(.active) {
    color: rgba(156, 189, 231, 0.95);
    background: rgba(24, 52, 95, 0.8);
    border-color: rgba(255, 175, 133, 0.28);
  }
  .qc-preset-btn.active { background: var(--accent); color: #142E52; border-color: var(--accent); }

  /* Calendar section inside panel-time-bar */
  #qc-panel {
    overflow: hidden;
    max-height: 0;
    margin-top: 8px;
    transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #qc-panel.open {
    max-height: var(--qc-panel-h, 290px);
  }
  #qc-panel-inner {
    width: 100%;
    box-sizing: border-box;
    background: var(--glass-panel-bg);
    backdrop-filter: var(--glass-blur-panel);
    -webkit-backdrop-filter: var(--glass-blur-panel);
    border: var(--glass-border);
    border-radius: 12px;
    box-shadow: var(--glass-inset), 0 6px 24px rgba(0,0,0,0.50);
    overflow: hidden;
    opacity: 1;
    transition: opacity 0.25s ease;
  }
  #qc-panel:not(.open) #qc-panel-inner {
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
  }
  #qc-date-section { display: none; padding: 8px; box-sizing: border-box; width: 100%; overflow: hidden; }
  #qc-date-section.active { display: flex; flex-direction: column; }
  #qc-cal { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; box-sizing: border-box; overflow: clip; }
  #qc-panel.cal-expanded #qc-cal { overflow: clip; flex: 1; }
  #qc-cal .dc-cal-scroll {
    height: 260px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    /* Soft bottom fade hints at more content without eating into the last row of tiles. */
    mask-image: linear-gradient(to bottom, black 96%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, black 96%, transparent 100%);
  }
  #qc-cal .dc-cal-scroll::-webkit-scrollbar { display: none; }
  #qc-cal .dc-grid:not(.dc-month-grid) { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; gap: 3px; flex: 1; min-height: 0; width: 100%; box-sizing: border-box; }
  #qc-cal .dc-grid:not(.dc-month-grid) .dc-tile  { padding: 4px 2px; gap: 2px; }
  #qc-cal .dc-grid:not(.dc-month-grid) .dc-day   { font-size: 8px; }
  #qc-cal .dc-grid:not(.dc-month-grid) .dc-num   { font-size: 15px; }
  #qc-cal .dc-grid:not(.dc-month-grid) .dc-icon  { font-size: 17px; line-height: 1.1; }
  #qc-cal .dc-grid:not(.dc-month-grid) .dc-temp  { font-size: 12px; font-weight: 700; color: rgba(156,189,231,0.72); }
  /* Full-calendar month grid: 7 columns, 4px gap, 48px tiles */
  #qc-cal .dc-month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; width: 100%; box-sizing: border-box; }
  #qc-cal .dc-month-grid .dc-tile:not(.solar-only) { padding: 4px 2px; gap: 2px; height: 48px; justify-content: center; }
  #qc-cal .dc-month-grid .dc-tile.solar-only { padding: 0 2px; gap: 0; min-height: 34px; justify-content: center; }
  #qc-cal .dc-month-grid .dc-num  { font-size: 15px; font-weight: 600; }
  #qc-cal .dc-month-grid .dc-icon { font-size: 14px; line-height: 1.1; }
  /* Weekday row: 7 columns matching day grid, sticky at scroll-area top */
  #qc-cal .dc-weekday-row {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
    height: 24px; align-items: center;
    position: sticky; top: 0; z-index: 2;
    background: rgba(20,46,82,0.85);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(156,189,231,0.12);
    margin-bottom: 2px;
  }
  /* Month label: sticky just below weekday row, same backdrop */
  #qc-cal .dc-month-row-label {
    position: sticky; top: 26px; /* weekday row (24px) + bottom border (1px) + gap (1px) */
    z-index: 1;
    background: rgba(20,46,82,0.85);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 4px 2px;
  }

  /* Suppress venue card enter animation on map-pan re-renders */
  #venue-list[data-no-anim] .venue-card { animation: none !important; }

  /* Mobile overrides */
  @media (max-width: 639px) {
    #qc-wrap {
      left: 12px;
      right: 12px;
      top: 68px;
      width: auto;
    }
  }

  #detail-panel {
    position: absolute;
    top: 118px;
    left: 368px;   /* 16 + 336 + 16 */
    bottom: 16px;
    width: 300px;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 810;
    transform: translateX(-12px);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.26s ease, opacity 0.26s ease, left 0.28s ease;
    contain: layout;
  }
  #detail-panel.open {
    transform: translateX(0);
    opacity: 1;
    pointer-events: auto;
  }
  /* dp-content wraps the rendered content so dp-handle can sit above the scroll area */
  #dp-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  /* ── Venue photo gallery ────────────────────────────────────────────────── */
  .dp-photos {
    display: flex;
    gap: 3px;
    overflow-x: auto;
    scrollbar-width: none;
    margin: -14px -16px 14px;
    scroll-snap-type: x mandatory;
    border-radius: 10px 10px 0 0;
    overflow: hidden;         /* clip rounded corners */
    overflow-x: auto;         /* re-enable horizontal scroll */
    position: relative;
  }
  /* Bevel: soft gradient at the top of the photo section, blending into the panel glass */
  .dp-photos::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 22px;
    background: linear-gradient(to bottom, rgba(14,26,52,0.55), transparent);

    pointer-events: none;
  }
  .dp-photos::-webkit-scrollbar { display: none; }
  .dp-photo {
    width: 268px;
    height: 190px;
    object-fit: cover;
    flex-shrink: 0;
    scroll-snap-align: start;
    background: rgba(20,46,82,0.6);
  }
  .dp-photo:first-child:last-child {
    width: 100%; /* single photo fills full width */
  }

  #dp-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 14px 16px 24px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,175,133,0.2) transparent;
    contain: layout style;
  }
  #dp-scroll::-webkit-scrollbar { width: 4px; }
  #dp-scroll::-webkit-scrollbar-track { background: transparent; }
  #dp-scroll::-webkit-scrollbar-thumb { background: rgba(255,175,133,0.2); border-radius: 2px; }
  .dp-header-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
  }
  .dp-venue-name {
    font-family: 'Inter', sans-serif;
    font-style: normal;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    text-transform: none;
    color: #FFF2EB;
    line-height: 1.15;
    flex: 1;
    min-width: 0;
  }
  #dp-close-btn {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(156,189,231,0.1);
    border: 1px solid rgba(156,189,231,0.18);
    border-radius: 8px;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    margin-top: 2px;
    transition: background 0.12s, color 0.12s;
  }
  #dp-close-btn:hover { background: rgba(156,189,231,0.22); color: var(--text); }
  .dp-close-back { display: none; }  /* shown on mobile only */
  .dp-meta {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 10px;
    opacity: 0.8;
  }
  .dp-limited-solar {
    font-size: 11px;
    color: var(--muted);
    background: rgba(156,189,231,0.07);
    border: 1px solid rgba(156,189,231,0.15);
    border-radius: 8px;
    padding: 7px 10px;
    margin-bottom: 10px;
    opacity: 0.8;
  }
  .dp-dial-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    margin: 8px 0 14px;
  }
  .dp-dial-svg {
    width: 100%;
    height: auto;
    max-height: 200px;
    filter: drop-shadow(0 2px 24px rgba(255,175,133,0.18));
  }
  .dp-sun-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 20px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 700;

  }
  .dp-sun-pill.sunny    { background: rgba(255,175,133,0.88); color: #142E52; }
  .dp-sun-pill.overcast { background: rgba(165,170,178,0.18); color: rgba(165,170,178,0.9); border: 1px solid rgba(165,170,178,0.28); }
  .dp-sun-pill.rainy    { background: rgba(156,189,231,0.18); color: rgba(156,189,231,0.9); border: 1px solid rgba(156,189,231,0.28); }
  .dp-sun-pill.neutral  { background: rgba(255,175,133,0.12); color: var(--accent); border: 1px solid rgba(255,175,133,0.28); }
  .dp-sun-pill.muted    { background: rgba(156,189,231,0.15); color: var(--muted); border: 1px solid rgba(156,189,231,0.22); }
  /* Experience Index */
  .dp-exp-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 10px;
    margin-bottom: 4px;
  }
  .dp-exp-label { font-size: 14px; font-weight: 400; color: #FFF2EB; }
  .dp-exp-hint  { font-size: 12px; font-weight: 400; color: #9CBDE7; margin-top: 1px; }
  .dp-exp-val   { font-family: 'Inter', sans-serif; font-style: italic; font-size: 16px; font-weight: 600; color: #FFAF85; }
  .dp-dial-svg.dp-dial-locked circle:first-of-type { stroke: rgba(255,175,133,0.22); }
  .dp-exp-bar-wrap {

    margin-bottom: 8px;

    height: 100%;
    background: #FFAF85;
    border-radius: 1px;
  }

    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .dp-score-num {
    font-family: 'Inter', sans-serif;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;

  .dp-score-num span {

    font-family: 'Inter', sans-serif;

  .dp-score-num.tier-mid  { color: #7dd87d; }

  .dp-score-breakdown {

  .dp-section-label {
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;

    color: #9CBDE7;
    margin-bottom: 8px;

  .dp-divider {
    height: 1px;
    background: rgba(156,189,231,0.18);

  .dp-address {

    border-radius: 12px;
    box-shadow: var(--glass-inset);
    color: #FFAF85;

  .dp-actions {

  .dp-action-btn {
    flex: 1;
    font-size: 12px;
    font-weight: 500;
    padding: 7px 10px;

    border: var(--glass-border);

    margin-bottom: 14px;

    display: flex;
    gap: 8px;
    margin-bottom: 18px;

    font-size: 15px;

    border-radius: 14px;

    font-weight: 600;
    color: var(--text);
  }

  .info-label-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .info-value {
    color: var(--accent);
    font-size: 13px;
    font-weight: 500;
    text-align: right;
  }

  /* Footer buttons */
  .secondary-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    padding: 8px 0 0;
    margin-top: 12px;
  }

  .secondary-link {
    font-size: 13px;
    color: var(--muted);
    padding: 8px 14px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }

  .secondary-link:hover {
    background: rgba(20,46,82,0.35);
  }

  @media (max-width: 639px) {
    #detail-panel {
      position: fixed;  /* fixed avoids parent height issues; bottom:0 anchors to visual viewport */
      top: auto;
      left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 62svh;    /* svh = small viewport height; lowered from 69svh to make room for floating pill */
      max-height: none;
      border-radius: 20px 20px 0 0;
      border-left: none; border-right: none; border-bottom: none;
      transform: translateY(100%) translateZ(0);
      opacity: 1;
      z-index: 920;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), height 0.3s ease, border-radius 0.3s ease;
      will-change: transform, height;
      backface-visibility: hidden;
    }
    #detail-panel.open { transform: translateY(0); }
    #detail-panel.dp-fullscreen {
      height: 100svh;
      border-radius: 0;
    }
    #dp-handle { display: flex; }
    #dp-scroll { padding-top: 4px; }
    .dp-photos { margin-top: 0; }
    /* Back button style on mobile: chevron + "Venues" */
    #dp-close-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      background: rgba(156,189,231,0.1);
      border: 1px solid rgba(156,189,231,0.2);
      border-radius: 8px;
      padding: 5px 10px;
      width: auto;
      height: auto;
    }
    #dp-close-btn::before { content: '‹'; font-size: 16px; line-height: 1; }
    .dp-close-x    { display: none; }
    .dp-close-back { display: inline; }
    .dp-venue-name { font-size: 22px; }
    #dp-scroll { overflow-y: auto; }
  }

  /* ── Intro splash overlay ─────────────────────────────────────────────────── */
  #splash {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 9997;
    background: #FFDDCA;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    transition: background-color 0.5s ease;
    pointer-events: all;
    cursor: default;
  }
  #splash.bg-out {
    background-color: transparent;
    pointer-events: none;
  }
  #splash.done {
    pointer-events: none;
    visibility: hidden;
  }
  #splash-logo {
    width: 160px;
    height: auto;
    transition: opacity 0.4s ease;
  }
  #splash-logo.fade-out {
    opacity: 0;
  }
  #splash-loader {
    width: 28px;
    height: 28px;
    border: 2.5px solid rgba(255,175,133,0.3);
    border-top-color: #FFAF85;
    border-radius: 50%;
    animation: splash-spin 0.8s linear infinite;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #splash-loader.visible {
    opacity: 1;
  }
  #splash-loader.fade-out {
    opacity: 0;
  }
  @keyframes splash-spin {
    to { transform: rotate(360deg); }
  }

  /* Elements hidden during intro sequence */
  .intro-hidden {
    opacity: 0;
    pointer-events: none !important;
  }

  /* ── Sliding surfaces — will-change only on panels that translate ────────── */
  /* No will-change: backdrop-filter anywhere — it bloats GPU memory.          */
  #detail-panel, #ptb-cal-float { will-change: transform; }
  @media (max-width: 639px) {
    #panel { will-change: transform; }
  }

  /* ── Performance & accessibility — reduced transparency ─────────────────── */
  @media (prefers-reduced-transparency: reduce) {
    .glass-panel, .glass-card, .glass-action,
    #panel, #detail-panel, #qc-control-group, #search-dropdown,
    #profile-panel, #sort-panel, #hover-tooltip, #map-toast,
    #app-toast, .venue-card, .floating-card, .mapboxgl-popup-content,
    #qc-panel-inner, #edit-banner {
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      background: rgba(17, 30, 56, 0.97);
    }
  }

</style>
</head>
<body>
<div id="app">
  <!-- INTRO SPLASH — covers everything until geo + map are ready -->
  <div id="splash">
    <img src="design/logo-pack-svg/logo-color-2000w-big-text.svg" alt="Shades" id="splash-logo">
    <div id="splash-loader"></div>
  </div>

  <!-- MAP — full-screen -->
  <div id="map-container">
    <div id="map"></div>
    <canvas id="canvas-overlay" class="intro-hidden"></canvas>

    <!-- USER LOCATION DOT -->
    <div id="user-location-dot" style="display:none">
      <div class="loc-pulse"></div>
      <div class="loc-dot"></div>
    </div>

    <!-- HOVER TOOLTIP -->
    <div id="hover-tooltip"></div>

    <!-- EDIT FACING OVERLAY -->
    <div id="edit-overlay">
      <div id="edit-instruction">Click walls to add/remove · drag ● to set depth</div>
      <div id="edit-banner">
        <div id="edit-header-row">
          <div id="edit-title">Edit terrace</div>
          <div id="edit-venue-label">—</div>
        </div>
        <div id="edit-stats-row">
          <div class="edit-stat">
            <span class="edit-stat-label">Depth</span>
            <span class="edit-stat-value" id="edit-depth-display">—</span>
          </div>
          <div class="edit-stat">
            <span class="edit-stat-label">Direction</span>
            <span class="edit-stat-value" id="edit-direction-display">—</span>
          </div>
          <div id="edit-controls">
            <select id="edit-type-select" onchange="setTerraceType(this.value)" title="Terrace type">
              <option value="street">Street</option>
              <option value="rooftop">Rooftop</option>
              <option value="courtyard">Courtyard</option>
              <option value="detached">Detached</option>
            </select>
            <button id="edit-satellite-btn" onclick="toggleEditSatellite()" title="Toggle satellite view">
              🛰 Satellite
            </button>
          </div>
        </div>
        <button id="edit-action-btn" class="ghost" onclick="onEditActionBtn()">Looks good ✓</button>
      </div>
    </div>

    <!-- MAP TOAST -->
    <div id="map-toast"></div>

  </div>

  <!-- Top-left: search bar -->
  <div id="floating-search" class="floating-card intro-hidden">
    <span id="search-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="5.5"/><line x1="13" y1="13" x2="18" y2="18"/></svg></span>
    <input type="text" id="venue-search" placeholder="Søk etter steder eller områder…" autocomplete="off">
    <button id="search-clear-btn" type="button" aria-label="Clear search">✕</button>
    <button id="search-profile-btn" onclick="toggleProfilePanel(event)" title="Profil"></button>
  </div>

  <!-- Search dropdown — live results, anchored below search bar -->
  <div id="search-dropdown" class="glass-panel"></div>

  <!-- Profile popover — anchored below search bar -->
  <div id="profile-panel" class="glass-panel"></div>

  <!-- Zoom debug helper — centered below search bar -->
  <div id="zoom-debug" class="floating-card"></div>

  <!-- Bottom-right: locate-me button -->
  <button id="locate-btn" class="intro-hidden" onclick="locateUser()" title="Gå til min posisjon" aria-label="Gå til min posisjon">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="9" cy="9" r="3" stroke="currentColor" stroke-width="1.8"/>
      <path d="M9 1.5v4M9 12.5v4M1.5 9h4M12.5 9h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- Top-right: brand logo + sun compass -->
  <div id="floating-brand" class="intro-hidden">
    <div class="floating-card">
      <div id="brand-logo"><img src="design/logo-pack-svg/logo-color-2000w.svg" alt="Shades"></div>
      <canvas id="sun-compass" width="36" height="36"></canvas>
    </div>
  </div>

  <!-- Bottom-center: date pill + sun arc + intent presets (hidden — replaced by qc-bar) -->
  <div id="floating-bottom" style="display:none">
    <!-- Date navigation — separate pill above the arc card -->
    <div id="floating-date">
      <!-- Calendar dropdown (opens upward) -->
      <div id="date-calendar"></div>
      <div id="arc-date-nav">
        <button class="day-nav-btn" onclick="advanceDay(-1)">‹</button>
        <button id="date-display-btn" onclick="toggleDateCalendar()">—</button>
        <button class="day-nav-btn" onclick="advanceDay(1, 12)">›</button>
      </div>
      <!-- Current weather strip -->
      <div id="date-wx-strip" style="display:none"></div>
      <!-- Hidden native input — value source for all existing code -->
      <input type="date" id="date-picker" style="display:none">
    </div>
    <div class="floating-card">
      <!-- Sun arc canvas -->
      <div id="bottom-arc-row">
        <canvas id="sun-curve" onclick="handleSunCurveClick(event)"></canvas>
        <div id="wx-now"></div>
      </div>
      <!-- Row 3: time preset buttons aligned to arc -->
      <div id="time-presets-row">
        <div id="intent-pill"></div>
        <button class="intent-btn" data-intent="now"        onclick="setIntent('now')">Now</button>
        <button class="intent-btn" data-intent="lunch"      onclick="setIntent('lunch')">Lunch</button>
        <button class="intent-btn" data-intent="after-work" onclick="setIntent('after-work')">After work</button>
        <button class="intent-btn" data-intent="evening"    onclick="setIntent('evening')">Evening</button>
      </div>
      <!-- Hidden time input — keeps the rest of the app working unchanged -->
      <input type="range" id="time-from" min="4" max="23" step="0.25" value="10" style="display:none">
      <span id="time-display-from" style="display:none"></span>
      <div id="time-range-wrap" style="display:none">
        <div id="time-range-sun-bg"></div>
      </div>
      <button id="now-btn" onclick="toggleNowMode()" style="display:none">Now</button>
    </div>
  </div>

  <!-- Panel reveal button — shown when sidebar is hidden -->
  <button id="panel-reveal-btn" onclick="togglePanel()" title="Show sidebar">›</button>

  <!-- Toast notice (qc-wrap kept for qc-notice toasts) -->
  <div id="qc-wrap" class="intro-hidden">
    <div id="qc-notice"></div>
  </div>

  <!-- RIGHT DETAIL PANEL — opens when a venue is selected -->
  <div id="detail-panel" class="glass-panel">
    <div id="dp-handle" onclick="closeDetailPanel()">
      <div id="dp-handle-pill"></div>
    </div>
    <div id="dp-content"></div>
  </div>

  <!-- Calendar float — positioned above the panel, opened by the date button in panel-time-bar.
       Lives OUTSIDE #panel so it escapes the panel's transform context. -->
  <div id="ptb-cal-float" role="dialog" aria-modal="true" aria-label="Velg dato">
    <div id="qc-panel">
      <div id="qc-panel-inner">
        <div id="qc-date-section">
          <div id="qc-cal"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- LEFT PANEL — venue list, floats below search bar -->
  <div id="panel" class="intro-hidden glass-panel">
    <div id="panel-handle">
      <div id="panel-handle-pill"></div>
    </div>

    <!-- Time bar: unified control group (compact 3-row docked surface) -->
    <div id="panel-time-bar">
      <div id="qc-control-group" class="glass-panel">
        <div id="time-readout">
          <!-- Row 1: calendar button (left) + inline weather (right) -->
          <div id="readout-row1">
            <button id="readout-date-btn" onclick="toggleQcPanel('date')" aria-label="Change date" aria-expanded="false">
              <svg class="date-cal-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <rect x="1.5" y="3" width="13" height="11.5" rx="2" stroke="currentColor" stroke-width="1.5"/>
                <line x1="1.5" y1="6.5" x2="14.5" y2="6.5" stroke="currentColor" stroke-width="1.5"/>
                <line x1="5" y1="1.5" x2="5" y2="4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="11" y1="1.5" x2="11" y2="4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              <span id="readout-date-label">—</span>
              <svg class="readout-chevron" width="10" height="6" viewBox="0 0 10 6" fill="currentColor" aria-hidden="true">
                <path d="M0 0 L10 0 L5 6 Z"/>
              </svg>
            </button>
            <span id="readout-meta-wx">
              <span class="wx-icon"></span>
              <span id="readout-meta-temp"></span>
              <span class="wx-sep">·</span>
              <span id="readout-meta-wind"></span>
            </span>
          </div>
          <!-- Row 2: selected-time label (left, accent, fixed width) + slider (right) -->
          <div id="readout-row2">
            <span id="readout-time">—</span>
            <div id="qc-bar-col">
              <div id="qc-arc-track">
                <canvas id="qc-arc"></canvas>
              </div>
              <!-- Row 3: axis labels — outside overflow:hidden track, aligned with slider -->
              <div id="qc-arc-labels" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Sun count header: visible in peek, owns "X steder i solen" exactly once -->
    <div id="list-sun-header">
      <span id="list-sun-count"></span>
      <button id="sort-toggle-btn" onclick="toggleSortPanel()"><span id="sort-label">Sol nå</span><span class="sort-chevron"> ▾</span></button>
    </div>

    <!-- Venue peek: first card preview visible in collapsed state -->
    <div id="venue-peek"></div>

    <div id="panel-header">
      <!-- Venue count title + toggle button (desktop only) -->
      <div id="venue-header">
        <span id="venue-count">—</span>
        <button id="panel-toggle-icon" onclick="togglePanel()" title="Hide sidebar">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>
      </div>
    </div>
    <div id="venue-list"></div>
  </div>

  <!-- Sort panel: fixed overlay, positioned by JS from button origin -->
  <div id="sort-panel" class="glass-panel">
    <button class="sort-btn active" data-sort="score"    onclick="setSortBy('score')">⭐ Score</button>
    <button class="sort-btn"        data-sort="rating"   onclick="setSortBy('rating')">★ Rating</button>
    <button class="sort-btn"        data-sort="distance" onclick="setSortBy('distance')">⊙ Near</button>
  </div>

  <!-- Floating time slider (round 12) — outside #panel, tracks panel top edge -->
  <div id="fts" class="intro-hidden">
    <button id="fts-date-btn" onclick="toggleQcPanel('date')" aria-label="Velg dato">
      <svg class="fts-cal-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <rect x="1.5" y="3" width="13" height="11.5" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <line x1="1.5" y1="6.5" x2="14.5" y2="6.5" stroke="currentColor" stroke-width="1.5"/>
        <line x1="5" y1="1.5" x2="5" y2="4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="11" y1="1.5" x2="11" y2="4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span id="fts-date-label"></span>
      <svg class="fts-chevron" width="10" height="6" viewBox="0 0 10 6" fill="currentColor"><path d="M0 0 L10 0 L5 6 Z"/></svg>
    </button>
    <div id="fts-track">
      <canvas id="fts-canvas"></canvas>
    </div>
    <div id="fts-popup">
      <div class="fts-popup-row fts-popup-primary">
        <span id="fts-popup-time"></span>
        <span id="fts-popup-wx-icon"></span>
      </div>
      <div class="fts-popup-row fts-popup-secondary">
        <span id="fts-popup-temp"></span>
        <span class="fts-dot">·</span>
        <span id="fts-popup-wind"></span>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.js"></script>
<script src="js/i18n.js"></script>
<script src="js/config.js?v=20260411b"></script>
<script src="js/auth.js"></script>
<script src="js/places.js?v=20260411b"></script>
<script src="js/busyness.js?v=20260411b"></script>
<script src="js/solar.js?v=20260411b"></script>
<script src="js/data.js?v=20260411b"></script>
<script src="js/weather.js?v=20260411b"></script>
<script src="js/scoring.js?v=20260411b"></script>
<script src="js/map-style.js?v=20260418b"></script>
<script src="js/app.js?v=20260423r"></script>
<script src="js/render-helpers.js?v=20260411b"></script>
<script src="js/render-arc.js?v=20260411b"></script>
<script src="js/render-seating.js?v=20260411b"></script>
<script src="js/render-editor.js?v=20260417a"></script>
<script src="js/render-pins.js?v=20260417a"></script>
<script src="js/ui-shared.js?v=20260411b"></script>
<script src="js/ui-list.js?v=20260411b"></script>
<script src="js/ui-shelter.js?v=20260416a"></script>
<script src="js/render-wind.js?v=20260416b"></script>
<script src="js/ui-detail.js?v=20260411b"></script>
<script src="js/osm.js?v=20260411b"></script>
<script>
if (USE_FLOATING_TIME_SLIDER) document.body.classList.add('fts');

loadVenues().then(() => {
  updateRangeFill();
  update();
  if (USE_FLOATING_TIME_SLIDER) initFts();
  initFacings();
  const _wxLats = VENUES.map(v => v.lat), _wxLngs = VENUES.map(v => v.lng);
  const _wxLat  = (Math.min(..._wxLats) + Math.max(..._wxLats)) / 2;
  const _wxLng  = (Math.min(..._wxLngs) + Math.max(..._wxLngs)) / 2;
  initWeather(_wxLat, _wxLng); // fetch MET Norway forecast (async, re-renders when data arrives)
  initNoiseLevels(); // fetch Geonorge official road noise zones (async, cached 30 days)
  initPlaces();      // fetch Google Places photos (async, cached 7 days)
  loadApprovedSuggestions(); // merge admin-approved user submissions into VENUES
  // Apply i18n to search placeholder on load
  const inp = document.getElementById('venue-search');
  if (inp) inp.placeholder = t('search_placeholder');
}).catch(e => {
  console.error('loadVenues chain error:', e);
  // Ensure intro proceeds even if initialization throws
  if (!_introGeoReady) {
    _introGeoReady = true;
    _introCheckReady();
  }
});
</script>
</body>
</html>
