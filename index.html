<script>
  // Invite-loading gate: when the URL is an invite link (/i/<token>, /s/<id>,
  // or #invite/<token>), hide the map's first paint so the receiver doesn't
  // see the Oslo fallback flash before openPlanPreview runs its jumpTo onto
  // the venue. Removed by ui-plan-preview after the camera lands.
  (function () {
    var p = location.pathname;
    var h = location.hash || '';
    if (p.indexOf('/i/') === 0 || p.indexOf('/s/') === 0 || h.indexOf('#invite/') === 0) {
      document.documentElement.classList.add('invite-loading');
    }
  })();
</script>
<script>
  // ── Viewport tracker — single source of truth for visible height ─────────
  // Exposes --app-h (CSS variable) = the visible viewport height in px.
  // Why we need this:
  //   - 100vh is broken on iOS Safari (includes URL bar)
  //   - 100dvh is unreliable on PWA cold-start (the home-indicator zone
  //     isn't always accounted for at first paint)
  //   - 100svh is "the small viewport" but doesn't update when the URL
  //     bar collapses/expands
  //   - window.innerHeight is wrong on iOS when the keyboard is up
  // window.visualViewport.height is the only measurement that reflects
  // the actually-visible area across iOS Safari, iOS Chrome WebView PWA,
  // Android Chrome PWA, and desktop. Use var(--app-h, 100svh) in CSS;
  // the 100svh fallback applies if JS hasn't set it yet.
  //
  // Probe pattern: set immediately, again on visualViewport/window
  // resize + orientationchange, AND after short delays — iOS PWA cold-
  // starts report stale values until the WebView's chrome-area
  // measurements settle.
  (function () {
    var html = document.documentElement;
    function set() {
      var vvh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
      var ih  = window.innerHeight || vvh;
      if (vvh && vvh > 0) html.style.setProperty('--app-h', vvh + 'px');
      // --app-bottom-inset: the gap between the layout viewport (window
      // innerHeight) and the visual viewport (visualViewport.height).
      // On iOS PWA standalone this is the home-indicator gesture zone +
      // anything else iOS reserves. position: fixed elements with
      // bottom: 0 anchor to the layout viewport, which puts them BELOW
      // the visible area on iOS PWA. Using bottom: var(--app-bottom-
      // inset) pulls them up to the visual viewport bottom — fully
      // visible, no clipping behind the home indicator. Safari + Chrome
      // browser: gap is 0 → no offset. Android PWA: gap is 0 → no offset.
      var gap = Math.max(0, ih - vvh);
      html.style.setProperty('--app-bottom-inset', gap + 'px');
    }
    set();
    window.addEventListener('resize', set, { passive: true });
    window.addEventListener('orientationchange', set, { passive: true });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', set, { passive: true });
      window.visualViewport.addEventListener('scroll', set, { passive: true });
    }
    // Cold-start probes — iOS PWAs commonly report visualViewport.height
    // a few px short on the first tick. Re-probing after layout settles
    // gives the correct value without making the user wait.
    [60, 180, 500, 1200].forEach(function (d) { setTimeout(set, d); });
  })();
</script>

    /* ────────────────────────────────────────────────────────────────────
       VIEWPORT + SAFE-AREA TOKENS — read this before adding any panel
       ────────────────────────────────────────────────────────────────────
       Standards-based (2026) cross-host adaptation. The runtime no longer
       needs custom JS to figure out the visible viewport — modern CSS
       primitives handle every host correctly. The contract:

         1. <meta viewport> declares `viewport-fit=cover` (unlocks
            env(safe-area-inset-*) on iOS) and `interactive-widget=
            resizes-content` (Android keyboard now shrinks the layout
            viewport — same as iOS — so svh/dvh/% all reflect it).
         2. Bottom-anchored sheets use `bottom: 0` + `max-height: Xsvh`
            (small viewport, never clipped by chrome) + `padding-bottom:
            var(--app-pad-b)`.
         3. `--app-pad-b` collapses while a form field is focused — see
            the :has(:focus-visible) rule below — so the sheet hugs the
            keyboard instead of leaving a stale safe-area gap above it.

       --app-pad-b — `max(env(safe-area-inset-bottom), 12px)`.
                     iOS PWA: env() ≈ 34px (home indicator). Android
                     Chrome 135+ PWA: env() ≈ 24–48px (gesture chin —
                     edge-to-edge migration now reports it). Older
                     Android / desktop: env() = 0, falls back to 12px.
                     This single signal is correct on every host — no
                     more JS-tracked --app-bottom-inset hack required.

       --app-h      — visualViewport.height in px (JS-tracked, 100svh
                     fallback). Retained for legacy panel rules and the
                     few JS measurements that need exact pixel math.
                     New code should prefer `svh` directly. See JS
                     viewport tracker block in <head>.

       Drag-to-dismiss math (NOT layout) still uses window.visualViewport
       in JS — that API is the only way to read pinch-zoom + keyboard
       offsets for gesture handlers. Layout no longer needs it.
    */
    --app-pad-b: max(env(safe-area-inset-bottom, 0px), 12px);
  }
  /* Keyboard-open override — when a form field is focused, env(safe-
     area-inset-bottom) doesn't change but the keyboard now overlaps the
     home-indicator zone. The 34px (iOS) or ~30px (Android) inset becomes
     dead space ABOVE the keyboard, leaving the sheet floating mid-screen.
     Collapse to 8px so the sheet hugs the keyboard. (Webventures 2025
     pattern, https://webventures.rejh.nl/blog/2025/safe-area-inset-
     bottom-does-not-update/) */
  :root:has(:is(input, textarea, [contenteditable]):focus-visible) {
    --app-pad-b: 8px;
  }

  /* ── Accessibility globals ────────────────────────────────────────────────── */
  :focus-visible {
    outline: 2px solid var(--accent) !important;
    outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
  /* Hit-area extensions: visuals stay 32–34 px, tap region reaches ~44 pt */
  #search-clear-btn, #search-profile-btn { position: relative; }
  #locate-btn::before {
    content: ''; position: absolute; inset: -5px;
  }
  /* Search-bar buttons: fill the full 46 px card vertically; horizontal kept
     small so adjacent pseudo-elements don't collide across the 8 px gap */
  #search-clear-btn::before,
  #search-profile-btn::before {
    content: ''; position: absolute; inset: -7px -3px;
  }
  body.fts #fts-date-btn::before {
    content: ''; position: absolute; inset: -5px;
  }

  html, body {
    /* Robust viewport height across iOS Safari, iOS Chrome PWA,
       Android Chrome, and desktop. --app-h is set from JS using
       window.visualViewport.height (see _initViewportTracker in
       app.js) — the only measurement that always equals the visible
       area on every engine. 100svh is the fallback if JS hasn't run
       yet. Don't switch to 100dvh / 100lvh / 100% — each one breaks
       at least one platform. */
    height: var(--app-h, 100svh);
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden;
  }

  @supports not (backdrop-filter: blur(1px)) {
    .glass-panel, .glass-card, .glass-action { background: rgba(17, 30, 56, 0.97) !important; }
  }

  /* ── Shades Glass — canonical class definitions ──────────────────────────── */
  /* Apply these three classes (or the tokens below) to every glass surface.    */
  /* Panels carry a ::before spec-highlight at the top edge; cards/actions skip */
  /* it (too much shine at small sizes).                                         */
  .glass-panel {
    background: var(--glass-panel-bg);
    backdrop-filter: var(--glass-blur-panel);
    -webkit-backdrop-filter: var(--glass-blur-panel);
    border: var(--glass-border);
    box-shadow:
      var(--glass-inset),
      0 6px 24px rgba(0,0,0,0.50);
    position: relative;
  }
  .glass-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 8%; right: 8%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,242,235,0.35), transparent);
    pointer-events: none;
    z-index: 1;
  }
  .glass-card {
    background: var(--glass-card-bg);
    backdrop-filter: var(--glass-blur-card);
    -webkit-backdrop-filter: var(--glass-blur-card);
    border: var(--glass-border);
    box-shadow:
      var(--glass-inset),
      0 2px 8px rgba(0,0,0,0.35);
    position: relative;
  }
  .glass-action {
    background: var(--glass-action-bg);
    backdrop-filter: var(--glass-blur-action);
    -webkit-backdrop-filter: var(--glass-blur-action);
    border: var(--glass-border);
    box-shadow:
      var(--glass-inset),
      0 2px 8px rgba(0,0,0,0.35);
    position: relative;
  }

  /* ── Lens FX (experimental, gated by ?fx=...) ──────────────────────────────
     Activates when js/lens-effects.js sets body[data-fx="..."]. Modes:
       fx=1   — polarized panel + clean card (preset)
       fx=2   — vignette panel + polarized card (preset)
       fx=lab — interactive lab: floating control panel lets the user pick
                panel + card static effect combinations live on the real app.
     Motion stack (tilt + spotlight + rim + click hint) is shared across all
     modes. All effects no-op when the flag is absent. */

  /* The panel and card static effects are driven by CSS variables set by JS.
     Each effect (polarized, vignette, mirror-sky, etc.) is just a gradient
     value; JS swaps the value to swap the effect.

     Applied to all Tier-1 lens panels — list panel, detail panel, search
     dropdown, sort/profile/filter panels, login splash, modals. */
  body[data-fx] #panel::after,
  body[data-fx] #detail-panel::after,
  body[data-fx] #search-dropdown::after,
  body[data-fx] #sort-panel::after,
  body[data-fx] #profile-panel::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    z-index: 0;
    background: var(--panel-fx-bg, transparent);
    mix-blend-mode: var(--panel-fx-blend, normal);
  }
  /* Card lens overlay applied only in fx mode. The lens shimmer (chromatic /
     polarized / mirror-soft) is layered ABOVE the slate base so it remains
     visible even with cards at near-opaque baseline. Applied to Tier-2
     lens objects: list cards, detail-panel content cards, action cards. */
  body[data-fx] .venue-card,
  body[data-fx] .dp-card,
  body[data-fx] .dp-action-card,
  body[data-fx] .dpacc-action-card {
    background:
      var(--card-fx-bg, transparent),
      linear-gradient(135deg, rgba(26,44,66,0.36) 0%, rgba(58,92,130,0.22) 100%),
      rgba(26,44,66,0.78);
  }
  /* Primary action card keeps its solid honey accent even under the
     Lens-FX body treatment — the rule above otherwise clobbered the
     'one Primary per screen' signal on the post-accept carousel. */
  body[data-fx] .dpacc-action-card.dpacc-action-primary {
    background: var(--accent);
  }
  /* Make sure panel content sits above the panel overlay */
  body[data-fx] #panel > *,
  body[data-fx] #detail-panel > *,
  body[data-fx] #search-dropdown > *,
  body[data-fx] #sort-panel > *,
  body[data-fx] #profile-panel > * { position: relative; z-index: 1; }

  /* Tilt: card-level transform with spring easing. JS sets the transform
     during pointermove; the .lens-fx-tilting class swaps in a fast linear
     transition while engaged so the card responds 1:1 to the cursor. */
  body[data-fx] .venue-card {
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                border-color 0.12s ease-out, background 0.12s ease-out, opacity 0.2s;
    will-change: transform;
  }
  /* Card content above the spotlight + rim pseudos so text isn't washed out
     by mix-blend-mode: screen. */
  body[data-fx] .venue-card > * {
    position: relative;
    z-index: 3;
  }
  body[data-fx] .venue-card.lens-fx-tilting {
    transition: transform 0.05s linear,
                border-color 0.12s ease-out, background 0.12s ease-out, opacity 0.2s;
  }

  /* Spotlight: cursor-tracked radial highlight on hover */
  body[data-fx] .venue-card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: radial-gradient(circle 200px at var(--mx, 50%) var(--my, 50%),
                rgba(255,255,255,0.20), transparent 60%);
    opacity: 0;
    transition: opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    mix-blend-mode: screen;
    z-index: 2;
  }
  @media (hover: hover) and (pointer: fine) {
    body[data-fx] .venue-card:hover::after { opacity: 1; }
  }

  /* Rim light: frame edges brighten on the side facing the tilt direction.
     Driven by --rim-{top,bottom,left,right} 0..1 values set by JS from tilt. */
  body[data-fx] .venue-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    z-index: 2;
    box-shadow:
      inset 0  1.5px 0 rgba(255,250,235, calc(0.50 * var(--rim-top, 0))),
      inset 0 -1.5px 0 rgba(255,250,235, calc(0.50 * var(--rim-bottom, 0))),
      inset  1.5px 0 0 rgba(255,250,235, calc(0.40 * var(--rim-left, 0))),
      inset -1.5px 0 0 rgba(255,250,235, calc(0.40 * var(--rim-right, 0)));
    transition: box-shadow 0.15s linear;
  }

  /* Click ripple → border flash (spotlight pseudo is taken). */
  body[data-fx] .venue-card.lens-fx-rippling {
    animation: lens-fx-click-hint 0.45s ease-out;
  }
  @keyframes lens-fx-click-hint {
    0%   { border-color: rgba(255,250,235,0.85); }
    100% { border-color: var(--border, rgba(156,189,231,0.18)); }
  }

  /* Reduced motion: keep static panel overlays, drop motion. */
  @media (prefers-reduced-motion: reduce) {
    body[data-fx] .venue-card { transform: none !important; transition: none; }
    body[data-fx] .venue-card::after,
    body[data-fx] .venue-card::before { display: none; }
  }

  /* ── Lens FX Lab — floating control panel (only on ?fx=lab) ────────────── */
  .lens-fx-lab {
    position: fixed;
    right: 16px;
    top: 80px;
    z-index: 99999;
    isolation: isolate;
    pointer-events: auto;
    background: linear-gradient(135deg, rgba(20,46,82,0.85), rgba(32,73,131,0.70)), rgba(20,46,82,0.92);
    backdrop-filter: blur(16px) saturate(180%);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    border: 1px solid rgba(156,189,231,0.30);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-glass-lg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    user-select: none;
    transition: width 0.3s var(--ease-emphasized), height 0.3s var(--ease-emphasized);
  }
  .lens-fx-lab * { pointer-events: auto; }
  .lens-fx-lab.collapsed { width: 52px; height: 52px; overflow: hidden; }
  .lens-fx-lab.expanded  { width: 280px; }
  .lens-fx-lab-toggle {
    width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-weight: 800; font-size: 12px; letter-spacing: 0.08em;
    color: var(--accent);
    flex-shrink: 0;
  }
  .lens-fx-lab.collapsed .lens-fx-lab-toggle { width: 100%; }
  .lens-fx-lab-body {
    padding: 4px 16px 16px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease-out, visibility 0s linear 0.2s;
  }
  .lens-fx-lab.expanded .lens-fx-lab-body {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.2s ease-out;
  }
  .lens-fx-lab-row { margin-top: 12px; }
  .lens-fx-lab-label {
    font-size: 10px; font-weight: 800; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .lens-fx-lab-options {
    display: flex; flex-wrap: wrap; gap: 4px;
  }
  .lens-fx-lab-options button {
    font-family: inherit;
    font-size: 11px; font-weight: 600;
    padding: 5px 10px;
    border-radius: 999px;
    background: rgba(20,46,82,0.45);
    border: 1px solid rgba(156,189,231,0.22);
    color: var(--cloud, #B5BCC8);
    cursor: pointer;
    pointer-events: auto;
    user-select: none;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .lens-fx-lab-options button:hover {
    color: var(--text);
    border-color: rgba(156,189,231,0.40);
  }
  .lens-fx-lab-options button.active {
    background: rgba(245,194,94,0.16);
    border-color: rgba(245,194,94,0.46);
    color: var(--accent);
  }
  .lens-fx-lab-hint {
    font-size: 10.5px; color: var(--muted); margin-top: 12px;
    line-height: 1.4; font-style: italic;
  }
  .lens-fx-lab-hint code {
    font-family: 'Menlo', ui-monospace, monospace;
    font-size: 10px;
    color: var(--accent-light, var(--accent));
    background: rgba(0,0,0,0.30);
    padding: 1px 5px;
    border-radius: 3px;
  }

  /* ── Button system — Solsteder primitives. ONE Primary per screen. ─────────
     Compose with .glass-action / .glass-card surfaces (defined above). */

  /* PRIMARY · Pill — solid accent, ONE per screen */
  .p-pill {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    height: 44px; padding: 0 20px; border-radius: 999px;
    font-size: 14px; font-weight: 700; font-family: 'Inter', sans-serif;
    border: none; cursor: pointer; white-space: nowrap;
    background: var(--accent); color: var(--accent-on);
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    transition: background 120ms ease-out, box-shadow 120ms ease-out, transform 60ms ease-out;
  }
  .p-pill:hover:not([disabled]) { background: var(--accent-hover); box-shadow: 0 6px 24px rgba(0,0,0,0.50); }
  .p-pill:active:not([disabled]) { background: var(--accent-active); transform: translateY(1px); box-shadow: none; }
  .p-pill[disabled] { background: rgba(255,175,133,0.28); color: rgba(42,26,12,0.40); cursor: not-allowed; }

  /* SECONDARY · Pill — uses existing --glass-action-bg / --glass-border. */
  .s-pill {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 44px; padding: 0 18px; border-radius: 999px;
    font-size: 14px; font-weight: 600; font-family: 'Inter', sans-serif;
    cursor: pointer; white-space: nowrap;
    background: var(--glass-action-bg);
    border: var(--glass-border);
    box-shadow: var(--glass-inset), 0 2px 8px rgba(0,0,0,0.35);
    color: var(--text);
    transition: border-color 120ms ease-out, color 120ms ease-out;
  }
  .s-pill .ico { color: var(--muted); }
  .s-pill:hover { border-color: rgba(156,189,231,0.32); }
  .s-pill.is-selected { background: var(--accent-dim); border-color: rgba(255,175,133,0.35); color: var(--accent); }
  .s-pill.is-selected .ico { color: var(--accent); }

  /* SECONDARY · Rounded */
  .s-rnd {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 36px; padding: 0 14px; border-radius: 16px;
    font-size: 13px; font-weight: 600; font-family: 'Inter', sans-serif;
    cursor: pointer; white-space: nowrap;
    background: var(--glass-action-bg);
    border: var(--glass-border);
    box-shadow: var(--glass-inset), 0 2px 8px rgba(0,0,0,0.35);
    color: var(--text);
    transition: border-color 120ms ease-out, color 120ms ease-out;
  }
  .s-rnd .ico { color: var(--muted); }
  .s-rnd:hover { border-color: rgba(156,189,231,0.32); }
  .s-rnd.is-selected { background: var(--accent-dim); border-color: rgba(255,175,133,0.35); color: var(--accent); }
  .s-rnd.is-selected .ico { color: var(--accent); }

  /* GHOST · Rounded */
  .g-rnd {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 36px; padding: 0 14px; border-radius: 16px;
    font-size: 13px; font-weight: 600; font-family: 'Inter', sans-serif;
    background: transparent; cursor: pointer; white-space: nowrap;
    border: 1px solid rgba(156,189,231,0.28); color: var(--muted);
    transition: border-color 120ms ease-out, color 120ms ease-out, background 120ms ease-out;
  }
  .g-rnd:hover { border-color: rgba(156,189,231,0.45); color: var(--text); background: rgba(20,46,82,0.18); }

  /* SQUARE · 48×48 r12 — companion icon button */
  .sq {
    display: inline-flex; align-items: center; justify-content: center;
    width: 48px; height: 48px; border-radius: 12px;
    border: none; cursor: pointer;
    transition: background 120ms ease-out, color 120ms ease-out, border-color 120ms ease-out;
  }
  .s-sq {
    background: var(--glass-action-bg);
    border: var(--glass-border);
    box-shadow: var(--glass-inset), 0 2px 8px rgba(0,0,0,0.35);
    color: var(--muted);
  }
  .s-sq:hover { color: var(--text); border-color: rgba(156,189,231,0.32); }
  .p-sq {
    background: var(--accent); color: var(--accent-on); box-shadow: 0 2px 8px rgba(0,0,0,0.35);
  }
  .p-sq:hover { background: var(--accent-hover); }

  /* CIRCLE · 44 — icon-only */
  .s-circ {
    display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--glass-action-bg);
    border: var(--glass-border);
    box-shadow: var(--glass-inset), 0 2px 8px rgba(0,0,0,0.35);
    color: var(--muted); cursor: pointer;
    transition: color 120ms ease-out, border-color 120ms ease-out;
  }
  .s-circ:hover { color: var(--text); border-color: rgba(156,189,231,0.32); }
  .s-circ[hidden] { display: none; }

  /* Chip pill — group / time selectors */
  .chip-pill {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 32px; padding: 0 12px; border-radius: 999px;
    font-size: 13px; font-weight: 600; font-family: 'Inter', sans-serif;
    background: var(--glass-action-bg);
    border: var(--glass-border);
    box-shadow: var(--glass-inset), 0 2px 8px rgba(0,0,0,0.35);
    color: var(--text);
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
    transition: border-color 120ms ease-out, color 120ms ease-out;
  }
  .chip-pill .count { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11px; }
  .chip-pill:hover { border-color: rgba(156,189,231,0.32); }
  .chip-pill.is-selected { background: var(--accent-dim); border-color: rgba(255,175,133,0.35); color: var(--accent); }
  .chip-pill.is-selected .count { color: rgba(255,175,133,0.7); }

  /* ── Universal pressed-state polish ───────────────────────────────────────
     The button audit found most secondary primitives had hover states but
     no :active — tapping them on mobile felt unresponsive. Adding a
     unified scale(0.97) + faint background tint for press feedback. The
     transform transition is added to each primitive's existing transition
     list so the press → release motion stays smooth.
     .p-pill / .p-sq already have proper pressed states (translateY + bg
     darken), so they're excluded. Buttons with stronger semantics
     (Accept / Decline below) keep their own state stack. */
  .s-pill, .s-rnd, .g-rnd, .chip-pill, .s-circ, .s-sq {
    transition: border-color 120ms ease-out, color 120ms ease-out,
                background 120ms ease-out, transform 90ms ease-out;
  }
  .s-pill:active, .s-rnd:active, .g-rnd:active,
  .chip-pill:active, .s-circ:active, .s-sq:active {
    transform: scale(0.97);
  }
  .p-sq:active { background: var(--accent-active); transform: translateY(1px); box-shadow: none; }

  /* Accept / Decline plan-invite responses — v1 had zero hover or active
     feedback, so they read like static text rather than interactive
     buttons. Adding both states and a transition stack. */
  .btn-accept {
    transition: background 120ms ease-out, box-shadow 120ms ease-out, transform 90ms ease-out;
  }
  .btn-accept:hover {
    background: rgba(255,175,133,0.22);
    box-shadow: 0 2px 8px rgba(0,0,0,0.28);
  }
  .btn-accept:active {
    background: rgba(255,175,133,0.32);
    transform: scale(0.97);
    box-shadow: none;
  }
  .btn-decline {
    transition: background 120ms ease-out, border-color 120ms ease-out, color 120ms ease-out, transform 90ms ease-out;
  }
  .btn-decline:hover {
    background: rgba(20,46,82,0.45);
    border-color: rgba(156,189,231,0.45);
    color: var(--text);
  }
  .btn-decline:active {
    transform: scale(0.97);
  }

  /* Toggle switch — v1 had no hover feedback, leaving the control
     feeling dead until tapped. A subtle border lift on hover signals
     interactivity without competing with the actual on/off state. */
  .toggle-switch:hover { border-color: rgba(156,189,231,0.45); }
  .toggle-switch.is-on:hover { border-color: rgba(255,175,133,0.85); }
  .toggle-switch:active::after { transform: translateY(-50%) scale(1.15); }

  /* Card surface — thin alias of .glass-card + 12px radius for content
     blocks inside panels. */
  .card {
    background: var(--glass-card-bg);
    backdrop-filter: var(--glass-blur-card);
    -webkit-backdrop-filter: var(--glass-blur-card);
    border: var(--glass-border);
    border-radius: 12px;
    box-shadow: var(--glass-inset), 0 2px 8px rgba(0,0,0,0.35);
  }

  /* Hide horizontal scrollbars in carousels */
  .no-scrollbar { scrollbar-width: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }

  #app {
    position: relative;
    height: var(--app-h, 100svh);
    overflow: hidden;
  }

  /* MAP — fills the entire viewport, sits behind all floating UI */
  #map-container {
    /* fixed so it's positioned to the layout viewport rather than the
       containing block — on iOS Chrome PWA, the body can end above
       the bottom system reservation and an absolute-inset-0 child
       inherits that ceiling. fixed escapes it. */
    position: fixed;
    inset: 0;
  }

  #map {
    width: 100%;
    height: 100%;
  }

  /* Invite-loading gate (set in head): hides the map AND the canvas overlay
     (pins) so the receiver doesn't see either the Oslo-fallback flash before
     the takeover's jumpTo OR the orange pins drawn against an empty dark
     background while Mapbox tiles for the dive view are still loading.
     Removed in JS once the map fires 'idle' (tiles rendered for the current
     view) — see ui-plan-preview.js openPlanPreview. */
  html.invite-loading #map,
  html.invite-loading #canvas-overlay {
    visibility: hidden;
  }

  #canvas-overlay {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 690;
    /* No will-change here. iOS Safari GPU-rasterizes a will-change layer
       at screen DPI rather than the canvas's full DPR, which blurs every
       pixel of pin text + venue-name halos that we drew at 2× / 3×. The
       canvas is never actually transformed, so the hint was buying a
       blur for no benefit. */
    touch-action: none; /* prevent browser-level pinch-zoom; Mapbox handles gestures */
  }

  /* ── User location dot ────────────────────────────────────────────────────── */
  #user-location-dot {
    position: absolute;
    pointer-events: none;
    z-index: 685;               /* below canvas-overlay (690): venue pins draw on top */
    width: 14px;
    height: 14px;
    transform: translate(-50%, -50%);
  }
  .loc-pulse {
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 1.5px solid rgba(74,144,226,0.55);
    animation: loc-pulse 2.4s ease-out infinite;
  }
  .loc-dot {
    position: relative;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #4A90E2;
    border: 2.5px solid rgba(255,255,255,0.95);
    box-shadow: 0 1px 5px rgba(0,0,0,0.4), 0 0 10px rgba(74,144,226,0.45);
  }
  @keyframes loc-pulse {
    0%   { transform: scale(1);   opacity: 0.9; }
    70%  { transform: scale(3.2); opacity: 0; }
    100% { transform: scale(3.2); opacity: 0; }
  }

  /* ── Locate-me button ──────────────────────────────────────────────────────── */
  /* Sits at the right end of the FTS row (vertically aligned to its bottom). */
  #locate-btn {
    position: fixed;
    /* Desktop default — tucked into the bottom-right corner.
       Mobile (max-width 639px) overrides right + bottom + size below. */
    right: 12px;
    bottom: 12px;
    z-index: 920;
    /* 34px on pointer-fine devices reads as right-sized for a mouse;
       mobile rule below pushes it back to 40px for touch. */
    width: 34px;
    height: 34px;
    padding: 0;
    border-radius: 50%;
    /* Match the venue-list panel's glass instead of the more-solid action
       token — user observed the button 'looks more blue than the
       transparent gaussian background of the venue list panel.' Panel
       tokens give a softer, more transparent feel for a standalone
       floating button against the map. */
    background: var(--glass-panel-bg);
    backdrop-filter: var(--glass-blur-panel);
    -webkit-backdrop-filter: var(--glass-blur-panel);
    border: var(--glass-border);
    box-shadow: var(--glass-inset);
    color: rgba(156,189,231,0.8);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  /* Icon swap by cycle state — only one .locate-icon visible at a time.
     Each class represents the CURRENT camera framing, but the icon shown
     is the NEXT action (what tapping will do). v1 used display:none/block
     which couldn't animate the swap; v2 stacks all three icons absolutely
     in the same slot and crossfades via .is-active / .is-leaving classes
     applied by _setLocateBtnState(state). Pattern is 'push down': the
     departing icon slides DOWN out (translateY(100%)) while the new icon
     enters from ABOVE (translateY(-100% → 0)). */
  #locate-btn .locate-icon {
    position: absolute;
    /* v1 used inset:0 + display:flex on the SVG itself, which broke its
       intrinsic sizing and pushed the glyph to the upper-left of the
       button. Pin to centre via explicit size + margin offset. */
    width: 18px;
    height: 18px;
    top: 50%;
    left: 50%;
    margin: -9px 0 0 -9px;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-100%);
    transition: transform 0.26s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.18s ease;
  }
  #locate-btn .locate-icon.is-active {
    opacity: 1;
    transform: translateY(0);
  }
  #locate-btn .locate-icon.is-leaving {
    opacity: 0;
    transform: translateY(100%);
  }
  /* Hover keeps the glass background — only border + icon colour shift
     so the tap target reads as 'available' without breaking the
     transparent feel. v1 replaced background with a solid slate-blue,
     which destroyed the glass illusion the moment the user hovered. */
  #locate-btn:hover {
    border-color: rgba(255,175,133,0.45);
    color: rgba(255,175,133,0.95);
  }
  /* Active (mousedown / touch) — subtle press-down. The button briefly
     scales down to confirm the tap; the absolute-positioned icons
     scale with their parent which feels right (one unit, not parts). */
  #locate-btn:active {
    transform: scale(0.94);
    transition: transform 0.1s ease;
  }
  /* Tracking — post-click state during the camera fly. Honey-accent
     border + cool-blue icon for the 'I'm doing the thing now' beat.
     Unchanged from v1 because the user explicitly liked this colour. */
  #locate-btn.tracking {
    border-color: rgba(74,144,226,0.7);
    color: #4A90E2;
  }

  /* ── Zoom jog slider ──────────────────────────────────────────────────────── */
  #zoom-jog {
    position: fixed;
    right: 12px;
    /* Sits 8px above the 34px locate-btn on desktop (mobile rule below
       restores the 40+10 stack). */
    bottom: calc(12px + 34px + 8px);
    z-index: 900;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    transition: opacity 0.25s ease;
  }
  .zj-track {
    width: 34px;
    height: 92px;
    border-radius: 17px;
    background: var(--glass-action-bg);
    backdrop-filter: var(--glass-blur-action);
    -webkit-backdrop-filter: var(--glass-blur-action);
    border: var(--glass-border);
    box-shadow: var(--glass-inset);
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
  }
  .zj-label {
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
    color: rgba(156,189,231,0.55);
    pointer-events: none;
    position: relative;
    z-index: 1;
  }
  .zj-thumb {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: rgba(156,189,231,0.25);
    border: 1.5px solid rgba(156,189,231,0.45);
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.25s cubic-bezier(0.25, 0.9, 0.4, 1), background 0.15s;
    cursor: grab;
    z-index: 2;
  }
  .zj-thumb:active, .zj-thumb.active {
    cursor: grabbing;
    background: rgba(156,189,231,0.4);
  }

  /* ── Shared floating card base ────────────────────────────────────────────── */
  .floating-card {
    background: var(--glass-panel-bg);
    backdrop-filter: var(--glass-blur-panel);
    -webkit-backdrop-filter: var(--glass-blur-panel);
    border: var(--glass-border);
    border-radius: 16px;
    padding: 10px 14px;
    box-shadow: var(--glass-inset), 0 6px 24px rgba(0,0,0,0.50);
    position: relative;
  }

  /* ── Top-left: search bar ──────────────────────────────────────────────────── */
  #floating-search {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 900;
    width: 336px;
    height: 46px;
    box-sizing: border-box;
    padding: 0 6px 0 14px; /* tighter on the right so the avatar tucks in */
    border-radius: 23px;   /* true pill — half of 46px height */
    display: flex;
    align-items: center;
    gap: 8px;
    transition: border-color 0.15s, box-shadow 0.15s, opacity 200ms ease-out, transform 220ms ease-out;
  }
  #floating-search:hover {
    border-color: rgba(245,194,94,0.32);
    box-shadow: var(--glass-inset), 0 4px 20px rgba(0,0,0,0.30);
  }
  #floating-search:focus-within {
    /* Honey border + subtle inner highlight — DESIGN.md tier-1/3 focus spec */
    border-color: rgba(245,194,94,0.55);
    box-shadow:
      inset 0 0 0 1px rgba(245,194,94,0.18),
      var(--glass-inset),
      0 4px 20px rgba(0,0,0,0.30);
  }
  #search-icon {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #search-icon svg {
    width: 18px;
    height: 18px;
    color: var(--muted);
  }
  #floating-search #venue-search {
    background: transparent;
    border: none;
    padding: 0;
    width: 100%;
    font-size: 15px;
    color: var(--text);
  }
  #floating-search #venue-search:focus { border: none; outline: none; }
  /* Brighter placeholder — opacity-dimmed cream reads more cleanly on
     translucent slate than chromatic --muted. Per DESIGN.md principle 03. */
  #floating-search #venue-search::placeholder {
    color: rgba(255, 244, 224, 0.55);
    opacity: 1;
  }

  #search-clear-btn {
    display: none;
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border: none;
    background: rgba(255,242,235,0.1);
    border-radius: 50%;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    padding: 0;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  #search-clear-btn:hover { background: rgba(255,242,235,0.18); color: var(--text); }
  #floating-search.has-query #search-clear-btn { display: flex; }


  #search-profile-btn {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.15s;
  }
  #search-profile-btn:hover { opacity: 0.8; }
  #search-profile-btn img {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: block;
  }
  #search-profile-btn .profile-initials {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: #000;
  }
  #search-profile-btn .profile-anon {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(156,189,231,0.12);
    border: 1.5px solid rgba(156,189,231,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
  }

  /* ── Top strip (redesign — Stage 1a) ───────────────────────────────────
     Three-zone layout: [avatar + bell] / [centered date + weather sentence]
     / [search]. Replaces #floating-search; old bar hidden below. */
  #floating-search { display: none !important; }

  #top-strip {
    position: absolute;
    /* max() so each platform gets the spacing it needs:
       - iOS PWA: env returns ~59px (Island + status bar), so top ≈
         61px → tight under the Dynamic Island, as requested.
       - Android PWA: env returns 0 (status bar painted by theme-
         color, no inset), so the 14px floor kicks in → breathing
         room under the system status bar.
       - Browser: env returns 0 too, floor gives 14px. */
    top: max(calc(env(safe-area-inset-top, 0px) + 2px), 14px);
    /* Mobile (default): edge-to-edge with 12px breathing on both sides.
       Desktop overrides below cap the width so the strip reads as a
       discrete control surface, not a chrome bar that flies along the
       top of the page. */
    left: 12px;
    right: 12px;
    z-index: 900;
    height: 46px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 6px;
    padding: 4px;
    border-radius: 23px;
    background: var(--glass-panel-bg);
    backdrop-filter: var(--glass-blur-panel);
    -webkit-backdrop-filter: var(--glass-blur-panel);
    border: var(--glass-border);
    box-shadow: var(--glass-inset), 0 6px 20px rgba(0,0,0,0.30);
    container-type: inline-size;
    container-name: topstrip;
    /* Slide-up animation — when a takeover state (plan-preview, post-
       accept, profile panel, detail-panel open) hides the strip, it
       translates up out of view rather than fading in place. Returns
       on close with the same easing. */
    transform: translateY(0);
    transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.22s ease;
    will-change: transform;
  }
  /* Slide-up hide states — keep opacity at 1 during the transform so the
     motion reads as "the bar leaves the screen" rather than "the bar
     fades to nothing while sitting in place." pointer-events:none keeps
     the (off-screen) bar from intercepting taps. */
  /* Detail panel intentionally NOT in this list — the user wants the
     strip to stay so they can scrub the date/time and re-evaluate the
     same venue at another moment. Invite sheet stays hidden because
     the plan is pinned to its planned_at. */
  body.plan-preview-active #top-strip,
  body.post-accept-active #top-strip,
  body.profile-panel-open #top-strip,
  body.invite-sheet-open #top-strip,
  body.plan-preview-active #floating-brand,
  body.post-accept-active #floating-brand,
  body.profile-panel-open #floating-brand,
  body.invite-sheet-open #floating-brand {
    transform: translateY(calc(-100% - env(safe-area-inset-top, 0px) - 14px));
    pointer-events: none;
  }
  #top-strip .ts-left, #top-strip .ts-right {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #top-strip .ts-btn {
    flex-shrink: 0;
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--glass-action-bg);
    border: var(--glass-border);
    box-shadow: var(--glass-inset);
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    position: relative;
    transition: color 120ms, background 120ms, border-color 120ms;
  }
  #top-strip .ts-btn:hover { color: var(--text); }
  #top-strip .ts-btn svg { width: 18px; height: 18px; }
  #top-strip .ts-btn.active {
    background: var(--accent-dim);
    border-color: rgba(245,194,94,0.42);
    color: var(--accent);
  }
  #top-strip .ts-avatar {
    /* Same chrome as bell + search — token-based glass. The avatar image or
       anon icon inside provides differentiation, not the button background. */
    color: var(--text);
    font: 600 12px/1 'Inter', sans-serif;
    overflow: hidden;
  }
  #top-strip .ts-avatar.active { box-shadow: var(--glass-inset), 0 0 0 2px var(--accent-border, rgba(245,194,94,0.42)); }
  #top-strip .ts-avatar img { width: 38px; height: 38px; border-radius: 50%; display: block; }
  #top-strip .ts-avatar .profile-initials,
  #top-strip .ts-avatar .profile-anon {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #top-strip .ts-avatar .profile-initials {
    background: var(--accent);
    color: var(--accent-on);
    font-size: 14px;
    font-weight: 700;
  }
  #top-strip .ts-avatar .profile-anon {
    background: transparent;
    color: var(--muted);
    border: none;
  }
  #top-strip .ts-bell-dot {
    position: absolute;
    top: 7px; right: 7px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--panel);
  }

  #top-strip .ts-center {
    display: flex;
    align-items: center;
    justify-content: center;
    /* Tighter cluster: 4px between siblings reads as a single phrase;
       the dot separators carry the visual break between temp / wind /
       glyph groups, so the inter-sibling gap doesn't need to do that
       work too. */
    gap: 4px;
    font: 500 13px/1 'Inter', sans-serif;
    color: var(--text);
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    padding: 0 4px;
  }
  #top-strip .ts-date {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--text);
    font-weight: 600;
    padding: 5px 9px;
    margin: -5px -2px -5px -4px;
    border-radius: 10px;
    cursor: pointer;
    /* Subtle resting fill so the date reads as a control rather than
       inline text. Same surface alpha as glass-action buttons, but
       borderless so it stays integrated with the strip cluster. */
    background: rgba(155,169,188,0.10);
    border: none;
    font-family: inherit;
    font-size: inherit;
    transition: background 120ms, color 120ms;
  }
  #top-strip .ts-date:hover { background: rgba(155,169,188,0.18); }
  #top-strip .ts-date.active {
    background: rgba(245,194,94,0.16);
    color: var(--accent);
  }
  #top-strip .ts-date .ts-chev {
    width: 11px; height: 11px;
    /* Brighter chevron so the "tap to open" affordance is legible at
     glance — was --muted, dropped into the noise next to the dots. */
    color: var(--text);
    opacity: 0.7;
    transition: transform 120ms, color 120ms, opacity 120ms;
  }
  #top-strip .ts-date:hover .ts-chev { opacity: 1; }
  #top-strip .ts-date.active .ts-chev { color: var(--accent); opacity: 1; transform: rotate(180deg); }
  #top-strip .ts-center .ts-dot { color: rgba(155,169,188,0.4); font-weight: 400; }
  /* Date and weather icon read as a pair — pull the icon tighter against
     the date button (no dot separator between them, unlike temp/wind). */
  #top-strip .ts-center .ts-date + .ts-wx-icon { margin-left: -2px; }
  /* Explicit emoji fallback fonts so iOS Safari resolves ☀️ ⛅ 🌤 ☁️ 🌧
     to Apple Color Emoji even when the parent font-family ('Inter') has
     no glyph for them. Without this list, iOS sometimes renders nothing.
     line-height bumped from 1 → 1.2 so the emoji glyph isn't clipped by
     the tight line-box. */
  #top-strip .ts-center .ts-wx-icon {
    font-size: 15px;
    line-height: 1.2;
    font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
  }
  #top-strip .ts-center .ts-meta { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  /* Temperature carries the most decision-load in the strip — bump
     to text color + slight weight bump so it reads cleanly without
     visually competing with the date (which is the primary CTA). */
  #top-strip .ts-center .ts-temp {
    color: var(--text);
    font-weight: 600;
    margin-left: 2px;   /* tighten next to the glyph (the dot is gone) */
  }

  /* Adaptive sentence — drop in priority order: wind → temp → glyph
     (date stays always). Breakpoints are on container width, not viewport. */
  @container topstrip (max-width: 340px) {
    #top-strip .ts-wind, #top-strip .ts-wind-dot { display: none; }
  }
  @container topstrip (max-width: 290px) {
    #top-strip .ts-temp, #top-strip .ts-temp-dot { display: none; }
  }
  @container topstrip (max-width: 240px) {
    #top-strip .ts-wx-icon, #top-strip .ts-glyph-dot { display: none; }
  }

  /* Desktop: align with the venue-list panel column (380 px). The grid
     uses `auto 1fr auto` so explicit width is required — max-content
     would collapse the 1fr middle column. Container queries above drop
     the wordmark (and ultimately the whole brand block) when this width
     leaves the cluster cramped, so the row gracefully shrinks. */
  @media (min-width: 640px) {
    #top-strip {
      left: 16px;
      right: auto;
      width: 380px;
    }
  }

  /* .intro-hidden + .mobile-ui-hidden (display:none !important) already
     hide #top-strip when the JS applies/removes those classes — same as
     it does for #floating-search. No extra CSS needed. */

  /* ── Top strip search mode (Stage 3) ───────────────────────────────────
     Click search → strip cross-fades into a single search field. The
     strip itself becomes the field — no pill-in-pill chrome, no border,
     no inset shadow on the inner element. Cross-fade via opacity so the
     transition feels smooth (display:none/flex would snap). */
  #top-strip .ts-search-input {
    position: absolute;
    inset: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 6px 0 12px;
    border-radius: 19px;
    background: transparent;
    border: none;
    box-shadow: none;
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms ease;
  }
  #top-strip .ts-search-input .ts-search-input-icon {
    flex-shrink: 0;
    width: 18px; height: 18px;
    color: var(--muted);
    display: inline-flex;
  }
  #top-strip .ts-search-input #venue-search {
    flex: 1 1 auto;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    padding: 0;
    color: var(--text);
    font: 500 14px/1 'Inter', sans-serif;
  }
  /* Suppress the global :focus-visible outline — the pill chrome itself
     is a clear "this is active" signal; the honey ring on top is noise. */
  #top-strip .ts-search-input #venue-search:focus,
  #top-strip .ts-search-input #venue-search:focus-visible {
    outline: none !important;
    box-shadow: none;
  }
  #top-strip .ts-search-input #venue-search::placeholder {
    color: rgba(255,244,224,0.55);
  }
  #top-strip .ts-search-input-close {
    flex-shrink: 0;
    width: 28px; height: 28px;
    border-radius: 50%;
    border: none;
    background: rgba(255,244,224,0.22);
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    line-height: 1;
    cursor: pointer;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 120ms;
  }
  #top-strip .ts-search-input-close:hover {
    background: rgba(255,244,224,0.32);
  }

  /* Cross-fade + slide. The right search button slides leftward as it
     fades, so the user perceives the icon moving toward the search
     field's leading-icon position. The input's own icon fades in on
     a slight delay, landing where the slid button "arrived". */
  #top-strip .ts-left,
  #top-strip .ts-center {
    transition: opacity 160ms ease, transform 200ms ease;
  }
  #top-strip .ts-right {
    transition: transform 260ms cubic-bezier(0.2, 0.8, 0.3, 1),
                opacity 200ms ease 40ms;
  }
  #top-strip .ts-search-input .ts-search-input-icon {
    opacity: 0;
    transition: opacity 200ms ease 120ms;
  }
  #top-strip.searching .ts-left,
  #top-strip.searching .ts-center {
    opacity: 0;
    transform: translateX(-12px);
    pointer-events: none;
  }
  #top-strip.searching .ts-right {
    transform: translateX(-60px);
    opacity: 0;
  }
  #top-strip.searching .ts-search-input { opacity: 1; pointer-events: auto; }
  #top-strip.searching .ts-search-input .ts-search-input-icon { opacity: 1; }

  /* Honey ring on the strip in search mode — signals "active". */
  #top-strip {
    transition:
      box-shadow 220ms ease,
      border-color 220ms ease;
  }
  #top-strip.searching {
    border-color: rgba(245,194,94,0.35);
    box-shadow:
      var(--glass-inset),
      0 6px 20px rgba(0,0,0,0.30),
      0 0 0 1px rgba(245,194,94,0.28);
  }

  /* ── Panel header cleanup (Stage 2a) ──────────────────────────────────
     The date chip + weather chip line and the prose sun-outlook line are
     redundant with the new top strip (date + weather) and FTS (hourly
     forecast). Hide the whole #day-header so the venue list starts cleanly.
     Hidden, not removed: paint functions keep running without breaking. */
  #day-header { display: none; }

  /* ── Panel action row (Stage 2c) — filter pills + sort ────────────────
     Sits above #venue-peek. Horizontally-scrolling pill row on the left,
     sort button pinned right. Pills are tier-3 surface controls; active
     state uses honey-dim like the bell badge. */
  #panel-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px 4px;
    flex-shrink: 0;
  }
  #panel-actions .panel-actions-pills {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  #panel-actions .panel-actions-pills::-webkit-scrollbar { display: none; }
  .panel-filter-pill {
    flex-shrink: 0;
    height: 32px;
    padding: 0 12px;
    border-radius: 16px;
    background: var(--glass-action-bg);
    backdrop-filter: var(--glass-blur-action);
    -webkit-backdrop-filter: var(--glass-blur-action);
    border: var(--glass-border);
    box-shadow: var(--glass-inset);
    color: var(--text);
    font: 500 12px/1 'Inter', sans-serif;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    -webkit-tap-highlight-color: transparent;
    transform-origin: center;
    transition: background 120ms, border-color 120ms, color 120ms,
                transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    will-change: transform;
  }
  /* Hover scoped to pointer-fine devices — prevents sticky :hover state
     on iOS Safari that otherwise leaves the accent color + border on a
     pill after a tap. */
  @media (hover: hover) and (pointer: fine) {
    .panel-filter-pill:hover { color: var(--accent); border-color: rgba(245,194,94,0.32); }
  }
  .panel-filter-pill.active {
    background: rgba(245,194,94,0.18);
    border-color: var(--accent);
    color: var(--accent);
  }
  /* Tactile press feedback that works on touch (the lens-fx tilt is barely
     visible under a finger). Quick scale-down then snap back. */
  .panel-filter-pill:active { transform: scale(0.94); }
  /* Clear residual mouse-focus ring after click; keyboard focus still shows. */
  .panel-filter-pill:focus { outline: none; }
  .panel-filter-pill:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  /* Press feedback (lens-fx) uses fast linear easing during tilt engagement. */
  body[data-fx] .panel-filter-pill.lens-fx-tilting {
    transition: transform 0.05s linear,
                background 120ms, border-color 120ms, color 120ms;
  }
  /* No border-flash animation here — it reads as a slow lag on a control
     this small. The :active scale + tilt are enough press feedback. */
  #panel-actions-sort {
    flex-shrink: 0;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--glass-action-bg);
    backdrop-filter: var(--glass-blur-action);
    -webkit-backdrop-filter: var(--glass-blur-action);
    border: var(--glass-border);
    box-shadow: var(--glass-inset);
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    transition: color 120ms;
  }
  #panel-actions-sort:hover { color: var(--text); }

  /* ── Cold-link friend-invite welcome card ──────────────────────────────── */
  .friend-invite-welcome {
    position: fixed;
    inset: 0;
    z-index: 1200;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(15, 30, 55, 0.22);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease;
  }
  .friend-invite-welcome.show {
    opacity: 1;
    pointer-events: auto;
  }
  .fiw-card {
    width: min(360px, calc(100vw - 32px));
    padding: 28px 24px 20px;
    border-radius: 20px;
    text-align: center;
    transform: translateY(12px);
    transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .friend-invite-welcome.show .fiw-card { transform: translateY(0); }
  .fiw-icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: rgba(245, 194, 94, 0.18);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .fiw-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.25;
    margin-bottom: 8px;
  }
  .fiw-sub {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.4;
    margin-bottom: 20px;
  }
  .fiw-cta { width: 100%; margin-bottom: 8px; }
  .fiw-dismiss {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 13px;
    padding: 8px 12px;
    cursor: pointer;
  }

  /* ── Avatar badge dot (pending friend requests) ────────────────────────── */
  #search-profile-btn.has-badge::after {
    content: '';
    position: absolute;
    top: -2px;
    right: -2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    pointer-events: none;
  }

  /* ── Zoom debug helper ───────────────────────────────────────────────────── */
  #zoom-debug {
    position: absolute;
    top: calc(16px + 46px + 8px + 50px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 899;
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    white-space: nowrap;
    border-radius: 12px;
    transition: opacity 200ms ease-out;
  }
  #zoom-debug.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* ── Search dropdown ─────────────────────────────────────────────────────── */
  #search-dropdown {
    position: absolute;
    top: calc(16px + 46px + 6px);
    left: 16px;
    width: 380px;
    z-index: 1050;
    border-radius: 14px;
    box-shadow: var(--glass-inset), 0 8px 32px rgba(0,0,0,0.55);
    overflow: hidden;
    display: none;
    /* Override the .glass-panel translucent mix — this dropdown is
       scannable content, not a lens surface. Slate at 92% alpha keeps
       a hint of translucency without sacrificing legibility. */
    background: rgba(26, 44, 66, 0.92) !important;
  }

  /* Bell dropdown — full-width below the top strip. Same legibility
     treatment as the search dropdown. Capped at 60vh so it doesn't
     dominate the screen; content scrolls inside. */
  #bell-dropdown {
    position: absolute;
    top: calc(14px + 46px + 8px);
    left: 12px;
    right: 12px;
    width: auto;
    max-height: min(calc(var(--app-h, 100svh) * 0.6), 520px);
    z-index: 1050;
    border-radius: 14px;
    box-shadow: var(--glass-inset), 0 8px 32px rgba(0,0,0,0.55);
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    display: none;
    background: rgba(26, 44, 66, 0.92) !important;
  }
  #bell-dropdown.open { display: block; }
  /* Rows clickable for nav-style notifications (check-ins, plans). */
  .bd-row.bd-row--clickable {
    cursor: pointer;
    transition: background 120ms;
    -webkit-tap-highlight-color: transparent;
  }
  .bd-row.bd-row--clickable:hover { background: rgba(155,169,188,0.06); }
  .bd-row.bd-row--clickable:active { background: rgba(155,169,188,0.14); }
  /* Past-event invite row — the plan time has come and gone. Dimmed
     to ~55% so the user sees at a glance it's expired, but stays
     clickable so they can still open the (past-state) plan-preview
     panel that shows what the day looked like. Avatar stays full-
     opacity so faces remain recognizable. */
  .bd-row.bd-row--past { opacity: 0.55; }
  .bd-row.bd-row--past .bd-row__avatar,
  .bd-row.bd-row--past .bd-row__lead { opacity: 1; }

  /* Host quick-cancel button — small × in the row's right edge that
     opens a two-tap "Avlys?" confirm. Only renders for inviter-side
     rows whose plan is still active (host-side accepted/declined
     responses + creator reminder). Pinned via flex on the parent
     .bd-row; doesn't bubble taps to the row's own onclick. */
  .bd-row__quick-cancel {
    margin-left: auto;
    align-self: flex-start;
    margin-top: 14px;
    margin-right: 8px;
    flex-shrink: 0;
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 0;
    background: rgba(155, 169, 188, 0.10);
    color: var(--muted);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.14s ease, color 0.14s ease, width 0.14s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .bd-row__quick-cancel:hover {
    background: rgba(255, 100, 100, 0.18);
    color: #ff8c8c;
  }
  .bd-row__quick-cancel--armed {
    width: auto;
    padding: 0 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: rgba(255, 100, 100, 0.22);
    color: #ff8c8c;
  }

  /* Freshly-arrived row — entry animation when a new notification
     lands while the inbox is already open (realtime accept/decline
     pushes a new bell row at the top). Slides down from above the
     viewport with a brief fade-in. Other rows reflow into their new
     positions instantly (innerHTML rebuild) — a true FLIP "siblings
     slide down" would require DOM-diffing the render path, deferred
     for now since the new row's motion alone is the strong signal. */
  @keyframes bd-row-arrive {
    0%   { transform: translateY(-14px); opacity: 0; }
    60%  { transform: translateY(0);     opacity: 1; }
    100% { transform: translateY(0);     opacity: 1; }
  }
  .bd-row.bd-row--entering {
    animation: bd-row-arrive 0.42s cubic-bezier(0.32, 0.72, 0, 1) both;
    transform-origin: top center;
  }
  @media (prefers-reduced-motion: reduce) {
    .bd-row.bd-row--entering { animation: none; }
  }
  /* New / unread indicator — small honey dot floating at the right edge */
  .bd-row.bd-row--new { position: relative; }
  .bd-row.bd-row--new::after {
    content: '';
    position: absolute;
    top: 16px; right: 14px;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px rgba(245,194,94,0.55);
  }
  .bd-empty {
    padding: 28px 16px;
    text-align: center;
    color: var(--muted);
  }
  .bd-empty .bd-empty-icon {
    display: block;
    margin: 0 auto 10px;
    width: 32px; height: 32px;
    opacity: 0.6;
  }
  .bd-empty .bd-empty-text {
    font: 500 13px/1.4 'Inter', sans-serif;
  }
  .bd-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    border-top: 1px solid rgba(155,169,188,0.10);
  }
  .bd-row:first-of-type { border-top: none; }
  /* Leading element — 32px slot. Avatar for friend events, line icon
     for system events. Same width either way so all rows line up.
     position:relative so the +1 badge can sit outside the avatar's
     overflow-clipped circle. */
  .bd-row__lead {
    flex-shrink: 0;
    position: relative;
    width: 32px; height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .bd-row__avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #5C7A9E, #2C4564);
    color: var(--text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font: 600 13px/1 'Inter', sans-serif;
    border: 1px solid rgba(155,169,188,0.22);
    overflow: hidden;
  }
  .bd-row__avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* +1 badge — sibling of the avatar, anchored to the lead container
     so it can render past the avatar's clipped circle. */
  .bd-row__avatar-plus {
    position: absolute;
    right: -6px; bottom: -4px;
    background: var(--panel);
    color: var(--text);
    font: 700 9px/1 'Inter', sans-serif;
    padding: 3px 5px;
    border-radius: 9px;
    border: 1.5px solid var(--panel);
    box-shadow: 0 0 0 1px rgba(155,169,188,0.30);
  }
  .bd-row__sys-icon {
    color: var(--muted);
    width: 20px; height: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .bd-row__sys-icon svg { width: 18px; height: 18px; }
  .bd-row__body {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .bd-row__msg {
    font: 500 13px/1.35 'Inter', sans-serif;
    color: var(--text);
  }
  .bd-row__msg strong { font-weight: 700; }
  .bd-row__meta {
    font: 500 11px/1 'Inter', sans-serif;
    color: var(--muted);
  }
  .bd-row__actions {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }
  .bd-action {
    flex: 1 1 0;
    height: 32px;
    padding: 0 10px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font: 600 12px/1 'Inter', sans-serif;
    transition: background 120ms, color 120ms, transform 80ms, filter 120ms;
    -webkit-tap-highlight-color: transparent;
  }
  .bd-action:active { transform: scale(0.97); }
  .bd-action.primary {
    background: var(--accent);
    color: var(--accent-on);
  }
  .bd-action.primary:hover { filter: brightness(1.08); }
  .bd-action.primary:active { filter: brightness(0.95); }
  .bd-action.secondary {
    background: rgba(155,169,188,0.14);
    color: var(--text);
  }
  .bd-action.secondary:hover { background: rgba(155,169,188,0.22); }
  .bd-action.secondary:active { background: rgba(155,169,188,0.30); }
  #search-dropdown.open { display: block; }
  .sd-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    transition: background 0.1s;
    gap: 8px;
  }
  .sd-row:last-child { border-bottom: none; }
  .sd-row:hover { background: rgba(245,194,94,0.12); }
  .sd-row:active, .sd-row.sd-row-clicked {
    background: rgba(245,194,94,0.28);
    transform: scale(0.98);
    transition: background 0.05s, transform 0.05s;
  }
  .sd-row-icon {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
  }
  .sd-row-icon .sd-icon {
    width: 16px;
    height: 16px;
  }
  .sd-row-name {
    font-size: 14px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
  }
  .sd-row-area {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .sd-suggest-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    transition: background 0.1s;
  }
  .sd-suggest-row:hover { background: rgba(255,175,133,0.09); }
  .sd-suggest-label {
    font-size: 13px;
    color: var(--muted);
  }
  .sd-suggest-btn {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: rgba(255,175,133,0.12);
    border: 1px solid rgba(255,175,133,0.35);
    border-radius: 8px;
    padding: 4px 10px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .sd-suggest-btn:hover { background: rgba(255,175,133,0.22); }
  @media (max-width: 639px) {
    #search-dropdown {
      left: 6px;
      right: 6px;
      width: auto;
    }
    /* Mobile: position below search bar, centred + sized to content
       so short messages don't get a wall of dead space on the right.
       (v1 stretched left:6 right:6 — single-line toasts looked
       hollow.) */
    #notif-toast-wrap {
      top: calc(12px + 46px + 8px);
      left: 50%;
      max-width: calc(100vw - 24px);
      transform: translateX(-50%) translateY(-20px);
      width: max-content;
    }
    #notif-toast-wrap.show {
      transform: translateX(-50%) translateY(0);
    }
    #notif-toast {
      border-radius: 16px;
      margin-bottom: 0;
    }
    /* Move notification to very top during the accept / post-accept
       takeover. #top-strip is hidden in those flows (see the
       body.{plan-preview-active,post-accept-active} #top-strip rule
       above), so the toast has no chrome to clear. detail-panel.open
       was previously in this list, but it does NOT hide #top-strip —
       the toast at top:12px overlapped the bell + profile bar. With
       detail-panel.open removed here, the default mobile position
       (top: calc(12px + 46px + 8px)) keeps the toast below the strip. */
    body.plan-preview-active #notif-toast-wrap,
    body.post-accept-active #notif-toast-wrap {
      top: 12px;
    }
    /* Hide notif while either panel reaches fullscreen so it doesn't overlap
       the content. Use opacity (not display:none) so a notification arriving
       during fullscreen will fade in cleanly when the user collapses. */
    body:has(#panel.mobile-fullscreen) #notif-toast-wrap,
    body:has(#detail-panel.dp-fullscreen) #notif-toast-wrap {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
  }

  /* ── Profile popover ──────────────────────────────────────────────────────── */
  /* Stage 4b-1: Bottom sheet on both mobile and desktop — Tier 1 lens panel.
     Slides up from below; rests just under the top strip. */
  #profile-panel {
    position: fixed;
    top: 0;               /* full-screen takeover; sheet rises to the notch */
    left: 0; right: 0; bottom: 0;
    z-index: 1100;
    border-radius: 0;
    border-top: none;
    background: var(--glass-panel-bg);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow:
      var(--glass-inset),
      0 -8px 40px rgba(0,0,0,0.45);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-overflow-scrolling: touch;
    transform: translateY(100%);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.28s cubic-bezier(0.25, 0.9, 0.4, 1), opacity 0.22s ease;
  }
  /* Mirror-sky overlay — Tier 1 spec. Subtle warm/cool dispersion that's
     barely perceptible at first glance. Lives on a pseudo-element so it
     doesn't paint over the panel contents. */
  #profile-panel::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255,244,224,0.06), transparent 50%),
      radial-gradient(ellipse at 100% 100%, rgba(26,44,66,0.20), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  #profile-panel > * { position: relative; z-index: 1; }
  /* Inner scroll container — the panel itself is overflow:hidden so the
     mirror-sky overlay doesn't smear. The settings-root wrapper handles
     scrolling. iPhone home indicator: 24px of clearance above safe-area
     so the bottom-most row (sign-out) sits clear of the gesture zone. */
  #profile-panel .settings-root {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    /* See --app-pad-b token (top of CSS) — guaranteed-visible bottom
       across all hosts including iOS Chrome WebView PWA. */
    padding-bottom: var(--app-pad-b);
  }

  /* Sliding view container — used during drill-in / back navigation
     between sub-views. Two pages stacked horizontally; transform on the
     wrapper slides between them. After the transition completes, JS
     re-renders in the canonical un-wrapped layout. */
  #profile-panel .profile-pages {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: row;
    width: 200%;
    will-change: transform;
  }
  #profile-panel .profile-pages .profile-page {
    flex: 0 0 50%;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #profile-panel.open {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }
  /* Logged-out (login) takes over the full viewport on every breakpoint so the
     value-prop carousel + auth buttons get the user's full attention. */
  #profile-panel.logged-out {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100%;
    height: var(--app-h, 100svh);
    max-height: var(--app-h, 100svh);
    border-radius: 0;
    z-index: 9999;            /* above notifications (9998) */
    transform: translateX(0);
    opacity: 0;
    pointer-events: none;
  }
  #profile-panel.logged-out.open {
    opacity: 1;
    pointer-events: auto;
  }
  #profile-panel.logged-out .login-close-btn { display: flex; }
  /* Hero stretches to fill the fullscreen panel; auth section pins to the
     bottom. Same flex split on desktop and mobile — typography overrides for
     mobile live in the @media block below. */
  #profile-panel.logged-out .login-hero {
    flex: 1 1 auto;
    display: flex; flex-direction: column; justify-content: center;
    padding: 32px 20px 8px;
    width: 100%;
    box-sizing: border-box;
  }
  #profile-panel.logged-out .login-auth-section {
    flex: 0 0 auto;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    width: 100%;
    box-sizing: border-box;
  }
  @media (min-width: 640px) {
    /* Constrain hero/auth width on desktop so the carousel + buttons don't
       stretch across a 1920px monitor. */
    #profile-panel.logged-out .login-hero,
    #profile-panel.logged-out .login-auth-section {
      max-width: 480px;
      margin: 0 auto;
    }
  }
  /* When venue list slides off so the settings card can take its place — only
     on desktop; mobile already covers the screen. */
  @media (min-width: 640px) {
    body.profile-panel-open #panel {
      transform: translateX(calc(-100% - 24px));
      opacity: 0;
      pointer-events: none;
    }
  }
  /* Mobile-only sticky header — hidden by default; the @media (max-width:639px)
     rule below restores it when the panel goes full-screen. */
  .profile-panel-mobile-bar { display: none; }
  .profile-panel-header {
    padding: 20px 20px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .profile-panel-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    flex-shrink: 0;
    object-fit: cover;
  }
  .profile-panel-avatar-initials {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: #000;
  }
  .profile-panel-info { min-width: 0; }
  .profile-panel-name {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: #FFF2EB;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .profile-panel-email {
    font-size: 13px;
    font-weight: 400;
    color: #9CBDE7;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .profile-panel-body { padding: 12px 0; }
  .profile-panel-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    transition: background 0.12s;
  }
  .profile-panel-row:hover { background: rgba(255,255,255,0.05); }
  .profile-panel-row svg { flex-shrink: 0; color: var(--muted); }
  .profile-panel-footer {
    border-top: 1px solid rgba(255,255,255,0.07);
    padding: 12px 0 4px;
  }
  .profile-panel-signout {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 500;
    color: #9CBDE7;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    font-family: 'Inter', sans-serif;
  }
  .profile-panel-signout:hover { background: rgba(255,255,255,0.05); color: var(--text); }

  /* ── Top-right brand card — desktop only ───────────────────────────────────
     Sits as its own pill to the right of the top-strip. Same glass
     tokens as #top-strip, same top-offset + height — the two surfaces
     read as a single chrome plane interrupted by a clean visual gap,
     not as "logo inside the toolbar".

     Mobile rule below (line ~4815) hides this entirely; the top-strip's
     avatar carries the identity at touch widths. */
  #floating-brand {
    position: absolute;
    top: max(calc(env(safe-area-inset-top, 0px) + 2px), 14px);
    right: 16px;
    z-index: 900;
    height: 46px;
    box-sizing: border-box;
    padding: 4px 14px;
    border-radius: 23px;
    background: var(--glass-panel-bg);
    backdrop-filter: var(--glass-blur-panel);
    -webkit-backdrop-filter: var(--glass-blur-panel);
    border: var(--glass-border);
    box-shadow: var(--glass-inset), 0 6px 20px rgba(0,0,0,0.30);
    display: flex;
    align-items: center;
    gap: 10px;
    transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.22s ease;
    will-change: transform;
  }

  /* ── Time slider — Stage 2b: child of #panel, normal flow ─────────────────
     Was a position:fixed top-level element; now lives inside the panel
     header (after #panel-handle). The date button is gone — the top
     strip's date link is the only date picker entry point. */
  #fts {
    display: none;  /* hidden by default; shown by body.fts */
  }
  body.fts #fts {
    display: flex;
    position: relative;
    /* Symmetric 6px gaps around the compact popup:
         panel-top → 6px → popup-top → popup-body (24) → 6px (tail) → FTS-top
       Total popup-area = 36px from panel-top. Handle takes 16px of that
       in flow, so margin-top = 36 - 16 = 20px. Compact popup overlaps
       the handle pill — accepted. Expanded popup overflows above the
       panel via overflow:visible. */
    /* Top margin bumped 20 → 38 so the compact scrub popup (≈ 28 px
       tall + 8 px tail + gap) clears the panel top edge cleanly. The
       expanded popup is taller and intentionally overshoots into the
       top-strip band — that's now allowed because #panel z-index 901
       stacks the popup above the strip (see #panel rule). */
    margin: 38px 12px 10px;
    height: 40px;
    align-items: center;
    gap: 8px;
    padding: 0;
    background: none;
    border: none;
    box-shadow: none;
    transition: opacity 0.22s ease;
  }
  body.fts #fts-track {
    transition: background 0.15s;
  }

  /* Slider track — canvas fills remaining width. Borderless. The
     "indent" / recessed-channel cue is painted into the canvas itself
     by drawTimeline's drawIndent option, since inset box-shadows
     would otherwise sit behind the canvas child and never render. */
  #fts-track {
    flex: 1 1 0; min-width: 0;
    height: 40px;
    border-radius: 999px;
    overflow: visible;       /* let event icons + thumb glow extend beyond track */
    position: relative;
    cursor: ew-resize;
    touch-action: none;    /* prevent scroll during drag */
    background: var(--glass-action-bg);
    backdrop-filter: var(--glass-blur-action);
    -webkit-backdrop-filter: var(--glass-blur-action);
    border: 0;
    box-shadow: none;
  }
  #fts-canvas {
    display: block;
    position: absolute;
    top: -6px; left: 0;       /* 6px bleed top/bottom for thumb glow + scale */
    width: 100%;
    height: calc(100% + 12px); /* 38 + 12 = 50px total canvas */
    pointer-events: none;      /* touch events go to track, not canvas */
  }

  /* ── Event row INSIDE the FTS bar ────────────────────────────────────────
     Weather-state glyphs at transition hours, vertically centred in the
     bar so each icon sits at the time it refers to. Ticks dropped — the
     icon's position on the bar IS the connection. Dark drop-shadow halo
     keeps icons legible across the full weather gradient (honey →
     slate). Thumb (z-5) covers icons as it passes; acceptable since the
     playhead is the dominant indicator during a scrub. */
  #fts-events {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    left: 0; right: 0;
    height: 14px;
    pointer-events: none;
    z-index: 3;
  }
  .fts-event {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    display: block;
    color: rgba(255, 244, 224, 0.96);
    filter: drop-shadow(0 0 2px rgba(15, 27, 42, 0.85))
            drop-shadow(0 0 1px rgba(15, 27, 42, 0.85));
    transition: left 320ms cubic-bezier(0.32, 0.72, 0, 1),
                opacity 80ms linear;
  }
  /* Opacity is now driven inline (style.opacity) by _populateFtsEvents:
     within-segment proximity fade — 0 directly under thumb, 1 at segment
     edges, 1 in adjacent segments. */
  .fts-event svg {
    display: block;
    width: 14px;
    height: 14px;
  }
  /* Ticks no longer used — icons live on the bar itself. */
  .fts-event-tick { display: none; }

  /* ── FTS Thumb — lens-glass surface control, matched to #fts-date-btn ──
     Shares the calendar button's glass vocabulary (--glass-action-bg /
     --glass-border / --glass-inset) so the thumb reads as a tier-3
     control flanking the track, not a one-off lens decoration. On
     desktop drag the circle morphs to a thin playhead pill (6px wide),
     letting the underlying sun/weather ramp stay readable while
     scrubbing. Mobile keeps the circle — finger occludes the thumb
     during drag so a thin needle adds no value. */
  /* Rotating-arc glint on the rim. --glint-base-angle is the conic
     gradient START — set by JS from the thumb's track position so the
     bright arc tracks a fixed overhead-centre light source. --glint-
     drift-angle is a small idle wobble. Effective angle = base + drift. */
  @property --glint-base-angle  { syntax: '<angle>'; inherits: false; initial-value: -30deg; }
  @property --glint-drift-angle { syntax: '<angle>'; inherits: false; initial-value: 0deg;   }

  #fts-thumb {
    position: absolute;
    top: 50%;
    left: 50%;               /* JS overrides on every frame */
    width: 32px;
    height: 32px;
    border-radius: 50%;
    /* pointer-events stays auto so e.target on a thumb-touch is the
       thumb itself — the FTS pointerdown handler uses that to
       distinguish "grab the thumb" from "drag the panel via FTS". */
    z-index: 5;

    --glint-base-angle: -30deg;
    --glint-drift-angle: 0deg;
    --glint-angle: calc(var(--glint-base-angle) + var(--glint-drift-angle));

    background: var(--glass-action-bg);
    backdrop-filter: var(--glass-blur-action);
    -webkit-backdrop-filter: var(--glass-blur-action);

    /* Venue-card-inspired rim — soft blue-grey perimeter so the lens
       silhouette reads consistently against any band, without an
