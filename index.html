<script>
  // ── Viewport tracker — single source of truth for visible height ─────────
  // Exposes --app-h (CSS variable) = the visible viewport height in px.
  // Why we need this:
  //   - 100vh is broken on iOS Safari (includes URL bar)
  //   - 100dvh is unreliable on PWA cold-start (the home-indicator zone
  //     isn't always accounted for at first paint)
  //   - 100svh is "the small viewport" but doesn't update when the URL
  //     bar collapses/expands
  //   - window.innerHeight is wrong on iOS when the keyboard is up
  // window.visualViewport.height is the only measurement that reflects
  // the actually-visible area across iOS Safari, iOS Chrome WebView PWA,
  // Android Chrome PWA, and desktop. Use var(--app-h, 100svh) in CSS;
  // the 100svh fallback applies if JS hasn't set it yet.
  //
  // Probe pattern: set immediately, again on visualViewport/window
  // resize + orientationchange, AND after short delays — iOS PWA cold-
  // starts report stale values until the WebView's chrome-area
  // measurements settle.
  (function () {
    var html = document.documentElement;
    function set() {
      var vvh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
      var ih  = window.innerHeight || vvh;
      if (vvh && vvh > 0) html.style.setProperty('--app-h', vvh + 'px');
      // --app-bottom-inset: the gap between the layout viewport (window
      // innerHeight) and the visual viewport (visualViewport.height).
      // On iOS PWA standalone this is the home-indicator gesture zone +
      // anything else iOS reserves. position: fixed elements with
      // bottom: 0 anchor to the layout viewport, which puts them BELOW
      // the visible area on iOS PWA. Using bottom: var(--app-bottom-
      // inset) pulls them up to the visual viewport bottom — fully
      // visible, no clipping behind the home indicator. Safari + Chrome
      // browser: gap is 0 → no offset. Android PWA: gap is 0 → no offset.
      var gap = Math.max(0, ih - vvh);
      html.style.setProperty('--app-bottom-inset', gap + 'px');
    }
    set();
    window.addEventListener('resize', set, { passive: true });
    window.addEventListener('orientationchange', set, { passive: true });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', set, { passive: true });
      window.visualViewport.addEventListener('scroll', set, { passive: true });
    }
    // Cold-start probes — iOS PWAs commonly report visualViewport.height
    // a few px short on the first tick. Re-probing after layout settles
    // gives the correct value without making the user wait.
    [60, 180, 500, 1200].forEach(function (d) { setTimeout(set, d); });
  })();
</script>

<script>
  // Register the service worker at boot so offline support and the
  // CACHE_VERSION rollover machinery work for every visitor — not only
  // the subset that enables push notifications. Push code in js/push.js
  // still calls register('/sw.js') itself; the second call is a no-op
  // and returns the same registration. Skip inside Capacitor (WebView
  // origin is capacitor://localhost — no SW needed, and registering can
  // log noisy errors).
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>

        </div>
        <div id="edit-action-row">
          <button id="edit-action-btn" class="primary-pill" onclick="onEditActionBtn()">Ser bra ut</button>
          <button id="edit-cancel-btn" class="ghost-link" onclick="cancelEditMode()">Avbryt</button>
        </div>
      </div>
    </div>

    <!-- MAP TOAST -->
    <div id="map-toast"></div>

  </div>

  <!-- Top strip — replaces the legacy #floating-search bar. Avatar +
       inbox + date+weather sentence + search button. -->

  <div id="top-strip" class="intro-hidden" role="toolbar" aria-label="App controls">
    <div class="ts-left">
      <button class="ts-btn ts-avatar" id="ts-avatar-btn" onclick="toggleProfilePanel(event)" title="Profil" aria-label="Profil"></button>
      <button class="ts-btn" id="ts-bell-btn" title="Innboks" aria-label="Innboks"
              onclick="toggleBellDropdown(event)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/>
          <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
        </svg>
        <span class="ts-bell-dot" id="ts-bell-dot" style="display:none"></span>
      </button>
    </div>
    <div class="ts-center" id="ts-center">
      <button class="ts-date" id="ts-date-btn" onclick="toggleQcPanel('date')" aria-label="Velg dato" type="button">
        <span id="ts-date-label">I dag</span>
        <svg class="ts-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>
      <span class="ts-wx-icon" id="ts-wx-icon">☀️</span>
      <span class="ts-meta ts-temp" id="ts-temp">13°</span>
      <span class="ts-dot ts-wind-dot">·</span>
      <span class="ts-meta ts-wind" id="ts-wind">💨 4 m/s</span>
    </div>
    <div class="ts-right">
      <button class="ts-btn" id="ts-search-btn" title="Søk" aria-label="Søk"
              onclick="enterSearchMode()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
      </button>
    </div>
    <!-- Search-mode contents — shown when #top-strip has .searching.
         #venue-search is the same element the existing search logic
         is wired to; relocated from #floating-search. -->
    <div class="ts-search-input" aria-hidden="true">
      <span class="ts-search-input-icon" aria-hidden="true">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="8.5" cy="8.5" r="5.5"/><line x1="13" y1="13" x2="18" y2="18"/>
        </svg>
      </span>
      <input type="text" id="venue-search"
             placeholder="Søk etter steder eller områder…"
             autocomplete="off" aria-label="Søk etter steder eller områder">
      <button class="ts-search-input-close" type="button"
              onclick="exitSearchMode()" aria-label="Lukk søk">✕</button>
    </div>
  </div>

  <!-- Search dropdown — live results, anchored below search bar -->
  <div id="search-dropdown" class="glass-panel"></div>

  <!-- Bell dropdown — compact notifications inbox anchored below the bell.
       Populated by _renderBellDropdown() in js/auth.js from
       _pendingRequests + _planInvites. Social events only. -->
  <div id="bell-dropdown" class="glass-panel"></div>

  <!-- Profile popover — anchored below search bar -->
  <div id="profile-panel" class="glass-panel"></div>


  <!-- Zoom debug helper — admin-only, hidden by default -->
  <div id="zoom-debug" class="floating-card hidden" style="display:none"></div>

  <!-- Bottom-right: zoom jog slider + locate-me button -->
  <div id="zoom-jog" class="intro-hidden" aria-label="Zoom" role="slider" aria-orientation="vertical">
    <div class="zj-track">
      <span class="zj-label zj-plus">+</span>
      <div class="zj-thumb"></div>
      <span class="zj-label zj-minus">&minus;</span>
    </div>
  </div>
  <button id="locate-btn" class="intro-hidden" onclick="locateUser()" title="Gå til min posisjon" aria-label="Gå til min posisjon">
    <!-- Default (user) icon: crosshair / geolocation target -->
    <svg class="locate-icon locate-icon-user" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <circle cx="9" cy="9" r="3" stroke="currentColor" stroke-width="1.8"/>
      <path d="M9 1.5v4M9 12.5v4M1.5 9h4M12.5 9h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <!-- Fit-both icon: two dots connected by a dashed path -->
    <svg class="locate-icon locate-icon-fit" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <circle cx="4"  cy="14" r="2" fill="currentColor"/>
      <circle cx="14" cy="4"  r="2" fill="currentColor"/>
      <path d="M5.5 12.5 Q9 9 12.5 5.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-dasharray="1.4 2.2"/>
    </svg>
    <!-- Venue icon: pin glyph anchoring the place -->
    <svg class="locate-icon locate-icon-venue" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z" stroke="currentColor" stroke-width="2"/>
      <circle cx="12" cy="10" r="3" stroke="currentColor" stroke-width="2"/>
    </svg>
  </button>

  <!-- Top-right brand card — desktop only. Shares the top-strip's glass
       tokens so the two surfaces read as the same chrome plane while
       remaining visually separate (the gap reads as "brand sits to the
       side of the controls", not "brand is inside the toolbar"). Hidden
       on mobile via the media-query rule below — top-strip is tight
       there and the avatar already carries the identity. -->
  <div id="floating-brand" class="intro-hidden">
    <div id="brand-logo"><img src="design/logo-pack-svg/logo-color-2000w.svg" alt="Shades" width="32" height="32" loading="lazy"></div>
    <span id="brand-name">Shades</span>
    <canvas id="sun-compass" width="36" height="36"></canvas>
  </div>


  <!-- Bottom-center: date pill + sun arc + intent presets (hidden — replaced by qc-bar) -->
  <div id="floating-bottom" style="display:none">
    <!-- Date navigation — separate pill above the arc card -->
    <div id="floating-date">
      <!-- Calendar dropdown (opens upward) -->
      <div id="date-calendar"></div>
      <div id="arc-date-nav">
        <button class="day-nav-btn" onclick="advanceDay(-1)">‹</button>
        <button id="date-display-btn" onclick="toggleDateCalendar()">—</button>
        <button class="day-nav-btn" onclick="advanceDay(1, 12)">›</button>
      </div>
      <!-- Current weather strip -->
      <div id="date-wx-strip" style="display:none"></div>
      <!-- Hidden native input — value source for all existing code -->
      <input type="date" id="date-picker" style="display:none">
    </div>
    <div class="floating-card">
      <!-- Sun arc canvas -->
      <div id="bottom-arc-row">
        <canvas id="sun-curve" onclick="handleSunCurveClick(event)"></canvas>
      </div>
      <!-- Row 3: time preset buttons aligned to arc -->
      <div id="time-presets-row">
        <div id="intent-pill"></div>
        <button class="intent-btn" data-intent="now"        onclick="setIntent('now')">Now</button>
        <button class="intent-btn" data-intent="lunch"      onclick="setIntent('lunch')">Lunch</button>
        <button class="intent-btn" data-intent="after-work" onclick="setIntent('after-work')">After work</button>
        <button class="intent-btn" data-intent="evening"    onclick="setIntent('evening')">Evening</button>
      </div>
      <!-- Hidden time input — keeps the rest of the app working unchanged -->
      <input type="range" id="time-from" min="4" max="23" step="0.0833333" value="10" style="display:none">
      <span id="time-display-from" style="display:none"></span>
      <div id="time-range-wrap" style="display:none">
        <div id="time-range-sun-bg"></div>
      </div>
      <button id="now-btn" onclick="toggleNowMode()" style="display:none">Now</button>
    </div>
  </div>

  <!-- Panel reveal button — shown when sidebar is hidden -->
  <button id="panel-reveal-btn" onclick="togglePanel()" title="Show sidebar">›</button>

  <!-- Toast notice (qc-wrap kept for qc-notice toasts) -->
  <div id="qc-wrap" class="intro-hidden">
    <div id="qc-notice"></div>
  </div>

  <!-- RIGHT DETAIL PANEL — opens when a venue is selected -->
  <div id="detail-panel" class="glass-panel fts-host">
    <div id="dp-handle" onclick="closeDetailPanel()">
      <div id="dp-handle-pill"></div>
    </div>
    <div id="dp-content"></div>
  </div>

  <!-- Calendar float — positioned above the FTS, opened by the FTS date button.
       Lives OUTSIDE #panel so it escapes the panel's transform context. -->
  <div id="ptb-cal-float" role="dialog" aria-modal="true" aria-label="Velg dato">
    <div id="ptb-cal-header">
      <span id="ptb-cal-title">Velg dato</span>
      <button id="ptb-cal-close" onclick="_closeQcPanel()" aria-label="Lukk">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/></svg>
      </button>
    </div>
    <div id="qc-panel">
      <div id="qc-panel-inner">
        <div id="qc-date-section">
          <div id="qc-cal"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- LEFT PANEL — venue list, floats below search bar -->
  <div id="panel" class="intro-hidden glass-panel fts-host">
    <div id="panel-handle">
      <div id="panel-handle-pill"></div>
    </div>

    <!-- Time slider — relocated INSIDE the panel header (Stage 2b). The
         date button is gone; the top-strip date link is the single date
         picker entry point. -->
    <div id="fts">
      <div id="fts-track">
        <canvas id="fts-canvas"></canvas>
        <div id="fts-events" aria-hidden="true"></div>
        <div id="fts-thumb" aria-hidden="true"></div>
        <div id="fts-popup" class="fts-popup">
          <div class="fts-popup-row fts-popup-primary">
            <span id="fts-popup-time" class="fts-popup-time"></span>
            <span id="fts-popup-wx-icon" class="fts-popup-wx-icon" aria-hidden="true"></span>
          </div>
          <div class="fts-popup-row fts-popup-secondary">
            <span id="fts-popup-temp" class="fts-popup-temp"></span>
            <span class="fts-dot">·</span>
            <span id="fts-popup-wind" class="fts-popup-wind"></span>
            <span id="fts-popup-closed-label" class="fts-popup-closed-label"></span>
          </div>
          <svg id="fts-popup-tail" aria-hidden="true" preserveAspectRatio="none">
            <defs>
              <!-- 135° gradient mirrors --glass-card-bg's overlay layer
                   so the tail and popup body share the same blue-tinted
                   diagonal at the join. Without this the tail reads as a
                   darker shade because the popup gradient adds a lift the
                   solid fill missed. -->
              <linearGradient id="fts-tail-overlay" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%"   stop-color="rgb(26,44,66)"  stop-opacity="0.36"/>
                <stop offset="100%" stop-color="rgb(58,92,130)" stop-opacity="0.22"/>
              </linearGradient>
            </defs>
            <polygon class="tail-base"    points="0,0 14,0 7,10"/>
            <polygon class="tail-overlay" points="0,0 14,0 7,10"/>
            <polyline                     points="0,0 7,10 14,0" fill="none"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Day header — unified 2-row composition.
         Row 1: date (tappable) · weather · wind · sort
         Row 2: city-wide sun outlook — always present.
         No chip borders — flows as one block, not stacked controls. -->
    <div id="day-header">
      <div id="list-sun-header" class="dh-row1">
        <button id="header-date-chip" class="dh-date" onclick="toggleQcPanel('date')" aria-label="Velg dato">
          <svg class="chip-cal-icon" width="14" height="14" viewBox="0 0 16 16" fill="none">
            <rect x="1.5" y="3" width="13" height="11.5" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <line x1="1.5" y1="6.5" x2="14.5" y2="6.5" stroke="currentColor" stroke-width="1.5"/>
            <line x1="5" y1="1.5" x2="5" y2="4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="11" y1="1.5" x2="11" y2="4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span id="header-date-label"></span>
        </button>
        <span class="dh-sep" aria-hidden="true">·</span>
        <span id="header-wx-chip" class="dh-weather" role="status" aria-live="polite">
          <span id="header-wx-icon" aria-hidden="true"></span>
          <span id="header-wx-temp"></span>
          <span class="dh-sep dh-sep-mid" aria-hidden="true">·</span>
          <span id="header-wx-wind"></span>
        </span>
      </div>
      <div id="sun-section-bar" class="dh-outlook" aria-live="polite">
        <span class="ssb-text"></span>
        <button id="sun-empty-cta" type="button" aria-label="Pick another day">
          <span class="sun-empty-cta-label"></span>
        </button>
        <button id="sort-toggle-btn" class="sort-icon-btn" onclick="toggleSortPanel()" aria-label="Sortér" title="Sortér">
          <svg class="sort-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="6"  y1="5"  x2="6"  y2="19"/>
            <polyline points="3 15 6 19 9 15"/>
            <line x1="14" y1="6"  x2="20" y2="6"/>
            <line x1="14" y1="12" x2="18" y2="12"/>
            <line x1="14" y1="18" x2="16" y2="18"/>
          </svg>
          <span id="sort-label" class="sort-icon-label-sr">Mest sol</span>
        </button>
      </div>
    </div>

    <!-- Action row — Stage 2c: filter pills (horizontal scroll) + sort.
         Pills are visual-only for now; clicks toggle the active class.
         Wiring to actual list/pin filtering happens in a follow-up. -->
    <div id="panel-actions">
      <div class="panel-actions-pills">
        <button class="panel-filter-pill" data-filter="cafe"
                onclick="toggleListFilter('cafe', this)">Kafé</button>
        <button class="panel-filter-pill" data-filter="restaurant"
                onclick="toggleListFilter('restaurant', this)">Restaurant</button>
        <button class="panel-filter-pill" data-filter="bar"
                onclick="toggleListFilter('bar', this)">Bar</button>
        <button class="panel-filter-pill" data-filter="sun2h"
                onclick="toggleListFilter('sun2h', this)">2t+ sol</button>
        <!-- Stille (noise) filter intentionally removed for now — venues.json
             carries no noiseScore (the OSM-highway-proximity backfill
             pipeline that populates it hasn't been run). Restore once the
             column is populated; the JS filter implementation lives in
             _passesActiveFilters and is currently dormant. -->
        <button class="panel-filter-pill" data-filter="friends"
                onclick="toggleListFilter('friends', this)">Venner</button>
      </div>
      <button id="panel-actions-sort" onclick="toggleSortPanel()"
              aria-label="Sortér" title="Sortér">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <line x1="6"  y1="5"  x2="6"  y2="19"/>
          <polyline points="3 15 6 19 9 15"/>
          <line x1="14" y1="6"  x2="20" y2="6"/>
          <line x1="14" y1="12" x2="18" y2="12"/>
          <line x1="14" y1="18" x2="16" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Venue peek: first card preview visible in collapsed state -->
    <div id="venue-peek"></div>

    <div id="venue-list"></div>
  </div>

  <!-- Notification toast: outside #panel so position:fixed works on mobile
       (transforms on #panel create a containing block that breaks fixed positioning) -->
  <div id="notif-toast-wrap" role="alert" aria-live="polite"></div>

  <!-- Sort panel: fixed overlay, positioned by JS from button origin -->
  <div id="sort-panel" class="glass-panel">
    <button class="sort-btn active" data-sort="match"     onclick="setSortBy('match')">Beste treff</button>
    <button class="sort-btn"        data-sort="score"     onclick="setSortBy('score')">Mest sol</button>
    <button class="sort-btn"        data-sort="distance"  onclick="setSortBy('distance')">Avstand</button>
    <button class="sort-btn"        data-sort="beer"      onclick="setSortBy('beer')">Ølpris</button>
    <button class="sort-btn"        data-sort="favorites" onclick="setSortBy('favorites')">Favoritter</button>
  </div>

  <!-- (FTS markup moved inside #panel; see Stage 2b.) -->
</div>

</body>
</html>
