    font-size: 20px;
    font-weight: 700;
    line-height: 1.2;
  }
  .detail-new-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
  }
  .detail-new-back {
    padding: 6px 8px;
    background: none;
    border: none;
    font-size: 18px;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .detail-new-back:hover { color: var(--text); }
  .detail-header-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .dp-header-icon {
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px;
    color: var(--muted);
    line-height: 0;
    opacity: 0.75;
    transition: opacity 0.15s;
  }
  .dp-header-icon:hover { opacity: 1; }
  .dp-header-icon.active { opacity: 1; }

  /* ── Detail panel action row (directions + utilities) ────────────────────── */
  /* Aligned with the Shades design system's "Secondary Square" spec:
     48×48 rounded squares (radius 12), glass-action fill, --muted at rest,
     --accent-dim background + --accent color when toggled on. The row
     spans the full panel width — the two most-used utilities (directions,
     share) flex to absorb extra space, while toggle-state squares
     (heart, bell, optional phone/website) stay 48×48. The result lines
     up flush with the Invite friends CTA above. */
  .dp-action-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .dp-action-cta {
    flex: 1;
    height: 44px;
    border-radius: 999px;
    background: var(--accent);
    border: none;
    color: var(--accent-on, #2a1a0c);
    font-size: 14px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }
  .dp-action-cta:hover { opacity: 0.9; }
  .dp-action-cta svg { width: 18px; height: 18px; stroke: currentColor; }

  /* Secondary Square — design-system canonical icon-only utility button.
     Default reads quiet (muted color), hover lifts to text, active state
     swaps to accent-dim background + accent so heart/bell read on without
     dominating the row. */
  .dp-action-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(20,46,82,0.25) 0%, rgba(32,73,131,0.14) 100%), rgba(20,46,82,0.30);
    border: 1px solid rgba(156,189,231,0.20);
    box-shadow:
      inset 0 1px 0 rgba(255,242,235,0.14),
      inset 0 -1px 0 rgba(20,46,82,0.30),
      0 2px 8px rgba(0,0,0,0.35);
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    text-decoration: none;
    transition: all 120ms ease-out;
  }
  .dp-action-icon:hover {
    background: linear-gradient(135deg, rgba(20,46,82,0.35) 0%, rgba(32,73,131,0.22) 100%), rgba(20,46,82,0.42);
    border-color: rgba(156,189,231,0.32);
    color: var(--text);
  }
  .dp-action-icon svg { width: 20px; height: 20px; stroke: currentColor; color: currentColor; }

  /* Labeled directions pill — same glass-action treatment as the squares
     but pill-shaped with an inline label so the most-used utility action
     fills the row width and surfaces the walk time inline. The remaining
     buttons (share, heart, bell, optional phone/website) stay as 48×48
     squares — pill vs square is the row's "labeled vs icon-only" cue. */
  .dp-action-pill {
    flex: 1;
    min-width: 0;
    height: 48px;
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(20,46,82,0.25) 0%, rgba(32,73,131,0.14) 100%), rgba(20,46,82,0.30);
    border: 1px solid rgba(156,189,231,0.20);
    box-shadow:
      inset 0 1px 0 rgba(255,242,235,0.14),
      inset 0 -1px 0 rgba(20,46,82,0.30),
      0 2px 8px rgba(0,0,0,0.35);
    color: var(--text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 18px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    transition: all 120ms ease-out;
  }
  .dp-action-pill svg { width: 20px; height: 20px; stroke: currentColor; flex-shrink: 0; }
  .dp-action-pill-label {
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dp-action-pill:hover {
    background: linear-gradient(135deg, rgba(20,46,82,0.35) 0%, rgba(32,73,131,0.22) 100%), rgba(20,46,82,0.42);
    border-color: rgba(156,189,231,0.32);
    color: var(--accent);
  }
  .dp-action-icon.is-active {
    background: var(--accent-dim);
    border-color: rgba(255,175,133,0.35);
    color: var(--accent);
  }
  .dp-action-icon.is-active svg { color: var(--accent); fill: currentColor; }
  .dp-action-icon.is-active:hover {
    background: var(--accent-dim);
    border-color: rgba(255,175,133,0.5);
  }

  /* Legacy: keep .primary-action for backwards compat but hidden */
  .primary-action {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }

  .btn-primary {
    flex: 1;
    background: var(--accent);
    color: #2a1a0a;
    padding: 14px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: none;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-variant-numeric: tabular-nums;
  }

  .btn-primary:hover {
    opacity: 0.9;
  }

  .btn-icon-sec {
    width: 48px;
    height: 48px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    text-decoration: none;
  }

  .btn-icon-sec:hover {
    background: rgba(20,46,82,0.65);
  }

  .btn-icon-sec svg,
  .btn-primary svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    color: var(--accent);
  }

  /* ── Photo gallery wrapper + heart/bell overlay ──────────────────────── */
  .detail-new-photos-wrap {
    position: relative;
  }
  .dp-photo-actions {
    position: absolute;
    top: 8px;
    right: 8px;
    display: flex;
    gap: 6px;
    z-index: 3;
  }
  .dp-photo-actions .dp-header-icon {
    width: 36px;
    height: 36px;
    padding: 0;
    border-radius: 50%;
    background: rgba(14,26,52,0.55);
    backdrop-filter: blur(8px) saturate(160%);
    -webkit-backdrop-filter: blur(8px) saturate(160%);
    border: 1px solid rgba(156,189,231,0.22);
    color: var(--text);
    opacity: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dp-photo-actions .dp-header-icon svg { width: 18px; height: 18px; }

  /* ── First-photo "friends here" chip overlay ─────────────────────────── */
  /* Wrapper inherits the photo's flex-item geometry so the surrounding
     scroller layout is unchanged; the chip absolute-positions inside. */
  .dp-photo-wrap {
    position: relative;
    flex-shrink: 0;
    height: 100%;
    min-width: 240px;
    max-width: 280px;
    aspect-ratio: 4/3;
    border-radius: 10px;
    overflow: hidden;
  }
  .dp-photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    /* Cancel the scroller-flex sizing — wrapper carries it. */
    min-width: 0 !important;
    max-width: none !important;
    aspect-ratio: auto !important;
    border-radius: inherit;
  }
  .photo-overlay-chip {
    position: absolute;
    bottom: 8px;
    left: 8px;
    z-index: 3;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px 5px 5px;
    border-radius: 999px;
    background: rgba(14, 26, 52, 0.78);
    backdrop-filter: blur(8px) saturate(160%);
    -webkit-backdrop-filter: blur(8px) saturate(160%);
    border: 1px solid rgba(156, 189, 231, 0.25);
    color: var(--text);
    font-size: 11px;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    pointer-events: none;
  }
  .photo-overlay-chip span { white-space: nowrap; }

  /* ── Friends-in-sun card (replaces .social-friends row) ──────────────── */
  .friends-photo-chip-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 14px;
    background:
      linear-gradient(135deg, rgba(255,175,133,0.18) 0%, rgba(255,175,133,0.08) 100%),
      rgba(20, 46, 82, 0.42);
    border: 1px solid rgba(255,175,133,0.42);
    box-shadow:
      inset 0 1px 0 rgba(255,242,235,0.15),
      0 4px 14px rgba(0,0,0,0.25);
  }
  .friends-photo-chip-row .chip-summary {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    min-width: 0;
  }
  .friends-photo-chip-row .chip-text { min-width: 0; flex: 1; }
  .friends-photo-chip-row .chip-title {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .friends-photo-chip-row .chip-sub {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    margin-top: 2px;
  }

  /* Avatar row used by both the photo chip and the friends card */
  .avatar-row { display: inline-flex; }
  .avatar-row .avatar {
    border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(20, 46, 82, 0.95);
    margin-left: -6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    object-fit: cover;
    flex-shrink: 0;
    color: #2a1a0c;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
  }
  .avatar-row .avatar:first-child { margin-left: 0; }
  .avatar-row.sm .avatar { margin-left: -4px; }
  .avatar-row .avatar.avatar-overflow {
    background: #142E52;
    color: var(--text);
  }

  /* ── Detail-panel "card": same DOM as a venue-card, scaled up ────────── */
  /* The layout (card-top → card-left + card-right + timeline) is identical to
     a venue-card — only sizes scale up. This keeps the user oriented after the
     morph: they see "the same card, bigger". */
  /* Detail-panel card: hybrid of compact list card (name+meta+v2 pills with
     anchor meta) plus the rich timeline bar at the bottom — no fill bar. */
  .dp-card {
    cursor: default;
    margin-bottom: 14px;
    padding: 16px 16px 14px;
    animation: none;
    border-radius: 14px;
    overflow: visible;  /* re-allow timeline to render outside compact's clip */
  }
  .dp-card.card-compact { padding-bottom: 14px; overflow: visible; }
  .dp-card.card-compact .card-fillbar { display: none; }
  .dp-card:hover { background: var(--glass-card-bg); }   /* kill list-card hover */
  .dp-card .card-top { gap: 14px; align-items: flex-start; }
  .dp-card .card-left { min-width: 0; gap: 4px; }
  .dp-card .card-new-name {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.22;
    letter-spacing: -0.01em;
  }
  .dp-card .card-new-meta {
    font-size: 12px;
    line-height: 1.35;
    margin-top: 3px;
  }
  .dp-card .card-right {
    min-width: 0;
    flex-shrink: 0;
    gap: 3px;
    align-items: flex-end;
  }
  .dp-card .card-new-hero-main {
    font-size: 16px;
    line-height: 1.22;
  }
  .dp-card .card-new-hero-sub  {
    font-size: 12px;
    line-height: 1.35;
    margin-top: 1px;
  }
  /* Timeline block sits at the bottom — same shipped sun-bar as before. */
  .dp-card .card-timeline-block { margin-top: 12px; }

  /* dp-card timeline matches the list card's thin variant (8px). The tall
     38px treatment is gone now that the FTS pill is no longer reparented
     into the card. */

  /* Reserves layout space in the panel before openDetailPanel replaces
     it with a freshly-rendered .dp-card. Height matches a typical .dp-card
     (card-top ~50 + card-timeline 8 + small margin + padding 18+14). */
  .dp-card-slot {
    height: 100px;
    margin-bottom: 14px;
    position: relative;
  }

  /* Sol-retning section */

  /* Info rows (busyness, noise, hours) — open layout, no heavy box */
  .info-list {
    margin-bottom: 14px;
  }

  .info-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 4px;
    border-bottom: 1px solid rgba(156,189,231,0.10);
  }

  .info-row:last-child {
    border-bottom: none;
  }

  .info-icon {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    flex-shrink: 0;
    opacity: 0.85;
  }

  .info-icon svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    color: var(--accent);
  }

  .info-label {
    flex: 1;
    font-size: 14px;
  }

  .info-label-strong {
    font-weight: 600;
    color: var(--text);
  }

  .info-label-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .info-value {
    color: var(--accent);
    font-size: 13px;
    font-weight: 500;
    text-align: right;
  }

  /* Footer buttons — text links, low visual weight */
  .secondary-row {
    display: flex;
    gap: 18px;
    justify-content: center;
    padding: 14px 0 16px;
    margin-top: 4px;
  }

  .secondary-link {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    padding: 4px 0;
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    opacity: 0.75;
    transition: opacity 0.15s, color 0.15s;
  }

  .secondary-link:hover {
    opacity: 1;
    color: var(--text);
  }

  @media (max-width: 639px) {
    #detail-panel {
      position: fixed;  /* fixed avoids parent height issues; bottom:0 anchors to visual viewport */
      top: auto;
      left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 62svh;    /* svh = small viewport height; lowered from 69svh to make room for floating pill */
      max-height: none;
      border-radius: 20px 20px 0 0;
      border-left: none; border-right: none; border-bottom: none;
      transform: translateY(100%) translateZ(0);
      opacity: 1;
      z-index: 920;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), height 0.3s ease, border-radius 0.3s ease;
      will-change: transform, height;
      backface-visibility: hidden;
    }
    #detail-panel.open { transform: translateY(0); }
    #detail-panel.dp-fullscreen {
      height: 100svh;
      border-radius: 0;
    }

    #dp-handle { display: flex; }
    #dp-scroll { padding-top: 4px; }
    .dp-photos { margin-top: 0; }
    /* Back button style on mobile: chevron + "Venues" */
    #dp-close-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      background: rgba(156,189,231,0.1);
      border: 1px solid rgba(156,189,231,0.2);
      border-radius: 8px;
      padding: 5px 10px;
      width: auto;
      height: auto;
    }
    #dp-close-btn::before { content: '‹'; font-size: 16px; line-height: 1; }
    .dp-close-x    { display: none; }
    .dp-close-back { display: inline; }
    .dp-venue-name { font-size: 22px; }
    #dp-scroll { overflow-y: auto; }
  }

  /* ── Intro splash overlay ─────────────────────────────────────────────────── */
  #splash {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 9997;
    background: #FFDDCA;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    transition: background-color 0.5s ease;
    pointer-events: all;
    cursor: default;
  }
  #splash.bg-out {
    background-color: transparent;
    pointer-events: none;
  }
  #splash.done {
    pointer-events: none;
    visibility: hidden;
  }
  #splash-logo {
    width: 160px;
    height: auto;
    transition: opacity 0.4s ease;
  }
  #splash-logo.fade-out {
    opacity: 0;
  }
  #splash-loader {
    width: 28px;
    height: 28px;
    border: 2.5px solid rgba(255,175,133,0.3);
    border-top-color: #FFAF85;
    border-radius: 50%;
    animation: splash-spin 0.8s linear infinite;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #splash-loader.visible {
    opacity: 1;
  }
  #splash-loader.fade-out {
    opacity: 0;
  }
  @keyframes splash-spin {
    to { transform: rotate(360deg); }
  }

  /* Elements hidden during intro sequence */
  .intro-hidden {
    opacity: 0;
    pointer-events: none !important;
  }

  /* ── Sliding surfaces — will-change only on panels that translate ────────── */
  /* No will-change: backdrop-filter anywhere — it bloats GPU memory.          */
  #detail-panel, #ptb-cal-float { will-change: transform; }
  @media (max-width: 639px) {
    #panel { will-change: transform; }
  }

  /* ── Performance & accessibility — reduced transparency ─────────────────── */
  @media (prefers-reduced-transparency: reduce) {
    .glass-panel, .glass-card, .glass-action,
    #panel, #detail-panel, #search-dropdown,
    #profile-panel, #sort-panel, #hover-tooltip, #map-toast,
    #app-toast, .venue-card, .floating-card, .mapboxgl-popup-content,
    #qc-panel-inner, #edit-banner {
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      background: rgba(17, 30, 56, 0.97);
    }
  }

  /* ── Favorites heart button (card) ──────────────────────────────────────── */
  /* Passive heart indicator on venue card name */
  .card-fav-heart {
    margin-left: 4px;
    vertical-align: -1px;
    flex-shrink: 0;
  }

  /* (fav-filter-pill removed — favorites is now a sort mode) */

  /* (fav + bell buttons moved to .dp-header-icon) */

  /* ── Toast notification ─────────────────────────────────────────────────── */
  #app-toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(17,30,56,0.95);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 18px;
    border-radius: 12px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 9999;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  #app-toast.show, #app-toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── Social section (check-in, plans) ───────────────────────────────────── */
  /* No glass wrapper — sits directly on the panel so the dp-card stays the focal box. */
  .social-card {
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* Primary CTA — Invite friends. Tracks the design-system Primary Pill spec
     (44h, 999r, accent fill, 14/700, base shadow + hover lift). The full-
     width treatment is the only adaptation: the canonical pill is inline,
     but the detail panel uses the row exclusively for this single CTA, so
     stretching to 100% reads as "this is THE action" without needing extra
     visual weight. "I'm here" semantics live inside the invite sheet's time
     picker (±30 min of now → message + presence flip). */
  .dp-invite-cta {
    width: 100%;
    height: 44px;
    border-radius: 999px;
    background: var(--accent);
    border: none;
    color: var(--accent-on, #2a1a0c);
    font-size: 14px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    transition: all 120ms ease-out;
  }
  .dp-invite-cta:hover {
    background: #FFC49A;
    box-shadow: 0 6px 24px rgba(0,0,0,0.50);
  }
  .dp-invite-cta:active {
    background: #F09060;
    box-shadow: none;
    transform: translateY(1px);
  }
  .dp-invite-cta svg { flex-shrink: 0; stroke: currentColor; }

  /* Legacy social-btns kept for any other callers — but the detail-panel
     no longer renders them. Safe to remove if nothing else references. */
  .social-btns { display: none; }

  /* ── Plan conflict confirm dialog ───────────────────────────────────────── */
  /* Sits above the invite sheet (z-index higher than .dpinvite-backdrop) when
     the user is about to create a plan within ±3h of an existing one. Three
     choices: merge, send separate, cancel. */
  .plan-conflict-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(7, 16, 32, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10001;
    opacity: 0;
    transition: opacity 0.18s ease;
    padding: 20px;
  }
  .plan-conflict-backdrop.open { opacity: 1; }
  .plan-conflict-dialog {
    width: 100%;
    max-width: 340px;
    border-radius: 18px;
    padding: 20px 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transform: translateY(8px) scale(0.98);
    transition: transform 0.22s ease;
  }
  .plan-conflict-backdrop.open .plan-conflict-dialog {
    transform: translateY(0) scale(1);
  }
  .plan-conflict-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.25;
  }
  .plan-conflict-body {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.45;
  }
  .plan-conflict-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 4px;
  }
  .plan-conflict-btn {
    width: 100%;
    height: 42px;
    border-radius: 999px;
    border: 1px solid rgba(156,189,231,0.22);
    background: linear-gradient(135deg, rgba(20,46,82,0.25), rgba(32,73,131,0.14)), rgba(20,46,82,0.30);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .plan-conflict-btn:hover { border-color: var(--accent); color: var(--accent); }
  .plan-conflict-btn.plan-conflict-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-on, #2a1a0c);
  }
  .plan-conflict-btn.plan-conflict-primary:hover { opacity: 0.92; color: var(--accent-on, #2a1a0c); }
  .plan-conflict-btn.plan-conflict-cancel {
    background: none;
    border: none;
    color: var(--muted);
    font-weight: 500;
  }
  .plan-conflict-btn.plan-conflict-cancel:hover { color: var(--text); }

  /* Friends row inside social card */
  .social-friends {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .social-friends-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    white-space: nowrap;
  }
  .social-friends-avatars {
    display: flex;
    gap: -4px;
  }
  .social-avatar {
    width: 26px; height: 26px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(20,46,82,0.8);
    margin-left: -6px;
  }
  .social-avatar:first-child { margin-left: 0; }
  .social-avatar-init {
    background: rgba(20,46,82,0.6);
    color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 600;
  }

  /* Plan items in detail panel */
  .detail-plan-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
    border-top: 1px solid rgba(156,189,231,0.08);
  }
  .plan-info { display: flex; flex-direction: column; gap: 2px; }
  .plan-when { font-size: 12px; color: var(--accent); font-weight: 600; }
  .plan-creator { font-size: 11px; color: var(--muted); }
  .plan-msg { font-size: 11px; color: var(--text); opacity: 0.7; }
  .plan-actions { display: flex; gap: 6px; }
  .plan-status { font-size: 11px; color: var(--muted); }
  .btn-accept {
    padding: 4px 12px;
    background: rgba(255,175,133,0.14);
    border: 1px solid var(--accent);
    border-radius: 8px;
    color: var(--accent);
    font-size: 11px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .btn-decline {
    padding: 4px 12px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 11px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }

  /* Social form overlay (shown inside social card) */
  .social-form-overlay {
    border-top: 1px solid rgba(156,189,231,0.12);
    padding-top: 10px;
  }
  .social-form-inner {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .social-form-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.5px;
  }
  .social-form-input {
    width: 100%;
    padding: 8px 10px;
    background: rgba(20,46,82,0.5);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    box-sizing: border-box;
  }
  .social-form-input:focus { outline: none; border-color: var(--accent); }
  .social-form-actions {
    display: flex;
    gap: 8px;
  }
  .social-form-btn {
    flex: 1;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid rgba(156,189,231,0.20);
    background: linear-gradient(135deg, rgba(20,46,82,0.25), rgba(32,73,131,0.14)), rgba(20,46,82,0.30);
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.15s;
  }
  .social-form-btn:hover { border-color: var(--accent); color: var(--accent); }
  .social-form-btn svg { flex-shrink: 0; }
  .social-form-btn-accent {
    background: rgba(255,175,133,0.12);
    border-color: rgba(255,175,133,0.30);
    color: var(--accent);
  }
  .social-form-btn-accent:hover { background: rgba(255,175,133,0.20); }

  .plan-friends-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 120px;
    overflow-y: auto;
  }
  .plan-friend-check {
    font-size: 12px;
    color: var(--text);
    display: flex; align-items: center; gap: 6px;
    cursor: pointer;
  }
  .plan-friend-check input { accent-color: var(--accent); }

  /* Going friend picker */
  .going-friend-picker {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .friends-empty {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    padding: 8px;
  }
  .friend-avatar-sm {
    width: 18px; height: 18px;
    border-radius: 50%;
    object-fit: cover;
    vertical-align: -3px;
  }
  .friend-avatar-sm-init {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(20,46,82,0.6);
    color: var(--muted);
    font-size: 9px;
    font-weight: 600;
  }

  /* ── Invite sheet — sharing-system (.dpinvite-*) ──────────────────────────
     Bottom sheet for outgoing invites. Layout-only here — buttons / chips /
     surfaces all use the design-system primitives (.p-pill, .s-circ,
     .chip-pill, .card, .glass-action). IDs preserved (#invite-sheet,
     #invite-sheet-backdrop) for legacy callers. */
  .invite-backdrop,
  .dpinvite-backdrop {
    position: fixed;
    inset: 0;
    z-index: 1100;
    background: rgba(0,0,0,0);
    transition: background 0.3s ease;
  }
  .invite-backdrop.open,
  .dpinvite-backdrop.open { background: rgba(0,0,0,0.42); }

  /* Slide the underlying surfaces down out of view so the user focuses on the
     sheet sliding up. Convention: closing panels always slide DOWN, even when
     another panel is sliding UP behind them. The FTS stays visible — it's the
     canonical time control and gets repositioned above the sheet (see rule
     below) so the user can scrub to preview weather/sun across the day while
     picking recipients. */
  body.invite-sheet-open #detail-panel,
  body.invite-sheet-open #panel {
    transform: translateY(calc(100% + 24px));
    opacity: 0;
    pointer-events: none;
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.22s ease;
  }
  body.invite-sheet-open #qc-wrap,
  body.invite-sheet-open #floating-search,
  body.invite-sheet-open #floating-brand {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
  }
  /* Lift the FTS to sit just above the share sheet. --dpinvite-sheet-h is
     written on document root by _openInviteSheet via a ResizeObserver.
     Stack: sheet (h) → 8px gap → FTS (38px) → 10px gap → callout (this
     bottom + ~58px). */
  body.invite-sheet-open #fts {
    bottom: calc(var(--dpinvite-sheet-h, 320px) + 8px) !important;
    z-index: 1102; /* above the sheet (1100) + top chip (1101) */
  }
  /* The FTS popup (existing tooltip) is replaced by .dpinvite-fts-callout
     during invite-sheet-open. Hide the old popup to avoid duplicate UI. */
  body.invite-sheet-open #fts-popup {
    opacity: 0 !important;
    pointer-events: none !important;
  }

  .dpinvite-sheet {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    max-height: 78svh;
    height: auto;
    border-radius: 20px 20px 0 0;
    background: var(--glass-panel-bg);
    backdrop-filter: var(--glass-blur-panel);
    -webkit-backdrop-filter: var(--glass-blur-panel);
    border: none;
    box-shadow: var(--glass-inset), 0 6px 24px rgba(0,0,0,0.50);
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .dpinvite-sheet.open { transform: translateY(0); }

  /* Drag handle wrapper — matches #panel-handle / #dp-handle padding so
     the tap target is identical across surfaces. JS wires drag-to-dismiss
     onto this wrapper. */
  .dpinvite-handle {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 0 14px;
    flex-shrink: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  .dpinvite-grabber {
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: rgba(156,189,231,0.25);
  }

  /* Top header — full-width glass-action card with venue eyebrow +
     "Når kommer du?" prompt. Lives ABOVE the sheet (separate floating
     surface, not inside the panel) so the user always sees what they're
     setting. No close button: swipe-down on the sheet handle / tap
     backdrop / Esc are the dismissal paths. */
  .dpinvite-top-chip {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    left: 16px;
    right: 16px;
    z-index: 1101;
    transform: translateY(-130%);
    transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
  }
  .dpinvite-top-chip.open { transform: translateY(0); }
  .dpinvite-header {
    pointer-events: auto;
    padding: 12px 16px;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .dpinvite-eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.6px;
    color: var(--muted);
    text-transform: uppercase;
    line-height: 1.2;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .dpinvite-eyebrow svg { color: var(--muted); flex-shrink: 0; }
  .dpinvite-eyebrow span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .dpinvite-venue-name {
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.25;
  }

  .dpinvite-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 4px 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    -webkit-overflow-scrolling: touch;
  }

  /* In-sheet title — symmetric with the top header's "Når drar du?". The
     top asks WHEN, the sheet asks WHO. Same typography (17px / weight 600)
     as .dpinvite-venue-name so the two surfaces read as a paired flow. */
  .dpinvite-section-title {
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.25;
  }

  /* FTS callout — follows the slider thumb above the FTS while the share
     sheet is open. Two-line readout: "Jeg kommer 17:00" / "3t 25m sol · sol
     til 20:25". JS tracks the thumb's viewport x and clamps the callout's
     left edge to a safe gutter so it never overflows the screen. */
  .dpinvite-fts-callout {
    position: fixed;
    /* sheet (h) + 8px FTS-gap + 38px FTS-height + 12px callout-gap. */
    bottom: calc(var(--dpinvite-sheet-h, 320px) + 58px);
    left: 0;
    z-index: 1103;
    pointer-events: none;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 8px 14px;
    border-radius: 14px;
    background: var(--glass-action-bg);
    backdrop-filter: var(--glass-blur-action);
    -webkit-backdrop-filter: var(--glass-blur-action);
    border: var(--glass-border);
    box-shadow: var(--glass-inset), 0 4px 12px rgba(0,0,0,0.35);
    transition: left 80ms ease-out, opacity 0.22s ease, transform 0.22s ease;
    transform: translateY(8px);
    opacity: 0;
    white-space: nowrap;
    font-family: 'Inter', sans-serif;
  }
  .dpinvite-fts-callout.open { opacity: 1; transform: translateY(0); }
  .dpinvite-fts-callout-line1 {
    display: inline-flex; align-items: baseline; gap: 8px;
    font-variant-numeric: tabular-nums;
  }
  .dpinvite-fts-callout-line1 .label {
    font-size: 13px; font-weight: 500; color: var(--muted);
  }
  .dpinvite-fts-callout-line1 .time {
    font-size: 18px; font-weight: 700; color: var(--text);
  }
  .dpinvite-fts-callout-line2 {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .dpinvite-fts-callout-line2.no-sun { color: var(--muted); }
  .dpinvite-fts-callout-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #FFE9D0, #FF7A3A 80%);
    flex-shrink: 0;
  }
  .dpinvite-fts-callout-line2.no-sun .dpinvite-fts-callout-dot {
    background: rgba(156,189,231,0.4);
  }

  /* Group chips strip — uses .chip-pill primitives. */
  .dpinvite-group-chips {
    display: flex; gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* Avatar carousel — horizontal scroll, multi-select, 56px circles.
     Padding-top is 6px so the 5px selection ring isn't clipped by the
     implicit overflow-y from overflow-x: auto. 6px ≥ 5px ring. */
  .dpinvite-avatar-row {
    display: flex; gap: 14px;
    overflow-x: auto;
    padding: 6px 4px;
    margin: 0 -4px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .dpinvite-avatar-row::-webkit-scrollbar { display: none; }
  .dpinvite-avatar {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    width: 64px;
    background: transparent;
    border: 0;
    padding: 0;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .dpinvite-avatar[hidden] { display: none; }
  .dpinvite-avatar-img {
    position: relative;
    width: 56px; height: 56px;
  }
  .dpinvite-avatar-img > img,
  .dpinvite-avatar-init {
    width: 56px; height: 56px;
    border-radius: 50%;
    display: block;
    object-fit: cover;
    transition: box-shadow 0.16s ease-out;
  }
  .dpinvite-avatar-init {
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), inset 0 -1px 0 rgba(0,0,0,0.20);
  }
  .dpinvite-avatar-init.init-color-0 { background: linear-gradient(135deg, #FFB186 0%, #E5754A 100%); }
  .dpinvite-avatar-init.init-color-1 { background: linear-gradient(135deg, #79B0E0 0%, #3F75AC 100%); }
  .dpinvite-avatar-init.init-color-2 { background: linear-gradient(135deg, #98D7A4 0%, #4FA663 100%); }
  .dpinvite-avatar-init.init-color-3 { background: linear-gradient(135deg, #E9B96E 0%, #BA823F 100%); }
  .dpinvite-avatar-init.init-color-4 { background: linear-gradient(135deg, #B89DD9 0%, #8E6DBE 100%); }
  .dpinvite-avatar-init.init-color-5 { background: linear-gradient(135deg, #5DCABA 0%, #2A9C92 100%); }
  .dpinvite-avatar-init.init-color-6 { background: linear-gradient(135deg, #F08AA0 0%, #C4546F 100%); }
  .dpinvite-avatar-init.init-color-7 { background: linear-gradient(135deg, #B0C0CE 0%, #7D8FA0 100%); }
  .dpinvite-avatar[aria-checked="true"] .dpinvite-avatar-img > img,
  .dpinvite-avatar[aria-checked="true"] .dpinvite-avatar-init {
    box-shadow: 0 0 0 3px #111E38, 0 0 0 5px var(--accent);
  }
  .dpinvite-avatar-check {
    position: absolute; bottom: -2px; right: -2px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-on, #2a1a0c);
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #111E38;
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 0.15s ease, transform 0.15s ease;
    pointer-events: none;
  }
  .dpinvite-avatar[aria-checked="true"] .dpinvite-avatar-check {
    opacity: 1;
    transform: scale(1);
  }
  .dpinvite-online-dot {
    position: absolute; bottom: 2px; right: 2px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #5DCABA;
    border: 2px solid #111E38;
    pointer-events: none;
  }
  .dpinvite-avatar[aria-checked="true"] .dpinvite-online-dot { display: none; }
  .dpinvite-avatar-name {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.2;
    max-width: 64px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
    transition: color 0.15s, font-weight 0.15s;
  }
  .dpinvite-avatar[aria-checked="true"] .dpinvite-avatar-name {
    color: var(--accent);
    font-weight: 700;
  }

  /* Empty state (no friends) — calm, no card surface, no icon. Just two
     centered lines explaining how the share-link flow works. The
     "Send delingslenke" CTA below is the only path forward; no second
     "Inviter" affordance to compete with it. */
  .dpinvite-empty-card {
    text-align: center;
    padding: 14px 4px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .dpinvite-empty-title { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; }
  .dpinvite-empty-sub   { font-size: 12px; color: var(--muted); line-height: 1.4; max-width: 280px; }

  /* Sticky CTA row — primary pill + circular companion (.s-circ / .s-sq).
     Uses margin-left on the companion (not `gap`) so the companion can
     collapse cleanly to width:0 + margin:0 when no friends are selected. */
  .dpinvite-cta-row {
    display: flex;
    margin-top: 4px;
    align-items: center;
  }
  .dpinvite-cta-row .p-pill { flex: 1; min-width: 0; height: 48px; }

  /* Companion .s-circ — animated entrance/exit by transitioning width,
     margin-left, opacity, and scale. The primary pill's flex:1 reflows
     in real time as the companion width animates, so the primary appears
     to shrink/grow in lockstep — no JS needed for the primary's resize.
     The companion grows in place at the right of the row, never sliding
     across the primary's body. */
  .dpinvite-cta-row .s-circ {
    flex-shrink: 0;
    width: 44px;
    margin-left: 10px;
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
    overflow: hidden;
    transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1),
                margin-left 0.2s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.16s ease,
                transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .dpinvite-cta-row .s-circ:not(.is-visible) {
    width: 0;
    margin-left: 0;
    opacity: 0;
    transform: scale(0.4);
    pointer-events: none;
  }

  /* Cancel row — full-width pill matching the share button's form factor
     (h48, r999) so the two stack as a coherent action group. Negative
     margin-top tightens the visual gap to ~8px (body gap is 10px) so the
     two action pills read as one paired stack instead of two siblings. */
  .dpinvite-cancel-row {
    display: flex;
    margin-top: -2px;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .dpinvite-cancel-row .g-rnd {
    flex: 1;
    height: 48px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
  }

  /* Desktop: cap width and centre the sheet + top chip. */
  @media (min-width: 640px) {
    .dpinvite-sheet {
      max-width: 460px;
      max-height: 78vh;
      height: auto;
      left: 50%;
      transform: translateX(-50%) translateY(100%);
      border-radius: 22px 22px 0 0;
    }
    .dpinvite-sheet.open {
      transform: translateX(-50%) translateY(0);
    }
    .dpinvite-top-chip {
      max-width: 460px;
      left: 50%;
      right: auto;
      transform: translateX(-50%) translateY(-130%);
    }
    .dpinvite-top-chip.open {
      transform: translateX(-50%) translateY(0);
    }
  }

  /* ── Plan preview takeover ──────────────────────────────────────────────── */
  /* Hide the venue list and detail panel while the takeover is active so the
     live map (with shadows) is fully visible behind the floating cards. */
  body.plan-preview-active #panel,
  body.plan-preview-active #detail-panel,
  body.plan-preview-active #floating-search,
  body.plan-preview-active #floating-brand,
  body.plan-preview-active #qc-wrap,
  body.plan-preview-active #fts,
  body.plan-preview-active #fts-popup,
  body.plan-preview-active #notif-toast-wrap {
    opacity: 0 !important;
    pointer-events: none !important;
    transition: opacity 0.25s ease;
  }
  /* Locate-me + zoom slider stay visible during plan-preview — the receiver
     can frame both venue and themselves on the map (custom 2-state click
     handler in ui-plan-preview.js) and zoom in for detail. Anchored above
     the .pp-bottom panel via --pp-bottom-h (written by openPlanPreview from
     offsetHeight, kept in sync via ResizeObserver) — same mechanism the
     venue list uses via --peek-h. */
  body.plan-preview-active #locate-btn,
  body.plan-preview-active #zoom-jog {
    z-index: 1210; /* above the plan-preview overlay (1200) */
    opacity: 1;
    pointer-events: auto;
    transition: bottom 0.22s cubic-bezier(0.25, 0.9, 0.4, 1), opacity 0.25s ease;
  }
  body.plan-preview-active #locate-btn {
    bottom: calc(var(--pp-bottom-h, 220px) + 14px);
  }
  body.plan-preview-active #zoom-jog {
    bottom: calc(var(--pp-bottom-h, 220px) + 14px + 34px + 10px);
  }
  /* Plan-preview overlay — full-viewport flex column ending in the bottom
     sheet. Class names .plan-preview / .dprcv-overlay both supported so
     legacy callers don't break during rollout. */
  .plan-preview,
  .dprcv-overlay {
    position: fixed;
    inset: 0;
    z-index: 1200;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .dprcv-overlay.open .dprcv-bottom { opacity: 1; transform: translateY(0); }

  /* Bottom sheet — glass-panel surface. */
  .dprcv-bottom {
    pointer-events: auto;
    margin: 0;
    padding: 0 18px calc(14px + env(safe-area-inset-bottom, 0px));
    border-radius: 20px 20px 0 0;
    background: var(--glass-panel-bg);
    backdrop-filter: blur(22px) saturate(180%) brightness(0.92);
    -webkit-backdrop-filter: blur(22px) saturate(180%) brightness(0.92);
    box-shadow: var(--glass-inset), 0 -16px 40px rgba(0,0,0,0.55);
    color: var(--text);
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.36s ease, transform 0.36s cubic-bezier(0.4, 0, 0.2, 1);
    transition-delay: 0.08s;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  /* Drag handle wrapper — matches .pp-handle / #panel-handle / #dp-handle. */
  .dprcv-handle {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px 0 4px;
    cursor: pointer;
    touch-action: none;
    flex-shrink: 0;
  }
  .dprcv-grabber {
    width: 36px; height: 4px; border-radius: 2px;
    background: rgba(156,189,231,0.40);
    flex-shrink: 0;
  }

  /* Floating "from friend" top pill — wraps a .glass-action card. */
  .dprcv-top-pill {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    left: 0; right: 0;
    z-index: 1201;
    display: flex;
    justify-content: center;
    pointer-events: none;
    transform: translateY(-130%);
    transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .dprcv-overlay.open .dprcv-top-pill { transform: translateY(0); }
  .dprcv-top-pill-card {
    pointer-events: auto;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 6px 14px 6px 6px;
    border-radius: 999px;
  }
  .dprcv-top-pill-av {
    width: 28px; height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
  }
  .dprcv-top-pill-av img { width: 100%; height: 100%; object-fit: cover; }
  .dprcv-top-pill-name {
    font-size: 13px; font-weight: 700; color: var(--text);
    line-height: 1.2;
  }
  .dprcv-top-pill-sub {
    font-size: 11px; font-weight: 500; color: var(--muted);
    margin-left: 4px;
  }

  /* Title block — "{name} inviterer deg" eyebrow + venue name + meta */
  .dprcv-title-block {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 2px;
  }
  .dprcv-eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.6px;
    color: var(--muted);
    text-transform: uppercase;
    line-height: 1.2;
  }
  .dprcv-venue {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.1;
    margin-top: 2px;
    text-wrap: balance;
  }
  .dprcv-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    flex-wrap: wrap;
  }
  .dprcv-meta-dot { opacity: 0.5; }

  /* Hero card — uses .card surface; layout-only here. */
  .dprcv-hero {
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .dprcv-hero-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 2px;
  }
  .dprcv-hero-left,
  .dprcv-hero-right { min-width: 0; }
  .dprcv-hero-right { text-align: right; }
  .dprcv-hero-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.6px;
    color: var(--muted);
    text-transform: uppercase;
    line-height: 1.2;
  }
  .dprcv-arrival-time {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .dprcv-suntil-time {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .dprcv-arrival-sub,
  .dprcv-remaining {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  /* Timeline wrapper — interactive canvas (paint via drawAllCardTimelines).
     Drag handlers in JS update timeFromEl, which re-fires the painter. */
  .dprcv-timeline {
    position: relative;
    height: 40px;
    border-radius: 13px;
    overflow: hidden;
  }
  .dprcv-timeline-canvas.card-timeline-canvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
  }
  .dprcv-timeline-canvas.card-timeline-canvas:active { cursor: grabbing; }
  body.plan-preview-active .dprcv-timeline-canvas {
    display: block !important;
    opacity: 1 !important;
    pointer-events: auto !important;
  }

  /* Attendees row — uses .card surface; layout-only here. */
  .dprcv-attendees {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
  }
  .dprcv-att-stack {
    display: flex;
    flex-shrink: 0;
  }
  .dprcv-att-stack > * + * { margin-left: -10px; }
  .dprcv-att-av {
    width: 28px; height: 28px;
    border-radius: 50%;
    box-shadow: inset 0 0 0 2px var(--bg);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .dprcv-att-info { flex: 1; min-width: 0; }
  .dprcv-att-line {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }
  .dprcv-quote {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    margin-top: 2px;
    line-height: 1.35;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  /* Primary CTA wrapper — uses .p-pill; tall variant for the hero. */
  .dprcv-cta-primary { width: 100%; height: 52px; font-size: 15px; }

  /* Secondary row — Kommer senere + Avslå (2 buttons, equal width). */
  .dprcv-cta-row {
    display: flex;
    gap: 8px;
  }
  .dprcv-cta-row > .s-rnd,
  .dprcv-cta-row > .g-rnd { flex: 1; }

  @media (min-width: 640px) {
    .dprcv-bottom {
      max-width: 460px;
      margin-left: auto;
      margin-right: auto;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    .dprcv-top-pill { left: 50%; right: auto; transform: translateX(-50%) translateY(-130%); }
    .dprcv-overlay.open .dprcv-top-pill { transform: translateX(-50%) translateY(0); }
  }
  /* Plan card "Preview" button reuses the existing social-btn appearance */
  .plan-preview-btn {
    margin-top: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(156,189,231,0.22);
    background: rgba(156,189,231,0.10);
    color: var(--text);
    font-size: 12px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .plan-preview-btn:hover { border-color: var(--accent); color: var(--accent); }
  /* Invitations inbox in the profile panel */
  .invitations-section { padding-bottom: 4px; }
  .invitations-section .profile-section-label-sub {
    margin-top: 10px;
    opacity: 0.85;
  }
  .inbox-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-top: 1px solid rgba(156,189,231,0.08);
  }
  .inbox-row-info { flex: 1; min-width: 0; }
  .inbox-row-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .inbox-row-meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
  }
  .inbox-row-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .inbox-btn {
    border: none;
    border-radius: 999px;
    padding: 5px 9px;
    font-size: 11px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }
  .inbox-btn-preview {
    background: rgba(156,189,231,0.14);
    color: var(--text);
  }
  .inbox-btn-preview:hover { background: rgba(156,189,231,0.24); }
  .inbox-btn-accept {
    background: var(--accent);
    color: var(--accent-on, #2a1a0c);
  }
  .inbox-btn-accept:hover { opacity: 0.92; }
  .inbox-btn-decline {
    background: transparent;
    color: var(--muted);
  }
  .inbox-btn-decline:hover { color: var(--text); }
  /* Friend-add prompt banner inside the detail panel */
  .friend-prompt-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    margin: 10px 0 4px;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(255,175,133,0.18), rgba(255,175,133,0.08));
    border: 1px solid rgba(255,175,133,0.35);
    font-size: 13px;
    color: var(--text);
  }
  .friend-prompt-banner-text { flex: 1; line-height: 1.35; }
  .friend-prompt-banner-add,
  .friend-prompt-banner-skip {
    border: none;
    border-radius: 999px;
    padding: 6px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;

  /* ── Accepted panel — sharing-system redesign (.dpacc-*) ─────────────────

     (Calendar / Directions / Open / Add friend / Share). IDs preserved
     (#post-accept-overlay, #post-accept-panel) for legacy callers. */
  .post-accept-overlay,

    margin: 0 auto;

    z-index: 1151;

    justify-content: center;
    pointer-events: none;
    transform: translateY(-130%);

    padding: 4px 2px 6px;

  /* Attendees row — uses .card surface; layout-only here. */
  .dpacc-attendees {

  .dpacc-close-row {

    justify-content: center;

  .pp-av-wrap {

    position: absolute;
    bottom: -7px;
    left: 50%;
    transform: translateX(-50%);

    color: var(--accent-on, #2a1a0c);

  /* Invitee status pips on the plan card */

    gap: 6px;
    flex-wrap: wrap;
    margin-top: 6px;

  .plan-invitee {
    position: relative;

  /* ── Card friend badges ─────────────────────────────────────────────────── */

  .card-going-dot {
    width: 16px; height: 16px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid rgba(156,189,231,0.55);

  .friends-modal-overlay {
    position: fixed;

<div id="app">

  <!-- Bottom-center: date pill + sun arc + intent presets (hidden — replaced by qc-bar) -->
  <div id="floating-bottom" style="display:none">
    <!-- Date navigation — separate pill above the arc card -->
    <div id="floating-date">
      <!-- Calendar dropdown (opens upward) -->
      <div id="date-calendar"></div>
      <div id="arc-date-nav">
        <button class="day-nav-btn" onclick="advanceDay(-1)">‹</button>
        <button id="date-display-btn" onclick="toggleDateCalendar()">—</button>
        <button class="day-nav-btn" onclick="advanceDay(1, 12)">›</button>
      </div>
      <!-- Current weather strip -->
      <div id="date-wx-strip" style="display:none"></div>
      <!-- Hidden native input — value source for all existing code -->
      <input type="date" id="date-picker" style="display:none">
    </div>
    <div class="floating-card">
      <!-- Sun arc canvas -->
      <div id="bottom-arc-row">
        <canvas id="sun-curve" onclick="handleSunCurveClick(event)"></canvas>
        <div id="wx-now"></div>
      </div>
      <!-- Row 3: time preset buttons aligned to arc -->
      <div id="time-presets-row">
        <div id="intent-pill"></div>
        <button class="intent-btn" data-intent="now"        onclick="setIntent('now')">Now</button>
        <button class="intent-btn" data-intent="lunch"      onclick="setIntent('lunch')">Lunch</button>
        <button class="intent-btn" data-intent="after-work" onclick="setIntent('after-work')">After work</button>
        <button class="intent-btn" data-intent="evening"    onclick="setIntent('evening')">Evening</button>
      </div>
      <!-- Hidden time input — keeps the rest of the app working unchanged -->
      <input type="range" id="time-from" min="4" max="23" step="0.0833333" value="10" style="display:none">
      <span id="time-display-from" style="display:none"></span>
      <div id="time-range-wrap" style="display:none">
        <div id="time-range-sun-bg"></div>
      </div>
      <button id="now-btn" onclick="toggleNowMode()" style="display:none">Now</button>
    </div>
  </div>

  <!-- Panel reveal button — shown when sidebar is hidden -->
  <button id="panel-reveal-btn" onclick="togglePanel()" title="Show sidebar">›</button>

  <!-- Toast notice (qc-wrap kept for qc-notice toasts) -->
  <div id="qc-wrap" class="intro-hidden">
    <div id="qc-notice"></div>
  </div>

  <!-- RIGHT DETAIL PANEL — opens when a venue is selected -->
  <div id="detail-panel" class="glass-panel fts-host">
    <div id="dp-handle" onclick="closeDetailPanel()">
      <div id="dp-handle-pill"></div>
    </div>
    <div id="dp-content"></div>
  </div>

  <!-- Calendar float — positioned above the FTS, opened by the FTS date button.
       Lives OUTSIDE #panel so it escapes the panel's transform context. -->
  <div id="ptb-cal-float" role="dialog" aria-modal="true" aria-label="Velg dato">
    <div id="ptb-cal-header">
      <span id="ptb-cal-title">Velg dato</span>
      <button id="ptb-cal-close" onclick="_closeQcPanel()" aria-label="Lukk">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/></svg>
      </button>
    </div>
    <div id="qc-panel">
      <div id="qc-panel-inner">
        <div id="qc-date-section">
          <div id="qc-cal"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- LEFT PANEL — venue list, floats below search bar -->
  <div id="panel" class="intro-hidden glass-panel fts-host">
    <div id="panel-handle">
      <div id="panel-handle-pill"></div>
    </div>


    <!-- Header chip row: date (tappable), weather (info), sort -->
    <div id="list-sun-header">
      <button id="header-date-chip" onclick="toggleQcPanel('date')" aria-label="Velg dato">
        <svg class="chip-cal-icon" width="14" height="14" viewBox="0 0 16 16" fill="none">
          <rect x="1.5" y="3" width="13" height="11.5" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <line x1="1.5" y1="6.5" x2="14.5" y2="6.5" stroke="currentColor" stroke-width="1.5"/>
          <line x1="5" y1="1.5" x2="5" y2="4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="11" y1="1.5" x2="11" y2="4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span id="header-date-label"></span>
      </button>
      <div id="header-wx-chip" role="status" aria-live="polite">
        <span id="header-wx-icon" aria-hidden="true"></span>
        <span id="header-wx-temp"></span>
        <span class="chip-dot" aria-hidden="true">·</span>
        <span id="header-wx-wind"></span>
      </div>
      <button id="sort-toggle-btn" onclick="toggleSortPanel()"><span id="sort-label">Mest sol</span><span class="sort-chevron"> ▾</span></button>
    </div>

    <!-- Sun-section bar: morphs between "Sun now" / "Sun later" as the
         user scrolls past each bucket. JS-driven (see updateSunSectionBar). -->
    <div id="sun-section-bar" aria-live="polite">
      <div class="ssb-track">
        <span class="ssb-line ssb-now"><span class="ssb-label"></span><span class="ssb-context"></span></span>
        <span class="ssb-line ssb-later"><span class="ssb-label"></span><span class="ssb-context"></span></span>
      </div>
    </div>

    <!-- Venue peek: first card preview visible in collapsed state -->
    <div id="venue-peek"></div>

    <div id="venue-list"></div>
  </div>

  <!-- Notification toast: outside #panel so position:fixed works on mobile
       (transforms on #panel create a containing block that breaks fixed positioning) -->
  <div id="notif-toast-wrap" role="alert" aria-live="polite"></div>

  <!-- Sort panel: fixed overlay, positioned by JS from button origin -->
  <div id="sort-panel" class="glass-panel">
    <button class="sort-btn active" data-sort="match"     onclick="setSortBy('match')">Beste treff</button>
    <button class="sort-btn"        data-sort="score"     onclick="setSortBy('score')">Mest sol</button>
    <button class="sort-btn"        data-sort="distance"  onclick="setSortBy('distance')">Avstand</button>
    <button class="sort-btn"        data-sort="beer"      onclick="setSortBy('beer')">Ølpris</button>
    <button class="sort-btn"        data-sort="favorites" onclick="setSortBy('favorites')">Favoritter</button>
  </div>

  <!-- Floating time slider (round 12) — outside #panel, tracks panel top edge -->
  <div id="fts" class="intro-hidden">
    <button id="fts-date-btn" onclick="toggleQcPanel('date')" aria-label="Velg dato" tabindex="-1">
      <svg class="fts-cal-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <rect x="1.5" y="3" width="13" height="11.5" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <line x1="1.5" y1="6.5" x2="14.5" y2="6.5" stroke="currentColor" stroke-width="1.5"/>
        <line x1="5" y1="1.5" x2="5" y2="4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="11" y1="1.5" x2="11" y2="4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
    <div id="fts-track">
      <canvas id="fts-canvas"></canvas>
      <!-- Popup lives inside the track so it follows the thumb natively
           when the track animates (date-pill slide-in shifts margin-left,
           panel state changes shift the FTS bottom). Position is set as
           a percentage of the track width — no BCR / offsetLeft math. -->
      <div id="fts-popup">
        <div class="fts-popup-row fts-popup-primary">
          <span id="fts-popup-time"></span>
          <span id="fts-popup-wx-icon" aria-hidden="true"></span>
        </div>
        <div class="fts-popup-row fts-popup-secondary">
          <span id="fts-popup-temp"></span>
          <span class="fts-dot">·</span>
          <span id="fts-popup-wind"></span>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
