    .venue-card.selected .card-expanded { max-height: 160px; }

    /* Hide Mapbox zoom/compass controls — gesture-only on mobile */
    .mapboxgl-ctrl-bottom-right,
    .mapboxgl-ctrl-bottom-left,
    .mapboxgl-ctrl-top-right,
    .mapboxgl-ctrl-top-left,
    .mapboxgl-ctrl-group,
    .mapboxgl-ctrl-attrib { display: none !important; }

    /* Peek state: the visible portion (handle, sun-header, venue-peek) must
       capture touch for drag-to-expand. touch-action: none tells the browser
       not to handle pan gestures natively — our JS touchmove does it. */
    #panel:not(.mobile-expanded):not(.mobile-hidden):not(.mobile-fullscreen) {
      touch-action: none;
    }

    /* Fullscreen state: panel covers everything */
    #panel.mobile-fullscreen {
      transform: translateY(0);
      height: 100svh;
      border-radius: 0;
      z-index: 910;
    }

    /* Kill expensive effects while the user is actively dragging the panel */
    #panel.panel-dragging {
      transition: none !important;
    }
    #panel.panel-dragging .venue-card {
      animation: none !important;
      transition: none !important;
    }
  }

  /* Logged-out profile panel: hero + benefits carousel */
  .login-hero { padding: 24px 20px 8px; text-align: center; }
  .login-hero-title {
    font-family: 'Newsreader', serif; font-size: 22px; font-weight: 400;
    color: var(--text); line-height: 1.25; margin: 0 0 18px;
  }
  .login-carousel { position: relative; overflow: hidden; }
  .login-carousel-track {
    display: flex;
    transition: transform 0.35s cubic-bezier(0.25, 0.9, 0.4, 1);
    will-change: transform; touch-action: pan-y;
  }
  .login-slide {
    flex: 0 0 100%; padding: 8px 16px 12px; box-sizing: border-box;
    text-align: center;
  }
  .login-slide-icon {
    width: 48px; height: 48px; margin: 0 auto 12px; color: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .login-slide-icon svg { width: 36px; height: 36px; }
  .login-slide-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .login-slide-body  {
    font-size: 13px; line-height: 1.5; color: var(--muted);
    max-width: 240px; margin: 0 auto;
  }
  .login-carousel-dots {
    display: flex; gap: 6px; justify-content: center; padding: 14px 0 4px;
  }
  .login-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,0.2); border: none; padding: 0;
    cursor: pointer; transition: background 0.2s, width 0.2s;
  }
  .login-dot.active { background: var(--accent); width: 18px; border-radius: 3px; }

  .login-auth-section { padding: 8px 20px 12px; }
  .login-auth-section .login-gate-buttons { max-width: none; margin-top: 0; }
  .login-footer {
    border-top: 1px solid rgba(255,255,255,0.07);
    padding: 10px 0 4px; margin-top: 8px; text-align: center;
  }
  .login-close-btn {
    position: absolute; top: 10px; right: 10px;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,0.06); border: none;
    color: var(--muted); font-size: 22px; line-height: 1;
    cursor: pointer; z-index: 2; display: none;
    align-items: center; justify-content: center;
  }
  .login-close-btn:hover { background: rgba(255,255,255,0.12); color: var(--text); }

  /* Candidate "Suggest venue" badge in search dropdown */
  .sd-candidate-btn {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    background: rgba(255,175,133,0.1);
    border: 1px solid rgba(255,175,133,0.25);
    border-radius: 12px;
    padding: 3px 10px;
    white-space: nowrap;
    flex-shrink: 0;
    pointer-events: none; /* row handles click */
  }
  .sd-row-candidate:hover .sd-candidate-btn {
    background: rgba(255,175,133,0.2);
    border-color: rgba(255,175,133,0.4);
  }

  /* ── Venue selection modal (Google Places results) ──────────────────────────── */
  .suggest-result-row {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(156,189,231,0.1);
    cursor: pointer;
    transition: background 150ms ease;
  }
  .suggest-result-row:last-child { border-bottom: none; }
  .suggest-result-row:hover { background: rgba(255,175,133,0.08); }

  .suggest-result-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
  }

  .suggest-result-address {
    font-size: 12px;
    color: var(--muted);
  }

  /* ── Candidate loading panel ──────────────────────────────────────────────── */
  .candidate-loading-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 280px;
    padding: 32px 24px;
    text-align: center;
  }
  .candidate-loading-name {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 28px;
  }
  .candidate-loading-spinner {
    width: 36px;
    height: 36px;
    border: 3px solid rgba(255,175,133,0.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: candidate-spin 0.8s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes candidate-spin {
    to { transform: rotate(360deg); }
  }
  .candidate-loading-status {
    font-size: 13px;
    color: var(--muted);
    transition: opacity 0.2s;
  }

  /* ── Geo search pin (address marker on map) ──────────────────────────────── */
  .geo-pin {
    cursor: pointer;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    animation: geo-pin-drop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes geo-pin-drop {
    0%   { transform: translateY(-20px); opacity: 0; }
    100% { transform: translateY(0);     opacity: 1; }
  }

  /* ── Admin modals ─────────────────────────────────────────────────────────── */
  .admin-modal {
    position: fixed;
    inset: 0;
    z-index: 3000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    padding: 16px;
  }

  .admin-modal-inner {
    background: var(--panel-bg, #0d1f35);
    border: 1px solid rgba(156,189,231,0.22);
    border-radius: 16px;
    width: 100%;
    max-width: 520px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 40px rgba(0,0,0,0.7);
  }

  .admin-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    flex-shrink: 0;
  }

  .admin-modal-title {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }

  .admin-modal-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.12s;
  }

  .admin-modal-close:hover { background: rgba(255,255,255,0.08); color: var(--text); }

  .admin-modal-body {
    padding: 16px 20px;
    overflow-y: auto;
    flex: 1;
  }

  .admin-edit-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(156,189,231,0.15);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
    transition: opacity 0.3s;
  }

  .admin-edit-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  .admin-edit-venue {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }

  .admin-edit-meta {
    font-size: 11px;
    color: var(--muted);
  }

  .admin-edit-diff {
    margin-bottom: 10px;
  }

  .admin-diff-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 3px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    flex-wrap: wrap;
  }

  .admin-diff-key   { color: var(--muted); min-width: 120px; }
  .admin-diff-before { color: #ff8080; font-family: monospace; }
  .admin-diff-arrow  { color: var(--muted); }
  .admin-diff-after  { color: #64ffb4; font-family: monospace; }

  .admin-edit-actions {
    display: flex;
    gap: 8px;
  }

  .admin-approve-btn {
    background: rgba(100,255,180,0.12);
    border: 1px solid rgba(100,255,180,0.4);
    border-radius: 7px;
    color: #64ffb4;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .admin-approve-btn:hover { background: rgba(100,255,180,0.22); }

  .admin-reject-btn {
    background: rgba(255,107,107,0.12);
    border: 1px solid rgba(255,107,107,0.35);
    border-radius: 7px;
    color: #ff6b6b;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .admin-reject-btn:hover { background: rgba(255,107,107,0.22); }

  /* ── Edit banner mobile layout ────────────────────────────────────────────── */
  @media (max-width: 600px) {
    #edit-overlay {
      bottom: 0;
      left: 0;
      right: 0;
      transform: none;
      padding: 0 0 env(safe-area-inset-bottom, 0);
      align-items: stretch;
      width: auto;
      max-width: none;
    }

    #edit-instruction {
      padding: 0 16px;
    }

    #edit-banner {
      border-radius: 16px 16px 0 0;
      padding: 14px 16px 16px;
      border-left: none;
      border-right: none;
      border-bottom: none;
      width: auto;
    }

    #edit-controls { flex-wrap: wrap; }
    #edit-type-select { flex: 1; }
    #edit-satellite-btn { flex: 1; justify-content: center; }
  }

  /* Timeline */
  .card-timeline {
    margin-top: 7px;
  }

  .tl-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }

  .tl-track {
    flex: 1;
    height: 6px;
    background: rgba(156,189,231,0.18);
    border-radius: 3px;
    position: relative;
    overflow: visible;
  }

  .tl-sun-seg {
    position: absolute;
    top: 0;
    height: 100%;
    background: linear-gradient(90deg, #FF9966, #FFAF85);
    border-radius: 3px;
    opacity: 0.85;
  }

  .tl-needle {
    position: absolute;
    top: -4px;
    width: 2px;
    height: 14px;
    background: #fff;
    border-radius: 1px;
    transform: translateX(-50%);
    box-shadow: 0 0 4px rgba(255,255,255,0.5);
  }

  .tl-labels {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--muted);
    opacity: 0.6;
  }

  .tl-badge {
    font-size: 10px;
    font-weight: 600;
    white-space: nowrap;
    padding: 1px 6px;
    border-radius: 8px;
    flex-shrink: 0;
  }

  .tl-badge.sunny {
    background: rgba(255,175,133,0.18);
    color: var(--accent);
  }

  .tl-badge.neutral {
    background: rgba(138,154,176,0.15);
    color: #9CBDE7;
  }

  .tl-badge.muted {
    background: rgba(138,154,176,0.1);
    color: var(--muted);
  }

  /* Now button */
  #now-btn {
    background: rgba(156,189,231,0.12);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #now-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }
  #now-btn:hover:not(.active) {
    border-color: rgba(255,175,133,0.4);
    color: var(--text);
  }

  /* Dual range slider */
  .time-range-wrap {
    flex: 1;
    position: relative;
    height: 20px;
    display: flex;
    align-items: center;
    overflow: visible;
  }
  .time-range-track-bg {
    position: absolute;
    top: 8px;
    left: 0; right: 0; height: 4px;
    background: rgba(156,189,231,0.18);
    border-radius: 2px;
    pointer-events: none;
  }
  .time-range-wrap input[type=range] {
    position: absolute;
    width: 100%;
    margin: 0;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    pointer-events: none;
    height: 20px;
    outline: none;
  }
  .time-range-wrap input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #0a1830;
    cursor: pointer;
    pointer-events: all;
    box-shadow: 0 0 14px rgba(255,175,133,0.7);
  }
  .time-range-wrap input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #0a1830;
    cursor: pointer;
    pointer-events: all;
    box-shadow: 0 0 14px rgba(255,175,133,0.7);
  }
  .time-range-wrap input[type=range]:hover::-webkit-slider-thumb {
    background: #FFCBAA;
    box-shadow: 0 0 10px rgba(255,175,133,0.6);
  }
  .time-range-wrap.now-active input[type=range]::-webkit-slider-thumb {
    background: #0a1830;
    border-color: rgba(255,175,133,0.45);
    box-shadow: none;
    cursor: default;
  }
  .time-range-wrap.now-active input[type=range]:hover::-webkit-slider-thumb {
    background: #0d1f40;
    border-color: rgba(255,175,133,0.7);
    box-shadow: 0 0 6px rgba(255,175,133,0.15);
  }
  .time-range-sun-bg {
    position: absolute;
    top: 8px;
    height: 4px;
    background: rgba(255,175,133,0.13);
    border-radius: 2px;
    pointer-events: none;
  }
  .time-display-row {
    position: absolute;
    top: 22px;
    left: 0; right: 0;
    height: 12px;
  }
  .time-display-row span {
    position: absolute;
    transform: translateX(-50%);
    font-size: 9px;
    color: var(--muted);
    white-space: nowrap;
    transition: left 0.05s;
  }

  .tl-end-sun {
    position: absolute;
    top: -4px;
    width: 2px;
    height: 14px;
    background: rgba(255,140,0,0.75);
    border-radius: 1px;
    transform: translateX(-50%);
  }
  .tl-end-sun-label {
    position: absolute;
    top: calc(100% + 5px);
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    color: rgba(255,140,0,0.85);
    white-space: nowrap;
  }
  .tl-label-icon {
    opacity: 0.55;
    font-size: 8px;
  }

  /* Timeline extras */
  .tl-shade-seg {
    position: absolute;
    top: 0; height: 100%;
    background: rgba(255,255,255,0.035);
    border-radius: 3px;
  }
  .tl-range-seg {
    position: absolute;
    top: -3px; height: calc(100% + 6px);
    background: rgba(255,175,133,0.12);
    border-left: 1px solid rgba(255,175,133,0.35);
    border-right: 1px solid rgba(255,175,133,0.35);
    border-radius: 2px;
    pointer-events: none;
  }
  .tl-closed-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 8px;
    background: rgba(255,80,80,0.1);
    color: #ff8a8a;
    white-space: nowrap;
    flex-shrink: 0;
  }
  /* "Try tomorrow" banner in venue list */
  #no-sun-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,175,133,0.06);
    border: 1px solid rgba(255,175,133,0.18);
    border-radius: 10px;
    padding: 9px 14px;
    margin-bottom: 10px;
    font-size: 12px;
    color: var(--muted);
  }
  #no-sun-banner button {
    background: rgba(255,175,133,0.15);
    border: 1px solid rgba(255,175,133,0.35);
    border-radius: 7px;
    color: var(--accent);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 11px;
    cursor: pointer;
    transition: background 0.12s;
  }
  #no-sun-banner button:hover { background: rgba(255,175,133,0.25); }

  /* ── Venue suggestion ────────────────────────────────────────────────────── */
  .suggest-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 28px 16px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }
  .suggest-empty strong { color: var(--text); font-weight: 500; }
  .suggest-btn {
    background: rgba(156,189,231,0.1);
    border: 1px solid rgba(156,189,231,0.2);
    border-radius: 20px;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 7px 16px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    text-decoration: none;
    display: inline-block;
  }
  .suggest-btn:hover { background: rgba(156,189,231,0.18); color: var(--text); }
  .suggest-btn-primary {
    background: rgba(255,175,133,0.12);
    border-color: rgba(255,175,133,0.25);
    color: #FFAF85;
  }
  .suggest-btn-primary:hover { background: rgba(255,175,133,0.22); color: #FFAF85; }
  .suggest-confirm {
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .suggest-confirm-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
  }
  .suggest-confirm-address {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .suggest-confirm-prompt {
    font-size: 13px;
    color: var(--muted);
    margin: 8px 0 4px;
  }
  .suggest-confirm-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .venue-card.closed-card {
    padding: 8px 14px;
    opacity: 0.4;
    cursor: pointer;
  }
  .venue-card.closed-card:hover { opacity: 0.65; }
  .closed-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .closed-name {
    font-size: 12px;
    color: var(--muted);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── RIGHT DETAIL PANEL ───────────────────────────────────────────── */
  /* ── Toast notice strip ─────────────────────────────────────────────── */
  #qc-wrap {
    position: absolute;
    left: 16px;
    top: 70px;     /* search top(16) + search height(46) + gap(8) */
    width: 336px;
    z-index: 820;
    pointer-events: none;
    transition: left 0.28s ease;
  }
  #qc-notice {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    padding: 2px 8px 0;
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
  }
  #qc-notice.visible { opacity: 1; }

  /* ── Panel time bar: date circle + readout + arc canvas ────────────── */
  #panel-time-bar {
    flex-shrink: 0;
    padding: 10px 10px 12px;
    border-bottom: 1px solid rgba(156, 189, 231, 0.1);
  }

  /* ── Unified control group: readout + bar as one docked surface ─────── */
  #qc-control-group {
    border-radius: 14px;
    overflow: hidden;
    transition: background 120ms ease-out;
  }
  /* ── Compact 3-row readout: rows 1-3 all inside #time-readout ─────────── */
  #time-readout {
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: background 120ms ease-out;
  }

  /* ── Row 1: calendar button (left) + inline weather (right) ─────────── */
  #readout-row1 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    height: 36px;
  }

  /* Date button — action-pill flavor, 36px height, glass-action bg */
  #readout-date-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 12px;
    background: var(--glass-action-bg);
    border: var(--glass-border);
    border-radius: 16px;
    box-shadow: var(--glass-inset);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    outline: none;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background 120ms, border-color 120ms;
  }
  #readout-date-btn:hover,
  #readout-date-btn:focus-visible {
    background: rgba(20,46,82,0.60);
    border-color: rgba(156,189,231,0.30);
  }
  /* Calendar icon: --muted at rest */
  .date-cal-icon {
    color: var(--muted);
    flex-shrink: 0;
    transition: color 120ms;
  }
  /* Date label: --text, 13pt/600 */
  #readout-date-label {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    line-height: 1;
    transition: color 120ms;
  }
  /* Trailing chevron — filled triangle, rotates 180° when picker open */
  .readout-chevron {
    display: inline-block;
    color: var(--muted);
    flex-shrink: 0;
    transition: color 120ms, transform 120ms;
  }
  #readout-date-btn:hover .readout-chevron,
  #readout-date-btn:focus-visible .readout-chevron {
    color: var(--text);
  }
  #readout-date-btn.active {
    border-color: rgba(255,175,133,0.35);
  }
  #readout-date-btn.active .date-cal-icon { color: var(--accent); }
  #readout-date-btn.active #readout-date-label { color: var(--accent); }
  #readout-date-btn.active .readout-chevron {
    color: var(--accent);
    transform: rotate(180deg);
  }

  /* Inline weather: [icon 18px] [temp 13pt/600/--text] · [wind 13pt/500/--muted] */
  #readout-meta-wx {
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    flex-shrink: 0;
    line-height: 1;
    transition: opacity 50ms;
  }
  #readout-meta-wx .wx-icon {
    font-size: 18px;
    line-height: 1;
    color: var(--muted);
  }
  #readout-meta-temp {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    min-width: 28px;

  /* ── Row 3: axis labels — 4px below slider, aligned with slider's left edge ─ */

  /* ── Calendar float — outside #panel, position: fixed so it escapes transforms ── */
  #ptb-cal-float {
    position: fixed;
    z-index: 830;
    display: none;
    /* desktop: position + width set by JS to match FTS */
    left: 16px;
    width: 336px;
    min-width: 300px;
    max-width: 480px;
    transition: left 0.28s ease;
  }
  #ptb-cal-float.open { display: block; }
  /* Header + close button — hidden on desktop, shown on mobile */
  #ptb-cal-header {
    display: none;
  }

  /* ── Mobile: calendar as bottom-sheet ──────────────────────────────────── */
  @media (max-width: 639px) {
    /* Override display:none with a transform-based show/hide so we can animate */
    #ptb-cal-float {
      display: block !important; /* always in layout; visibility via transform+opacity */
      left: 0;
      right: 0;
      width: auto;
      top: auto;
      bottom: 0;
      max-height: 80vh;
      padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 20px);
      box-sizing: border-box;
      background: var(--glass-panel-bg);
      backdrop-filter: var(--glass-blur-panel);
      -webkit-backdrop-filter: var(--glass-blur-panel);
      border-radius: 20px 20px 0 0;
      border: 1px solid rgba(156,189,231,0.22);
      border-bottom: none;
      box-shadow: inset 0 1px 0 rgba(255,242,235,0.22), 0 -8px 40px rgba(0,0,0,0.50);
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none;
      transition: transform 300ms cubic-bezier(0.4, 0, 0.2, 1), opacity 180ms ease-out;
      z-index: 1101;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #ptb-cal-float.open {
      display: block !important;
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    /* Header row: title + close button — visible on mobile */
    #ptb-cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0 10px;
      flex-shrink: 0;
    }
    #ptb-cal-title {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }
    #ptb-cal-close {
      background: rgba(156,189,231,0.12);
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--muted);
      flex-shrink: 0;
      transition: background 0.12s, color 0.12s;
    }
    #ptb-cal-close:hover { background: rgba(156,189,231,0.22); color: var(--text); }
    /* Inner panel: no extra animation on mobile — the outer float handles reveal */
    #ptb-cal-float #qc-panel {
      overflow: visible;
      max-height: none !important;
      margin-top: 0;
      transition: none;
    }
    #ptb-cal-float #qc-panel.open { max-height: none !important; }
    #ptb-cal-float #qc-panel-inner {
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      overflow: visible;
      opacity: 1 !important;
      pointer-events: auto !important;
    }
    #ptb-cal-float #qc-date-section {
      padding: 0;
      overflow: visible;
      height: auto !important; /* override JS _syncQcPanelHeight inline height */
    }
    /* 10-day grid: 5 columns × 2 rows — all days visible at once, no scroll */
    #ptb-cal-float #qc-cal .dc-grid:not(.dc-month-grid) {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      overflow: visible;
    }
    #ptb-cal-float #qc-cal .dc-grid:not(.dc-month-grid) .dc-tile {
      justify-content: center;
      border-radius: 10px;
      gap: 3px;
      padding: 8px 4px 6px;
    }
    #ptb-cal-float #qc-cal .dc-grid:not(.dc-month-grid) .dc-day  { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; }
    #ptb-cal-float #qc-cal .dc-grid:not(.dc-month-grid) .dc-num  { font-size: 17px; font-weight: 700; line-height: 1; }
    #ptb-cal-float #qc-cal .dc-grid:not(.dc-month-grid) .dc-icon { font-size: 15px; line-height: 1.2; }
    #ptb-cal-float #qc-cal .dc-grid:not(.dc-month-grid) .dc-temp { font-size: 10px; font-weight: 600; color: rgba(156,189,231,0.72); }
    /* Month-view full calendar on mobile */
    #ptb-cal-float #qc-cal .dc-cal-scroll { height: 55vh; }
    #ptb-cal-float #qc-cal .dc-month-grid .dc-tile { height: 48px; }
    #ptb-cal-float #qc-cal .dc-month-grid .dc-tile.solar-only { height: 48px; min-height: 48px; }
  }

  #qc-presets {
    display: flex;
    gap: 2px;
    padding: 3px;

    border: 1px solid rgba(156, 189, 231, 0.14);

  .qc-preset-btn.active { background: var(--accent); color: #142E52; border-color: var(--accent); }

  /* Calendar section inside panel-time-bar */
  #qc-panel {
    overflow: hidden;
    max-height: 0;
    margin-top: 8px;
    transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);

  }
  #qc-panel-inner {
    width: 100%;
    box-sizing: border-box;
    background: var(--glass-panel-bg);
    backdrop-filter: var(--glass-blur-panel);
    -webkit-backdrop-filter: var(--glass-blur-panel);
    border: var(--glass-border);
    border-radius: 12px;

  #qc-date-section { display: none; padding: 8px; box-sizing: border-box; width: 100%; overflow: hidden; }
  #qc-date-section.active { display: flex; flex-direction: column; }
  #qc-cal { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; box-sizing: border-box; overflow: clip; }
  #qc-panel.cal-expanded #qc-cal { overflow: clip; flex: 1; }
  #qc-cal .dc-cal-scroll {
    height: 390px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    /* Soft bottom fade hints at more content without eating into the last row of tiles. */
    mask-image: linear-gradient(to bottom, black 96%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, black 96%, transparent 100%);
  }
  #qc-cal .dc-cal-scroll::-webkit-scrollbar { display: none; }
  #qc-cal .dc-grid:not(.dc-month-grid) { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: auto; gap: 3px; width: 100%; box-sizing: border-box; }
  #qc-cal .dc-grid:not(.dc-month-grid) .dc-tile  { padding: 4px 2px; gap: 2px; }
  #qc-cal .dc-grid:not(.dc-month-grid) .dc-day   { font-size: 8px; }
  #qc-cal .dc-grid:not(.dc-month-grid) .dc-num   { font-size: 15px; }
  #qc-cal .dc-grid:not(.dc-month-grid) .dc-icon  { font-size: 17px; line-height: 1.1; }
  #qc-cal .dc-grid:not(.dc-month-grid) .dc-temp  { font-size: 12px; font-weight: 700; color: rgba(156,189,231,0.72); }
  /* Full-calendar month grid: 7 columns, 4px gap, 48px tiles */
  #qc-cal .dc-month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; width: 100%; box-sizing: border-box; }
  #qc-cal .dc-month-grid .dc-tile { padding: 4px 2px; gap: 2px; height: 44px; justify-content: center; }
  #qc-cal .dc-month-grid .dc-tile.solar-only { height: 44px; min-height: 44px; }
  #qc-cal .dc-month-grid .dc-num  { font-size: 15px; font-weight: 600; }
  #qc-cal .dc-month-grid .dc-icon { font-size: 14px; line-height: 1.1; }
  /* Weekday row: 7 columns matching day grid, sticky at scroll-area top */
  #qc-cal .dc-weekday-row {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
    height: 24px; align-items: center;
    position: sticky; top: 0; z-index: 2;
    background: rgba(20,46,82,0.85);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(156,189,231,0.12);
    margin-bottom: 2px;
  }
  /* Month label: sticky just below weekday row, same backdrop */
  #qc-cal .dc-month-row-label {
    position: sticky; top: 26px; /* weekday row (24px) + bottom border (1px) + gap (1px) */
    z-index: 1;
    background: rgba(20,46,82,0.85);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 4px 2px;
  }

  /* Suppress venue card enter animation on map-pan re-renders */
  #venue-list[data-no-anim] .venue-card { animation: none !important; }

  /* Mobile overrides */
  @media (max-width: 639px) {

      width: auto;

  #detail-panel {

    left: 368px;   /* 16 + 336 + 16 */

    width: 300px;
    border-radius: 16px;

    flex-direction: column;
    overflow: hidden;

    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: rgba(156,189,231,0.35);
  }
  .dp-busy-chart {
    width: 100%;
  }
  .dp-busy-labels {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: var(--muted);
    opacity: 0.5;
    margin-top: 4px;
  }

  /* Detail panel drag handle */
  #dp-handle {
    display: none; /* shown on mobile only */
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 16px 0 14px;
    flex-shrink: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    position: relative;
  }
  #dp-handle-pill {
    width: 36px;
    height: 4px;
    background: rgba(156,189,231,0.25);
    border-radius: 2px;
  }

  /* Hide UI elements when detail panel is open on mobile */
  .mobile-ui-hidden { display: none !important; }

  /* ──── New Detail Panel CSS (Tasks 5-8) ────────────────────────────────────── */
  .detail-new-photos {
    height: 180px;
    border-radius: 14px;
    overflow-y: hidden;
    overflow-x: auto;
    margin-bottom: 14px;
    background: linear-gradient(135deg, #3a4b6e, #2a3a5c);
    display: flex;
    align-items: center;
    justify-content: flex-start;
    color: var(--muted);
    font-size: 12px;
    gap: 8px;
    padding: 0 2px;
    scrollbar-width: none;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    contain: layout style;
    flex-shrink: 0;
  }
  .detail-new-photos::-webkit-scrollbar { display: none; }
  .detail-new-photos img {
    height: 100%;
    min-width: 240px;
    max-width: 280px;
    object-fit: cover;
    border-radius: 10px;
    flex-shrink: 0;
    aspect-ratio: 4/3;
  }

  /* Merged header: back + title + fav/bell on one row */
  .detail-header-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 10px;
  }
  .detail-header-info {
    flex: 1;
    min-width: 0;
  }
  .detail-new-title {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.2;
  }
  .detail-new-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
  }
  .detail-new-back {
    padding: 6px 8px;
    background: none;
    border: none;
    font-size: 18px;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .detail-new-back:hover { color: var(--text); }
  .detail-header-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .dp-header-icon {
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px;
    color: var(--muted);
    line-height: 0;
    opacity: 0.75;
    transition: opacity 0.15s;
  }
  .dp-header-icon:hover { opacity: 1; }
  .dp-header-icon.active { opacity: 1; }

  /* ── Detail panel action row (directions + utilities) ────────────────────── */
  .dp-action-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .dp-action-cta {
    flex: 1;
    height: 44px;
    border-radius: 999px;
    background: var(--accent);
    border: none;
    color: var(--accent-on, #2a1a0c);
    font-size: 14px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }
  .dp-action-cta:hover { opacity: 0.9; }
  .dp-action-cta svg { width: 18px; height: 18px; stroke: currentColor; }
  .dp-action-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;          /* circular to echo the slider pill / thumb language */
    background: linear-gradient(135deg, rgba(20,46,82,0.25), rgba(32,73,131,0.14)), rgba(20,46,82,0.30);
    border: 1px solid rgba(156,189,231,0.20);
    box-shadow: inset 0 1px 0 rgba(255,242,235,0.14), inset 0 -1px 0 rgba(20,46,82,0.30);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    text-decoration: none;
    transition: background 0.15s, border-color 0.15s;
  }
  .dp-action-icon:hover { background: rgba(20,46,82,0.65); border-color: rgba(156,189,231,0.32); }
  .dp-action-icon svg { width: 18px; height: 18px; stroke: currentColor; color: var(--accent); }

  /* Legacy: keep .primary-action for backwards compat but hidden */
  .primary-action {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }

  .btn-primary {
    flex: 1;
    background: var(--accent);
    color: #2a1a0a;
    padding: 14px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: none;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-variant-numeric: tabular-nums;
  }

  .btn-primary:hover {
    opacity: 0.9;
  }

  .btn-icon-sec {
    width: 48px;
    height: 48px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    text-decoration: none;
  }

  .btn-icon-sec:hover {
    background: rgba(20,46,82,0.65);
  }

  .btn-icon-sec svg,
  .btn-primary svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    color: var(--accent);
  }

  /* ── Photo gallery wrapper + heart/bell overlay ──────────────────────── */
  .detail-new-photos-wrap {
    position: relative;
  }
  .dp-photo-actions {
    position: absolute;
    top: 8px;
    right: 8px;
    display: flex;
    gap: 6px;
    z-index: 3;
  }
  .dp-photo-actions .dp-header-icon {
    width: 36px;
    height: 36px;
    padding: 0;
    border-radius: 50%;
    background: rgba(14,26,52,0.55);
    backdrop-filter: blur(8px) saturate(160%);
    -webkit-backdrop-filter: blur(8px) saturate(160%);
    border: 1px solid rgba(156,189,231,0.22);
    color: var(--text);
    opacity: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dp-photo-actions .dp-header-icon svg { width: 18px; height: 18px; }

  /* ── Detail-panel "card": same DOM as a venue-card, scaled up ────────── */
  /* The layout (card-top → card-left + card-right + timeline) is identical to
     a venue-card — only sizes scale up. This keeps the user oriented after the
     morph: they see "the same card, bigger". */
  .dp-card {
    cursor: default;
    margin-bottom: 14px;
    padding: 18px 16px 14px;
    animation: none;
    border-radius: 14px;
  }
  .dp-card:hover { background: var(--glass-card-bg); }   /* kill list-card hover */
  .dp-card .card-top { gap: 14px; align-items: flex-start; }
  /* The two columns share line-heights between the top row (name / hero-main)
     and the second row (meta / hero-sub) so the secondary info aligns
     horizontally instead of drifting by a few px. */
  .dp-card .card-left { min-width: 0; gap: 4px; }
  .dp-card .card-new-name {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.22;
    letter-spacing: -0.01em;
  }
  .dp-card .card-new-meta {
    font-size: 12px;
    line-height: 1.35;
    margin-top: 2px;
  }
  .dp-card .card-right {
    min-width: 0;
    flex-shrink: 0;
    gap: 4px;
    align-items: flex-end;
  }
  .dp-card .card-new-hero-main {
    font-size: 17px;
    line-height: 1.22;
  }
  .dp-card .card-new-hero-sub  {
    font-size: 12px;
    line-height: 1.35;
    margin-top: 2px;
  }

  /* The docked source card uses its old `.card-timeline` as the slot the FTS
     pill overlays. The pill spans the FULL card-content width — calendar btn
     occupies the leftmost 38px, gap 8px, then the slider track fills the
     remainder. So no margin-left here; the calendar btn (38px wide, opaque
     glass-bg via its own CSS) covers the leftmost portion of the wx segments
     drawn by buildMiniSunTimeline, and the canvas covers the rest. */
  .dp-card .card-timeline {
    height: 38px;
    margin-top: 16px;
  }
  .dp-card .timeline-track {
    height: 38px;
    border-radius: 19px;
    overflow: hidden;
    /* Match the FTS pill's calendar-btn / track glass background so the 8px
       gap between the calendar btn and the slider track reads as a single
       continuous pill rather than exposing a different colour underneath. */
    background: var(--glass-action-bg);
  }
  /* The venue-card mini-timeline's wx segments would otherwise show through
     the FTS pill canvas (or peek out behind the calendar btn / gap). Hide
     them when the source is docked as a dp-card. */
  .dp-card .timeline-track .wx { display: none; }
  .dp-card .tl-now { display: none; }

  /* Reserves layout space in the panel for the lifted source venue-card,
     which is moved here at the end of the open-morph and becomes the
     dp-card. Once the source card lands here, this placeholder is removed
     by JS (replaceChild). Height includes card-top (~50) + card-timeline
     (38 + 16 margin-top) + dp-tl-labels (14 + 18 margin-top) + padding
     (18 top + 14 bottom). */
  .dp-card-slot {
    height: 168px;
    margin-bottom: 14px;
    /* Labels are pre-rendered inside the slot to keep the slot height
       correct without a layout shift when the source card docks. They're
       invisible while inside the slot — they fade in once moved into the
       docked source card by JS. */
    position: relative;
  }
  .dp-card-slot .dp-tl-labels { opacity: 0; pointer-events: none; }
  /* Labels inside the docked source card — animated to opacity 1. */
  .source-docked .dp-tl-labels {
    opacity: 1;
    transition: opacity 0.22s ease 0.10s;
  }

  /* Source card after it's been moved into the panel as the dp-card. Strips
     the position:fixed lifting and lets the card flow naturally in panel
     content. Inherits .venue-card + .dp-card sizing. */
  .venue-card.source-docked {
    position: relative !important;
    top: auto !important;
    left: auto !important;
    width: auto !important;
    z-index: auto !important;
    margin-bottom: 14px !important;
    pointer-events: auto;
  }

  /* Placeholder slot for the floating FTS pill (legacy — pre-morph code
     paths still expect #fts-slot). Post-morph the FTS pill overlays the
     docked source card's .timeline-track. */
  #fts-slot {
    margin-top: 16px;
    height: 38px;
  }

  /* Time labels under the slider */
  /* Time labels align with the FTS *track*, not the full FTS pill. The pill is
     [calendar-btn 38px][gap 8px][track]. Offset the label container by 46px on
     the left so the first label starts at the track's left edge (not under the
     calendar button). */
  .dp-tl-labels {
    position: relative;
    height: 14px;
    /* 18px clears the FTS pill's 0 2px 8px box-shadow + thumb halo overflow. */
    margin-top: 18px;
    /* Default 46px = 38px today-state calendar btn + 8px gap. JS sets
       --fts-labels-offset on the docked card based on the live date-btn
       width, so labels stay aligned with the track left edge when the user
       picks a non-today date (where the btn expands to fit the date label). */
    margin-left: var(--fts-labels-offset, 46px);
    font-size: 10.5px;
    color: var(--muted);
    opacity: 0.75;
  }
  .dp-tl-label {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .dp-tl-label-edge { transform: translateX(0); }
  .dp-tl-label-end  { transform: translateX(-100%); }

  /* Sol-retning section */

  /* Info rows (busyness, noise, hours) — open layout, no heavy box */
  .info-list {
    margin-bottom: 14px;
  }

  .info-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 4px;
    border-bottom: 1px solid rgba(156,189,231,0.10);
  }

  .info-row:last-child {
    border-bottom: none;
  }

  .info-icon {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    flex-shrink: 0;
    opacity: 0.85;
  }

  .info-icon svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    color: var(--accent);
  }

  .info-label {
    flex: 1;
    font-size: 14px;
  }

  .info-label-strong {
    font-weight: 600;
    color: var(--text);
  }

  .info-label-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .info-value {
    color: var(--accent);
    font-size: 13px;
    font-weight: 500;
    text-align: right;
  }

  /* Footer buttons — text links, low visual weight */
  .secondary-row {
    display: flex;
    gap: 18px;
    justify-content: center;
    padding: 14px 0 16px;
    margin-top: 4px;
  }

  .secondary-link {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    padding: 4px 0;
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    opacity: 0.75;
    transition: opacity 0.15s, color 0.15s;
  }

  .secondary-link:hover {
    opacity: 1;
    color: var(--text);
  }

  @media (max-width: 639px) {
    #detail-panel {
      position: fixed;  /* fixed avoids parent height issues; bottom:0 anchors to visual viewport */
      top: auto;
      left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 62svh;    /* svh = small viewport height; lowered from 69svh to make room for floating pill */
      max-height: none;
      border-radius: 20px 20px 0 0;
      border-left: none; border-right: none; border-bottom: none;
      transform: translateY(100%) translateZ(0);
      opacity: 1;
      z-index: 920;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), height 0.3s ease, border-radius 0.3s ease;
      will-change: transform, height;
      backface-visibility: hidden;
    }
    #detail-panel.open { transform: translateY(0); }
    #detail-panel.dp-fullscreen {
      height: 100svh;
      border-radius: 0;
    }

    /* Lifted-clone morph: the clicked venue card stays fully visible the
       entire time. JS clones it, fixes the clone to its viewport rect, and
       animates it (top/left/width/padding/font-size/timeline shape) toward
       its target rect inside the rising detail panel. The original source
       card stays in the list flow with visibility:hidden and slides off
       with the list (mobile-hidden). The detail panel rises with its own
       dp-card hidden; at the morph's end the lifted clone is removed and
       the actual dp-card fades in (an invisible swap because both look
       identical by then). */

    /* The clicked source venue-card while it's lifted out of the list. JS
       sets position:fixed + inline top/left/width = sourceRect (and re-appends
       to <body> so high z-index escapes #panel's stacking context). */
    .venue-card.source-morphing {
      position: fixed !important;
      z-index: 9990 !important;
      margin: 0 !important;
      opacity: 1 !important;     /* never inherit/animate-to anything else */
      pointer-events: none;
      will-change: top, left, width, padding;
      transition:
        top           0.34s cubic-bezier(0.32, 0.72, 0, 1),
        left          0.34s cubic-bezier(0.32, 0.72, 0, 1),
        width         0.34s cubic-bezier(0.32, 0.72, 0, 1),
        padding       0.34s cubic-bezier(0.32, 0.72, 0, 1),
        border-radius 0.34s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .venue-card.source-morphing .card-new-name,
    .venue-card.source-morphing .card-new-meta,
    .venue-card.source-morphing .card-new-hero-main,
    .venue-card.source-morphing .card-new-hero-sub {
      transition:
        font-size      0.34s cubic-bezier(0.32, 0.72, 0, 1),
        line-height    0.34s cubic-bezier(0.32, 0.72, 0, 1),
        letter-spacing 0.34s cubic-bezier(0.32, 0.72, 0, 1),
        margin-top     0.34s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .venue-card.source-morphing .card-timeline,
    .venue-card.source-morphing .timeline-track {
      transition:
        height        0.34s cubic-bezier(0.32, 0.72, 0, 1),
        margin-left   0.34s cubic-bezier(0.32, 0.72, 0, 1),
        margin-top    0.34s cubic-bezier(0.32, 0.72, 0, 1),
        border-radius 0.34s cubic-bezier(0.32, 0.72, 0, 1),
        background    0.34s cubic-bezier(0.32, 0.72, 0, 1),
        border-color  0.34s cubic-bezier(0.32, 0.72, 0, 1),
        box-shadow    0.34s cubic-bezier(0.32, 0.72, 0, 1);
    }

    /* Target state: dp-card sizing + slider-shaped timeline. */
    .venue-card.source-morphing.source-target {
      padding: 18px 16px 14px !important;
      border-radius: 14px !important;
    }
    /* Match the dp-card's full typography (line-height, letter-spacing,
       meta margin-top) so the text layout doesn't snap at hand-off. */
    .venue-card.source-morphing.source-target .card-new-name {
      font-size: 18px;
      line-height: 1.22;
      letter-spacing: -0.01em;
    }
    .venue-card.source-morphing.source-target .card-new-meta {
      font-size: 12px;
      line-height: 1.35;
      margin-top: 2px;
    }
    .venue-card.source-morphing.source-target .card-new-hero-main {
      font-size: 17px;
      line-height: 1.22;
    }
    .venue-card.source-morphing.source-target .card-new-hero-sub {
      font-size: 12px;
      line-height: 1.35;
      margin-top: 2px;
    }
    /* Morph target lays out the timeline as a flex row so the injected
       calbtn + the morphed timeline-track end up in the SAME positions
       they'll occupy after FTS reparenting (calbtn = #fts-date-btn, track =
       #fts-track). The hand-off becomes a content swap with no layout jump. */
    .venue-card.source-morphing.source-target .card-timeline {
      height: 38px;
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    /* Match the FTS slider track's visual exactly so the track-to-pill
       swap at hand-off doesn't pop in a border / shadow / different bg. */
    .venue-card.source-morphing.source-target .timeline-track {
      flex: 1;
      height: 38px;
      border-radius: 19px;
      background: var(--glass-action-bg);
      border: var(--glass-border);
      box-shadow: var(--glass-inset), 0 2px 8px rgba(0,0,0,0.35);
    }
    .venue-card.source-morphing.source-target .tl-now { display: none; }

    /* Cloned labels live inside the source card from the start of the morph
       so source.height includes label space throughout (no jump at hand-off).
       Hidden during morph, fade in as part of the .source-target transition. */
    .venue-card.source-morphing .dp-tl-labels {
      opacity: 0;
      transition: opacity 0.22s ease 0.10s;
    }
    .venue-card.source-morphing.source-target .dp-tl-labels { opacity: 1; }

    /* Calendar button injected into the lifted source card's .card-timeline
       as a flex item (left of the morphed track). Position matches where
       #fts-date-btn ends up after FTS reparenting, so the hand-off doesn't
       visibly shift the calbtn. */
    .source-card-calbtn {
      flex: 0 0 auto;
      width: 38px; height: 38px;
      border-radius: 19px;
      background: var(--glass-action-bg);
      border: var(--glass-border);
      box-shadow: var(--glass-inset), 0 2px 8px rgba(0,0,0,0.35);
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
      opacity: 0;
      transition: opacity 0.34s cubic-bezier(0.32, 0.72, 0, 1) 0.06s;
    }
    .venue-card.source-morphing.source-target .source-card-calbtn { opacity: 1; }
    .source-card-calbtn svg { width: 16px; height: 16px; }

    /* Hand-off fade. At 360ms we drop .dp-morphing (panel's dp-card / photos /
       social / info fade in over 0.22s) AND add .source-fading to the lifted
       source card. Use a SHORT crossfade (0.10s) instead of matching the
       0.22s — at 50% opacity each, the visual differences (lifted's morphed
       card-timeline vs dp-card's fts-slot + dp-tl-labels + real FTS pill) are
       too perceptible. With a quick fade the overlap window is minimal and
       reads as a single visual change. */
    .venue-card.source-morphing.source-fading {
      transition: opacity 0.10s ease-out;
      opacity: 0;
    }

    /* Placeholder reserves the source card's slot in the list so cards above
       don't reflow when we lift the source out. */
    .venue-card-placeholder { pointer-events: none; }

    /* Card-anchored morph (legacy): the panel container slides up normally
       (translateY(100%) → 0). What stays "in place" is the .dp-card inside —
       JS applies a transform that pins it to the source venue-card's rect for
       the duration of the rise, then releases to its natural slot. The panel
       chrome (background, photos, social, etc.) is hidden during the morph so
       the rising panel doesn't visually peek out from under the anchored card.
       overflow:visible on panel + dp-content so the FLIPped dp-card isn't
       clipped to the panel's visible box (which is mostly offscreen-below
       during the rise). */
    /* Keep panel chrome (background, border, shadow, ::before bevel) visible
       during the morph. The lifted source card sits at z-index 9990 — above
       the panel's z-index — so it stays on top regardless. Having the chrome
       there from the start avoids the abrupt "dark blue panel appears" jump
       at the hand-off moment when .dp-morphing is removed. */
    #detail-panel.dp-morphing {
      overflow: visible !important;
    }
    #detail-panel.dp-morphing #dp-content,
    #detail-panel.dp-morphing #dp-scroll {
      overflow: visible !important;
    }
    /* During the morph, the lifted clone is what the user sees. The actual
       dp-card + photos/social/info/footer in the panel are hidden via opacity
       and fade in once .dp-morphing comes off. */
    #detail-panel.dp-morphing .dp-card,
    #detail-panel.dp-morphing .detail-new-photos-wrap,
    #detail-panel.dp-morphing .social-card,
    #detail-panel.dp-morphing .dp-action-row,
    #detail-panel.dp-morphing .info-list,
    #detail-panel.dp-morphing .secondary-row {
      opacity: 0;
      pointer-events: none;
    }
    #detail-panel.dp-morphing #fts-slot,
    #detail-panel.dp-morphing .dp-tl-labels {
      display: none;
    }
    /* dp-card during morph: matches the source venue-card exactly so the FLIP
       transform doesn't introduce a visual size jump. z-index lifts it above
       the panel container so it stays visible regardless of stacking context.
       JS animates the dp-card from this small-card state to its full dp-card
       size after the morph. */
    #detail-panel.dp-morphing .dp-card {
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 0;
      position: relative;
      z-index: 5;
      transform-origin: 0 0;
      will-change: transform;
    }
    #detail-panel.dp-morphing .dp-card .card-new-name      { font-size: 15px; }
    #detail-panel.dp-morphing .dp-card .card-new-meta      { font-size: 11px; }
    #detail-panel.dp-morphing .dp-card .card-new-hero-main { font-size: 14px; }
    #detail-panel.dp-morphing .dp-card .card-new-hero-sub  { font-size: 11px; }
    /* When .dp-morphing comes off, dp-card scales up + content fades in. */
    #detail-panel .dp-card {
      transition: padding 0.28s ease, border-radius 0.28s ease;
    }
    #detail-panel .dp-card .card-new-name,
    #detail-panel .dp-card .card-new-meta,
    #detail-panel .dp-card .card-new-hero-main,
    #detail-panel .dp-card .card-new-hero-sub {
      transition: font-size 0.28s ease;
    }
    #detail-panel .detail-new-photos-wrap,
    #detail-panel .social-card,
    #detail-panel .dp-action-row,
    #detail-panel .info-list,
    #detail-panel .secondary-row {
      transition: opacity 0.22s ease 0.06s;
    }
    #dp-handle { display: flex; }
    #dp-scroll { padding-top: 4px; }
    .dp-photos { margin-top: 0; }
    /* Back button style on mobile: chevron + "Venues" */
    #dp-close-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      background: rgba(156,189,231,0.1);
      border: 1px solid rgba(156,189,231,0.2);
      border-radius: 8px;
      padding: 5px 10px;
      width: auto;
      height: auto;
    }
    #dp-close-btn::before { content: '‹'; font-size: 16px; line-height: 1; }
    .dp-close-x    { display: none; }
    .dp-close-back { display: inline; }
    .dp-venue-name { font-size: 22px; }
    #dp-scroll { overflow-y: auto; }
  }

  /* ── Intro splash overlay ─────────────────────────────────────────────────── */
  #splash {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 9997;
    background: #FFDDCA;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    transition: background-color 0.5s ease;
    pointer-events: all;
    cursor: default;
  }
  #splash.bg-out {
    background-color: transparent;
    pointer-events: none;
  }
  #splash.done {
    pointer-events: none;
    visibility: hidden;
  }
  #splash-logo {
    width: 160px;
    height: auto;
    transition: opacity 0.4s ease;
  }
  #splash-logo.fade-out {
    opacity: 0;
  }
  #splash-loader {
    width: 28px;
    height: 28px;
    border: 2.5px solid rgba(255,175,133,0.3);
    border-top-color: #FFAF85;
    border-radius: 50%;
    animation: splash-spin 0.8s linear infinite;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #splash-loader.visible {
    opacity: 1;
  }
  #splash-loader.fade-out {
    opacity: 0;
  }
  @keyframes splash-spin {
    to { transform: rotate(360deg); }
  }

  /* Elements hidden during intro sequence */
  .intro-hidden {
    opacity: 0;
    pointer-events: none !important;
  }

  /* ── Sliding surfaces — will-change only on panels that translate ────────── */
  /* No will-change: backdrop-filter anywhere — it bloats GPU memory.          */
  #detail-panel, #ptb-cal-float { will-change: transform; }
  @media (max-width: 639px) {
    #panel { will-change: transform; }
  }

  /* ── Performance & accessibility — reduced transparency ─────────────────── */
  @media (prefers-reduced-transparency: reduce) {
    .glass-panel, .glass-card, .glass-action,
    #panel, #detail-panel, #qc-control-group, #search-dropdown,
    #profile-panel, #sort-panel, #hover-tooltip, #map-toast,
    #app-toast, .venue-card, .floating-card, .mapboxgl-popup-content,
    #qc-panel-inner, #edit-banner {
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      background: rgba(17, 30, 56, 0.97);
    }
  }

  /* ── Favorites heart button (card) ──────────────────────────────────────── */
  /* Passive heart indicator on venue card name */
  .card-fav-heart {
    margin-left: 4px;
    vertical-align: -1px;
    flex-shrink: 0;
  }

  /* (fav-filter-pill removed — favorites is now a sort mode) */

  /* (fav + bell buttons moved to .dp-header-icon) */

  /* ── Toast notification ─────────────────────────────────────────────────── */
  #app-toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(17,30,56,0.95);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 18px;
    border-radius: 12px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 9999;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  #app-toast.show, #app-toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── Social section (check-in, plans) ───────────────────────────────────── */
  /* No glass wrapper — sits directly on the panel so the dp-card stays the focal box. */
  .social-card {
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .social-btns {
    display: flex;
    gap: 8px;
  }
  .social-btn {
    flex: 1;
    height: 42px;
    border-radius: 999px;
    border: 1px solid rgba(156,189,231,0.22);
    background: linear-gradient(135deg, rgba(20,46,82,0.25), rgba(32,73,131,0.14)), rgba(20,46,82,0.30);
    box-shadow: inset 0 1px 0 rgba(255,242,235,0.14), inset 0 -1px 0 rgba(20,46,82,0.30);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .social-btn svg { flex-shrink: 0; }
  .social-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .social-btn-here {
    background: rgba(255,175,133,0.10);
    border-color: rgba(255,175,133,0.30);
    color: var(--accent);
  }
  .social-btn-here:hover {
    background: rgba(255,175,133,0.18);
  }
  .social-btn-active {
    background: var(--accent) !important;
    border-color: var(--accent) !important;
    color: var(--accent-on, #2a1a0c) !important;
  }
  .social-btn-active svg { stroke: var(--accent-on, #2a1a0c); }

  /* Friends row inside social card */
  .social-friends {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .social-friends-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    white-space: nowrap;
  }
  .social-friends-avatars {
    display: flex;
    gap: -4px;
  }
  .social-avatar {
    width: 26px; height: 26px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(20,46,82,0.8);
    margin-left: -6px;
  }
  .social-avatar:first-child { margin-left: 0; }
  .social-avatar-init {
    background: rgba(20,46,82,0.6);
    color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 600;
  }

  /* Plan items in detail panel */
  .detail-plan-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
    border-top: 1px solid rgba(156,189,231,0.08);
  }
  .plan-info { display: flex; flex-direction: column; gap: 2px; }
  .plan-when { font-size: 12px; color: var(--accent); font-weight: 600; }
  .plan-creator { font-size: 11px; color: var(--muted); }
  .plan-msg { font-size: 11px; color: var(--text); opacity: 0.7; }
  .plan-actions { display: flex; gap: 6px; }
  .plan-status { font-size: 11px; color: var(--muted); }
  .btn-accept {
    padding: 4px 12px;
    background: rgba(255,175,133,0.14);
    border: 1px solid var(--accent);
    border-radius: 8px;
    color: var(--accent);
    font-size: 11px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .btn-decline {
    padding: 4px 12px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 11px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }

  /* Social form overlay (shown inside social card) */
  .social-form-overlay {
    border-top: 1px solid rgba(156,189,231,0.12);
    padding-top: 10px;
  }
  .social-form-inner {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .social-form-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.5px;
  }
  .social-form-input {
    width: 100%;
    padding: 8px 10px;
    background: rgba(20,46,82,0.5);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    box-sizing: border-box;
  }
  .social-form-input:focus { outline: none; border-color: var(--accent); }
  .social-form-actions {
    display: flex;
    gap: 8px;
  }
  .social-form-btn {
    flex: 1;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid rgba(156,189,231,0.20);
    background: linear-gradient(135deg, rgba(20,46,82,0.25), rgba(32,73,131,0.14)), rgba(20,46,82,0.30);
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.15s;
  }
  .social-form-btn:hover { border-color: var(--accent); color: var(--accent); }
  .social-form-btn svg { flex-shrink: 0; }
  .social-form-btn-accent {
    background: rgba(255,175,133,0.12);
    border-color: rgba(255,175,133,0.30);
    color: var(--accent);
  }
  .social-form-btn-accent:hover { background: rgba(255,175,133,0.20); }

  .plan-friends-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 120px;
    overflow-y: auto;
  }
  .plan-friend-check {
    font-size: 12px;
    color: var(--text);
    display: flex; align-items: center; gap: 6px;
    cursor: pointer;
  }
  .plan-friend-check input { accent-color: var(--accent); }

  /* Going friend picker */
  .going-friend-picker {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .friends-empty {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    padding: 8px;
  }
  .friend-avatar-sm {
    width: 18px; height: 18px;
    border-radius: 50%;
    object-fit: cover;
    vertical-align: -3px;
  }
  .friend-avatar-sm-init {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(20,46,82,0.6);
    color: var(--muted);
    font-size: 9px;
    font-weight: 600;
  }

  /* ── Invite sheet (full-height takeover) ─────────────────────────────────── */
  .invite-backdrop {
    position: fixed;
    inset: 0;
    z-index: 1100;
    background: rgba(0,0,0,0);
    transition: background 0.3s ease;
  }
  .invite-backdrop.open { background: rgba(0,0,0,0.42); }

  /* While the invite sheet is open, hide the detail panel chrome and the FTS
     so the user sees a single surface (the invite sheet), not a stacked one.
     The detail panel state is preserved underneath; opacity restores on close. */
  body.invite-sheet-open #detail-panel,
  body.invite-sheet-open #fts,
  body.invite-sheet-open #qc-wrap,
  body.invite-sheet-open #floating-search,
  body.invite-sheet-open #floating-brand,
  body.invite-sheet-open #panel {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
  }

  .invite-sheet {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    max-height: 100svh;
    height: 100svh;
    border-radius: 0;
    /* Canonical Shades Glass — panel level. */
    background: var(--glass-panel-bg);
    backdrop-filter: var(--glass-blur-panel);
    -webkit-backdrop-filter: var(--glass-blur-panel);
    border: none;
    box-shadow: var(--glass-inset), 0 -12px 48px rgba(0,0,0,0.55);
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .invite-sheet.open { transform: translateY(0); }

  .invite-sheet-grabber {
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: rgba(156,189,231,0.25);
    margin: 8px auto 0;
    flex-shrink: 0;
  }

  .invite-sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px 14px;
    border-bottom: 1px solid rgba(156,189,231,0.12);
  }
  .invite-sheet-title {
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .invite-sheet-close {
    background: rgba(156,189,231,0.12);
    border: none;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--muted);
    flex-shrink: 0;
    margin-left: 12px;
    transition: background 0.12s, color 0.12s;
  }
  .invite-sheet-close:hover { background: rgba(156,189,231,0.22); color: var(--text); }

  .invite-sheet-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    -webkit-overflow-scrolling: touch;
  }

  /* ── Venue card ────────────────────────────────────────────────────────── */
  .invite-venue-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: 14px;
    background: var(--glass-card-bg);
    backdrop-filter: var(--glass-blur-card);
    -webkit-backdrop-filter: var(--glass-blur-card);
    border: var(--glass-border);
    box-shadow: var(--glass-inset);
  }
  .invite-venue-badge {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 30%, rgba(255,175,133,0.35), rgba(255,175,133,0.08) 70%);
    border: 1px solid rgba(255,175,133,0.30);
    font-size: 22px;
    line-height: 1;
  }
  .invite-venue-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .invite-venue-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .invite-venue-when {
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .invite-venue-sun {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .invite-venue-sun:empty { display: none; }

  /* ── Chat-bubble preview ───────────────────────────────────────────────── */
  .invite-bubble-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }
  .invite-bubble-caption {
    font-size: 11px;
    color: var(--muted);
    padding: 0 8px;
  }
  .invite-bubble {
    max-width: 88%;
    padding: 10px 14px;
    background: rgba(255,175,133,0.16);
    border: 1px solid rgba(255,175,133,0.22);
    border-radius: 18px 18px 4px 18px;
    color: var(--text);
    font-size: 14px;
    line-height: 1.4;
    word-break: break-word;
  }

  /* ── Friends section ───────────────────────────────────────────────────── */
  .invite-friends-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 4px 4px 0;
    margin-top: 2px;
  }
  .invite-friends-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .invite-friends-toggle {
    background: none;
    border: none;
    color: var(--accent);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 4px;
    transition: opacity 0.12s;
  }
  .invite-friends-toggle:hover { opacity: 0.8; }

  .invite-friend-search {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: var(--glass-border-light);
    background: rgba(20,46,82,0.35);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    outline: none;
  }
  .invite-friend-search:focus { border-color: rgba(255,175,133,0.40); }
  .invite-friend-search::placeholder { color: var(--muted); }

  .invite-friends-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
    margin: 0 -4px;
  }

  .invite-friend-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    border-radius: 12px;
    cursor: pointer;
    user-select: none;
    transition: background 0.12s;
    -webkit-tap-highlight-color: transparent;
  }
  .invite-friend-row:hover,
  .invite-friend-row:focus-visible { background: var(--accent-dim); outline: none; }
  .invite-friend-row[hidden] { display: none; }

  .invite-friend-avatar-wrap {
    position: relative;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
  }
  .invite-friend-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(156,189,231,0.20);
    transition: border-color 0.15s, transform 0.15s;
  }
  .invite-friend-init {
    background: rgba(20,46,82,0.60);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
  }
  .invite-friend-row[aria-checked="true"] .invite-friend-avatar {
    border-color: var(--accent);
    transform: scale(0.94);
  }
  .invite-friend-check {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-on, #2a1a0c);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--bg);
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 0.15s, transform 0.15s;
    pointer-events: none;
  }
  .invite-friend-row[aria-checked="true"] .invite-friend-check {
    opacity: 1;
    transform: scale(1);
  }

  .invite-friend-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Empty state ──────────────────────────────────────────────────────── */
  .invite-empty-card {
    text-align: center;
    padding: 28px 20px;
    border-radius: 14px;
    background: var(--glass-card-bg);
    backdrop-filter: var(--glass-blur-card);
    -webkit-backdrop-filter: var(--glass-blur-card);
    border: var(--glass-border);
    box-shadow: var(--glass-inset);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .invite-empty-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(156,189,231,0.10);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .invite-empty-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }
  .invite-empty-sub {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.4;
  }

  /* ── Footer (dual actions) ─────────────────────────────────────────────── */
  .invite-sheet-footer {
    padding: 10px 20px calc(20px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid rgba(156,189,231,0.12);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .invite-actions-helper {
    font-size: 11px;
